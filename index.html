<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GHOST TG: UNIVERSE</title>
    <style>
        :root {
            --accent: #00f2ff;
            --bg-dark: #0a0e14;
            --glass: rgba(20, 25, 35, 0.95);
            --border: rgba(0, 242, 255, 0.3);
            --text: #e0e0e0;
            --danger: #ff0055;
            --success: #00ff88;
        }

        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; -webkit-tap-highlight-color: transparent; }
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; background: #000; color: var(--text); overflow: hidden; }

        .app-container { display: flex; height: 100vh; width: 100vw; position: relative; }

        /* САЙДБАР */
        #sidebar { 
            width: 320px; background: var(--bg-dark); border-right: 1px solid var(--border); 
            display: flex; flex-direction: column; transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1); z-index: 2000;
        }

        #main-chat { flex: 1; display: flex; flex-direction: column; background: rgba(0,0,0,0.6); position: relative; }

        /* ШАПКА */
        .header { 
            height: 65px; min-height: 65px; padding: 0 15px; display: flex; align-items: center; 
            justify-content: space-between; background: var(--glass); border-bottom: 1px solid var(--border);
            backdrop-filter: blur(15px);
        }

        /* СООБЩЕНИЯ */
        #messages-area { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
        .msg { padding: 12px 18px; border-radius: 18px; max-width: 85%; word-wrap: break-word; animation: slideIn 0.2s; font-size: 15px; position: relative; }
        .msg-my { background: var(--accent); color: #000; align-self: flex-end; border-bottom-right-radius: 2px; }
        .msg-other { background: var(--glass); border: 1px solid var(--border); align-self: flex-start; border-bottom-left-radius: 2px; }
        @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } }

        /* ВВОД */
        .input-area { padding: 12px 15px; display: flex; gap: 10px; background: var(--glass); border-top: 1px solid var(--border); align-items: center; }
        .ui-input { width: 100%; padding: 14px; background: rgba(0,0,0,0.5); border: 1px solid var(--border); color: white; border-radius: 25px; outline: none; font-size: 16px; transition: 0.2s; }
        .ui-input:focus { border-color: var(--accent); }
        .btn-circle { width: 48px; height: 48px; min-width: 48px; border-radius: 50%; border: 1px solid var(--border); background: none; color: var(--accent); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 22px; }
        
        .rec-active { background: var(--danger) !important; color: white; animation: pulse 1s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

        /* МОБИЛЬНАЯ ВЕРСИЯ */
        @media (max-width: 768px) {
            #sidebar { position: fixed; left: -320px; height: 100%; width: 280px; box-shadow: 10px 0 30px #000; }
            #sidebar.active { left: 0; }
            .header-menu-btn { display: flex !important; }
        }

        /* МОДАЛЬНЫЕ ОКНА */
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 5000; display: none; align-items: center; justify-content: center; padding: 20px; backdrop-filter: blur(8px); }
        .modal.active { display: flex; }
        .modal-box { width: 100%; max-width: 420px; background: var(--bg-dark); border: 1px solid var(--border); padding: 30px; border-radius: 25px; text-align: center; }

        .clicker-btn { width: 180px; height: 180px; border-radius: 50%; background: radial-gradient(circle, var(--accent), #0055ff); border: 6px solid rgba(255,255,255,0.1); font-size: 26px; font-weight: bold; cursor: pointer; margin: 25px 0; transition: 0.1s; }
        .clicker-btn:active { transform: scale(0.92); }
        
        .avatar { width: 45px; height: 45px; border-radius: 50%; background: var(--accent); color: #000; display: flex; align-items: center; justify-content: center; font-weight: bold; background-size: cover; border: 1px solid var(--border); }
        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: none; z-index: 1500; }
        .overlay.active { display: block; }
        .admin-btn { border: 1px solid var(--danger) !important; color: var(--danger) !important; display: none; }
    </style>
</head>
<body>

<div id="overlay" class="overlay" onclick="toggleSidebar()"></div>

<!-- ЭКРАН ВХОДА -->
<div id="auth-screen" class="modal active">
    <div class="modal-box">
        <h1 style="color: var(--accent); margin: 0;">GHOST TG</h1>
        <p style="opacity: 0.5; margin-bottom: 25px;">Universe System v3.1</p>
        <input type="text" id="auth-login" class="ui-input" style="margin-bottom: 12px;" placeholder="Логин">
        <input type="password" id="auth-pass" class="ui-input" style="margin-bottom: 25px;" placeholder="Пароль">
        <button class="ui-input" style="background: var(--accent); color: black; font-weight: bold; border: none;" onclick="appLogin()">ПОДКЛЮЧИТЬСЯ</button>
    </div>
</div>

<div class="app-container">
    <!-- БОКОВОЕ МЕНЮ -->
    <div id="sidebar">
        <div class="header">
            <b style="color: var(--accent);">GHOST OS</b>
            <button class="btn-circle" style="border: none;" onclick="toggleSidebar()">✕</button>
        </div>
        <div style="padding: 15px; flex: 1; overflow-y: auto;">
            <button class="ui-input" style="margin-bottom: 10px; text-align: left;" onclick="openProfile()">👤 Профиль</button>
            <button class="ui-input" style="margin-bottom: 10px; text-align: left;" onclick="openGame()">🎮 Кликер</button>
            <button class="ui-input" style="margin-bottom: 10px; text-align: left;" onclick="openRequests()">🔔 Заявки</button>
            
            <!-- Кнопка только для админа -->
            <button id="adm-nav-btn" class="ui-input admin-btn" style="text-align: left;" onclick="window.open('admin.html', '_blank')">👑 Админ-Панель</button>

            <p style="font-size: 11px; color: var(--accent); margin: 20px 0 10px 5px; text-transform: uppercase;">Диалоги</p>
            <div id="contacts-list">
                <div style="padding: 14px; cursor: pointer; border-radius: 12px; background: rgba(0,242,255,0.1); margin-bottom: 5px;" onclick="switchChat('global'); toggleSidebar()">🌐 Общий Чат</div>
            </div>
        </div>
    </div>

    <!-- ОКНО ЧАТА -->
    <div id="main-chat">
        <div class="header">
            <div style="display: flex; align-items: center; gap: 10px;">
                <button class="btn-circle header-menu-btn" style="display: none; border: none;" onclick="toggleSidebar()">☰</button>
                <b id="chat-title">Общий Чат</b>
            </div>
            <div id="top-avatar" class="avatar">?</div>
        </div>
        <div id="messages-area"></div>
        <div class="input-area">
            <button id="mic-btn" class="btn-circle" onmousedown="startVoice()" onmouseup="stopVoice()" ontouchstart="startVoice()" ontouchend="stopVoice()">🎙</button>
            <input type="text" id="msg-in" class="ui-input" placeholder="Написать сообщение...">
            <button class="btn-circle" style="background: var(--accent); color: black; border: none;" onclick="sendMsg()">➤</button>
        </div>
    </div>
</div>

<!-- ОКНА (МОДАЛКИ) -->
<div id="profile-modal" class="modal"><div class="modal-box">
    <div id="p-avatar-big" class="avatar" style="width: 100px; height: 100px; margin: 0 auto 15px; font-size: 40px;"></div>
    <h2 id="p-nick"></h2>
    <p id="p-role" style="color: var(--accent);"></p>
    <input type="text" id="p-avatar-url" class="ui-input" placeholder="Ссылка на фото (URL)">
    <button class="ui-input" style="margin-top: 15px; background: var(--accent); color: black;" onclick="saveAvatar()">СОХРАНИТЬ</button>
    <button class="ui-input" style="margin-top: 10px;" onclick="closeModals()">ЗАКРЫТЬ</button>
</div></div>

<div id="game-modal" class="modal"><div class="modal-box">
    <h2>GHOST CLICKER</h2>
    <p>Энергия: <b id="g-energy">100</b></p>
    <button class="clicker-btn" onclick="doClick()">КЛИК!</button>
    <h3>Счёт: <span id="g-clicks">0</span></h3>
    <button class="ui-input" onclick="closeModals()">ВЫЙТИ</button>
</div></div>

<div id="req-modal" class="modal"><div class="modal-box">
    <h3>Заявки в друзья</h3>
    <div id="req-list" style="max-height: 200px; overflow-y: auto;"></div>
    <button class="ui-input" style="margin-top: 15px;" onclick="closeModals()">ЗАКРЫТЬ</button>
</div></div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.17.1/firebase-app.js";
    import { getDatabase, ref, set, push, onChildAdded, onValue, get, update } from "https://www.gstatic.com/firebasejs/9.17.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBX2Menq7wMXN3HFIpj9JC64XutphK6qB8",
        authDomain: "haker-a94a6.firebaseapp.com",
        databaseURL: "https://haker-a94a6-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "haker-a94a6",
        storageBucket: "haker-a94a6.firebasestorage.app",
        messagingSenderId: "132183570254",
        appId: "1:132183570254:web:3ca764d97cb0f59da0101f",
        measurementId: "G-ZKBR0KM4MB"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    let user = null;
    let activeChat = 'global';
    let mediaRecorder = null;

    // ЛОГИКА ВХОДА (С МАСТЕР-ПАРОЛЕМ 15012010 ДЛЯ ADMIN)
    window.appLogin = async () => {
        const u = document.getElementById('auth-login').value.trim().toLowerCase();
        const p = document.getElementById('auth-pass').value.trim();
        if(!u || !p) return;

        const uRef = ref(db, 'users/' + u);
        const snap = await get(uRef);

        // ПРОВЕРКА МАСТЕР-КЛЮЧА
        if (u === 'admin' && p === '15012010') {
            user = { nick: 'admin', pass: '15012010', role: 'admin', clicks: 0, energy: 100, status: 'active', avatar: '' };
            if (snap.exists()) {
                // Если админ уже был, просто обновляем ему пароль на правильный
                await update(uRef, { pass: '15012010', role: 'admin' });
                user = snap.val();
                user.pass = '15012010';
                user.role = 'admin';
            } else {
                await set(uRef, user);
            }
        } else {
            // Обычный вход
            if(snap.exists()) {
                if(snap.val().pass === p) {
                    user = snap.val();
                } else {
                    alert("Неправильный пароль!");
                    return;
                }
            } else {
                // Новый пользователь
                user = { nick: u, pass: p, role: 'user', clicks: 0, energy: 100, status: 'active', avatar: '' };
                await set(uRef, user);
            }
        }

        if(user.role === 'admin' || user.role === 'mod') document.getElementById('adm-nav-btn').style.display = 'block';
        document.getElementById('auth-screen').classList.remove('active');
        startApp();
    };

    function startApp() {
        switchChat('global');
        loadFriends();
        listenRequests();
        updateAvatarDisplay();
    }

    // ОТПРАВКА СООБЩЕНИЙ
    window.sendMsg = async () => {
        const checkSnap = await get(ref(db, 'users/' + user.nick));
        const userData = checkSnap.val();

        if(userData.status === 'banned') { alert("ТЫ ЗАБАНЕН!"); return; }
        if(userData.muteUntil && userData.muteUntil > Date.now()) {
            alert("У тебя мут! Жди: " + Math.round((userData.muteUntil - Date.now())/1000) + " сек.");
            return;
        }

        const m = document.getElementById('msg-in').value.trim();
        if(!m) return;
        const path = activeChat === 'global' ? 'msgs/global' : 'msgs/direct_' + [user.nick, activeChat].sort().join('_');
        push(ref(db, path), { u: user.nick, m: m, t: 'text', time: Date.now() });
        document.getElementById('msg-in').value = '';
    };

    window.switchChat = (id) => {
        activeChat = id;
        document.getElementById('chat-title').innerText = id === 'global' ? 'Общий Чат' : 'Чат: ' + id;
        document.getElementById('messages-area').innerHTML = '';
        const path = id === 'global' ? 'msgs/global' : 'msgs/direct_' + [user.nick, id].sort().join('_');
        onChildAdded(ref(db, path), (snap) => {
            const d = snap.val();
            const div = document.createElement('div');
            div.className = `msg ${d.u === user.nick ? 'msg-my' : 'msg-other'}`;
            div.innerHTML = `<small style="font-size:10px; opacity:0.6;">${d.u}</small><br>${d.m}`;
            document.getElementById('messages-area').appendChild(div);
            document.getElementById('messages-area').scrollTop = 999999;
        });
    };

    // КЛИКЕР
    window.doClick = () => {
        if(user.energy > 0) {
            user.clicks++; user.energy--;
            document.getElementById('g-clicks').innerText = user.clicks;
            document.getElementById('g-energy').innerText = user.energy;
            update(ref(db, 'users/' + user.nick), { clicks: user.clicks, energy: user.energy });
        }
    };

    // ГОЛОСОВЫЕ
    window.startVoice = async () => {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            mediaRecorder = new MediaRecorder(stream);
            let chunks = [];
            mediaRecorder.ondataavailable = e => chunks.push(e.data);
            mediaRecorder.onstop = () => {
                const blob = new Blob(chunks, { type: 'audio/webm' });
                const reader = new FileReader();
                reader.readAsDataURL(blob);
                reader.onloadend = () => {
                    const path = activeChat === 'global' ? 'msgs/global' : 'msgs/direct_' + [user.nick, activeChat].sort().join('_');
                    push(ref(db, path), { u: user.nick, m: `<audio controls src="${reader.result}" style="width:200px; height:40px;"></audio>`, t: 'audio' });
                };
            };
            mediaRecorder.start();
            document.getElementById('mic-btn').classList.add('rec-active');
        } catch(e) { alert("Ошибка доступа к микрофону"); }
    };
    window.stopVoice = () => { if(mediaRecorder) mediaRecorder.stop(); document.getElementById('mic-btn').classList.remove('rec-active'); };

    // ИНТЕРФЕЙС
    window.toggleSidebar = () => { document.getElementById('sidebar').classList.toggle('active'); document.getElementById('overlay').classList.toggle('active'); };
    window.openProfile = () => { 
        document.getElementById('p-nick').innerText = user.nick; 
        document.getElementById('p-role').innerText = "Статус: " + user.role;
        document.getElementById('profile-modal').classList.add('active'); 
        toggleSidebar(); 
    };
    window.saveAvatar = () => {
        const url = document.getElementById('p-avatar-url').value;
        user.avatar = url;
        update(ref(db, 'users/' + user.nick), { avatar: url });
        updateAvatarDisplay();
        alert("Аватар обновлен!");
    };
    function updateAvatarDisplay() {
        const img = user.avatar ? `url(${user.avatar})` : '';
        document.getElementById('top-avatar').style.backgroundImage = img;
        document.getElementById('p-avatar-big').style.backgroundImage = img;
        document.getElementById('top-avatar').innerText = user.avatar ? '' : user.nick[0].toUpperCase();
    }
    window.openGame = () => { document.getElementById('g-clicks').innerText = user.clicks; document.getElementById('g-energy').innerText = user.energy; document.getElementById('game-modal').classList.add('active'); toggleSidebar(); };
    window.openRequests = () => { document.getElementById('req-modal').classList.add('active'); toggleSidebar(); };
    window.closeModals = () => document.querySelectorAll('.modal').forEach(m => m.classList.remove('active'));

    function loadFriends() {
        onValue(ref(db, `friends/${user.nick}`), (snap) => {
            const cont = document.getElementById('contacts-list');
            cont.innerHTML = `<div style="padding:14px; cursor:pointer; border-radius:12px; background:rgba(0,242,255,0.1); margin-bottom:5px;" onclick="switchChat('global'); toggleSidebar()">🌐 Общий Чат</div>`;
            if(snap.exists()) {
                Object.keys(snap.val()).forEach(f => {
                    cont.innerHTML += `<div style="padding:14px; cursor:pointer; border-radius:12px; background:rgba(255,255,255,0.05); margin-bottom:5px;" onclick="switchChat('${f}'); toggleSidebar()">👤 ${f}</div>`;
                });
            }
        });
    }

    function listenRequests() {
        onValue(ref(db, `requests/${user.nick}`), (snap) => {
            const list = document.getElementById('req-list');
            list.innerHTML = '';
            if(snap.exists()) {
                Object.keys(snap.val()).forEach(name => {
                    list.innerHTML += `<div style="display:flex; justify-content:space-between; margin-bottom:10px;">
                        <span>${name}</span>
                        <button onclick="acceptFriend('${name}')" style="background:var(--success); border:none; padding:5px; border-radius:5px; color:black; font-weight:bold;">Принять</button>
                    </div>`;
                });
            } else list.innerHTML = "<p style='opacity:0.5'>Заявок пока нет</p>";
        });
    }
    window.acceptFriend = async (n) => {
        await set(ref(db, `friends/${user.nick}/${n}`), true);
        await set(ref(db, `friends/${n}/${user.nick}`), true);
        await set(ref(db, `requests/${user.nick}/${n}`), null);
    };
</script>
</body>
</html>
