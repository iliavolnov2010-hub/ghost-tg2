class DB {
  constructor(p){
    this.p = p;

    const firebaseConfig = {
      apiKey: CFG.apiKey,
      databaseURL: CFG.dbUrl
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }

    this.rdb = firebase.database();
  }

  path(path){
    return this.p + String(path).replace(/\//g,"_");
  }

  async set(path, value){
    await this.rdb.ref(this.path(path)).set(value);
    return value;
  }

  async get(path, fb=null){
    try{
      const snap = await this.rdb.ref(this.path(path)).get();
      if(snap.exists()) return snap.val();
      return fb;
    }catch(e){
      return fb;
    }
  }

  g(path, fb=null){
    const raw = localStorage.getItem(this.path(path));
    if(raw){
      try{return JSON.parse(raw)}catch(e){}
    }
    return fb;
  }

  s(path, value){
    localStorage.setItem(this.path(path), JSON.stringify(value));

    this.set(path, value);

    return value;
  }

  rm(path){
    localStorage.removeItem(this.path(path));
    this.rdb.ref(this.path(path)).remove();
  }

  id(p="id"){
    return p + "_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2,8);
  }

  async syncUsers(){
    const snap = await this.rdb.ref(this.path("users_index")).get();

    if(!snap.exists()) return [];

    const ids = snap.val() || [];

    for(const id of ids){
      const us = await this.rdb.ref(this.path(`users/${id}`)).get();
      if(us.exists()){
        localStorage.setItem(this.path(`users/${id}`), JSON.stringify(us.val()));
      }
    }

    localStorage.setItem(this.path("users_index"), JSON.stringify(ids));

    return ids;
  }

  allUsers(){
    const ids = this.g("users_index", []) || [];
    return ids.map(id => this.g(`users/${id}`, null)).filter(Boolean);
  }

  saveUser(u){
    this.s(`users/${u.id}`, u);

    let ids = this.g("users_index", []);
    if(!Array.isArray(ids)) ids=[];

    if(!ids.includes(u.id)){
      ids.push(u.id);
      this.s("users_index", ids);
    }
  }

  byLogin(login){
    const x = String(login || "").trim().toLowerCase();
    return this.allUsers().find(u => String(u.login||"").toLowerCase() === x) || null;
  }

  seed(){
    if (this.g("seeded", false)) return;

    const dev = userFactory("zuhra","755275260","user");

    dev.vkId = CFG.devId;
    dev.vk = CFG.devVk;

    this.saveUser(dev);

    this.s("global_chat/messages", [
      {
        id: this.id("msg"),
        senderId: "system",
        text: "Добро пожаловать в TgXq",
        at: Date.now(),
        system: true
      }
    ]);

    this.s("seeded", true);
  }

  getChatIndex(){
    const v = this.g("private_chat_index", []);
    return Array.isArray(v) ? v : [];
  }

  rememberChat(chatId){
    if (!chatId) return;

    let idx = this.getChatIndex();

    if(!idx.includes(chatId)){
      idx.push(chatId);
      this.s("private_chat_index", idx);
    }
  }
}

      renderAuth(){

          <div class="meta">Админ-данные не отображаются в интерфейсе. Разработчик: <a href="${CFG.devVk}" target="_blank" style="color:var(--c1)">id755275260</a>.</div>
        </section>`;

      renderApp(){
        const isAdmin = S.user.role === "admin", isMod = S.user.role === "moderator";
        this.root.innerHTML = `<section class="shell app">
          <header class="top">
            <div class="identity"><div class="avatar">${this.esc((S.user.login||"T")[0]).toUpperCase()}</div><div><strong>${this.nameBy(S.user)}</strong><div class="meta">${this.roleText(S.user)} · TgXq</div></div></div>
            <div class="coins">💰 <span id="coinsNow">${Math.floor(S.user.coins).toLocaleString("ru-RU")}</span></div>
            <button id="bellBtn" class="iconbtn ghost">🔔<span id="bellBadge" class="badge" style="${S.user.unreadSystem ? "" : "display:none"}">${S.user.unreadSystem || 0}</span></button>
          </header>
          <main id="screenHost" class="screen"></main>
          <nav class="nav">
            <button data-s="clicker"><b>✨</b><span>Кликер</span></button>

            <button data-s="chat"><b>💬</b><span>Чаты</span></button>

            <button data-s="profile"><b>👤</b><span>Профиль</span></button>
            <button data-s="settings"><b>⚙️</b><span>Настройки</span></button>
            ${(isAdmin || isMod) ? `<button data-s="${isAdmin ? "admin":"moderator"}"><b>🛡️</b><span>${isAdmin ? "Админ":"Мод"}</span></button>` : `<button style="visibility:hidden"><b>•</b><span>•</span></button>`}

        document.querySelectorAll("[data-s]").forEach(b => b.onclick = () => this.renderScreen(b.dataset.s));
        document.getElementById("bellBtn").onclick = () => app.chat.openSystem();

      renderScreen(sc){
        if (sc === "admin" && S.user.role !== "admin") sc = "clicker";
        if (sc === "moderator" && S.user.role !== "moderator" && S.user.role !== "admin") sc = "clicker";
        S.screen = sc;
        document.querySelectorAll(".nav button").forEach(b => b.classList.toggle("active", b.dataset.s === sc));

    class Auth {
      constructor(db,ui){ this.db=db; this.ui=ui; }
      init(){
        const ses = this.db.g("session", null);
        if (ses){ const u = this.db.g(`users/${ses.userId}`, null); if (u) return this.loginUser(u, true); }
        this.ui.renderAuth();
        document.getElementById("tabLogin").onclick = () => {
          document.getElementById("loginCard").style.display = "block";
          document.getElementById("regCard").style.display = "none";
          document.getElementById("tabLogin").className = "chip active";
          document.getElementById("tabReg").className = "chip ghost";
        };
        document.getElementById("tabReg").onclick = () => {
          document.getElementById("loginCard").style.display = "none";
          document.getElementById("regCard").style.display = "block";
          document.getElementById("tabLogin").className = "chip ghost";
          document.getElementById("tabReg").className = "chip active";
        };
        document.getElementById("goLogin").onclick = () => this.login();
        document.getElementById("goReg").onclick = () => this.register();
      }
      login(){
        const login = document.getElementById("authLoginIn").value.trim();
        const pass = document.getElementById("authPassIn").value;
        if (!login || !pass) return this.ui.toast("Введите логин и пароль");
        if (login === CFG.adminLogin && pass === CFG.adminPassword){
          let a = this.db.g("users/admin", null);
          if (!a){ a = userFactory(CFG.adminLogin, CFG.adminPassword, "admin"); a.coins = 999999999; this.db.saveUser(a); }
          return this.loginUser(a);
        }
        const modCreds = this.db.g("moderators_credentials", {});
        const m = Object.values(modCreds).find(x => x.login === login && x.password === pass && x.active !== false);
        if (m){
          const mu = this.db.g(`users/${m.userId}`, null);
          if (!mu) return this.ui.toast("Модераторский профиль не найден");
          mu.role = "moderator"; mu.rank = m.rank || "ml.модер"; this.db.saveUser(mu);
          return this.loginUser(mu);
        }
        const u = this.db.byLogin(login);
        if (!u || u.password !== pass) return this.ui.toast("Неверный логин/пароль");
        if (u.bannedUntil && u.bannedUntil > Date.now()) return this.ui.toast("Вы забанены");
        this.loginUser(u);
      }
      register(){
        const login = document.getElementById("authLoginUp").value.trim();
        const pass = document.getElementById("authPassUp").value;
        const vk = document.getElementById("authVkUp").value.trim();
        if (!login || !pass) return this.ui.toast("Введите логин и пароль");
        if (this.db.byLogin(login)) return this.ui.toast("Логин уже занят");
        const u = userFactory(login, pass, "user");
        u.vk = vk.startsWith("http") ? vk : ""; u.vkId = (vk.match(/\d+/) || [""])[0];
        this.db.saveUser(u);
        this.loginUser(u);
      }
      loginUser(u, restored=false){
        const now = Date.now(), away = Math.max(0, now - (u.lastLogin || now));
        S.user = u; u.lastLogin = now;
        this.db.s("session", { userId: u.id, at: now });
        app.econ.applyOffline(away);
        this.ui.saveMe();
        this.ui.renderApp();
        if (!restored) this.ui.toast("Вход выполнен");
      }
      logout(){ this.db.rm("session"); S.user = null; location.reload(); }
    }

    class Economy {
      constructor(db,ui){ this.db=db; this.ui=ui; }
      mult(){ let b = 1; (S.user.prefixes||[]).forEach(id => { const p = DATA.prefixes.find(x => x.id === id); if (p) b += p.income; }); return b; }
      clickVal(){ const cm = 1 + (Math.min(5,S.combo)-1)*.25; return Math.max(1, (S.user.clickPower + (S.user.upgrades.clickPower||0)) * cm * this.mult()); }
      add(amount, reason="income"){
        S.user.coins = Math.max(0, Number(S.user.coins||0) + amount);
        S.user.transactions.push({ id: this.db.id("tx"), amount, reason, at: Date.now() });
        if (amount > 0) this.addXp(amount);
        this.auto500k();
        this.ui.saveMe();
      }
      spend(a){ if (S.user.coins < a){ this.ui.toast("Недостаточно монет"); return false; } this.add(-a,"spend"); return true; }
      addXp(x){
        S.user.xp += Math.max(0,x);
        while (S.user.xp >= 500 * S.user.level){
          S.user.xp -= 500 * S.user.level; S.user.level++; S.user.clickPower += 2; S.user.maxEnergy += 10; S.user.energy = S.user.maxEnergy;
          this.ui.toast("Новый уровень: " + S.user.level);
        }
      }
      regen(){ if (!S.user) return; S.user.energy = Math.min(S.user.maxEnergy, (S.user.energy||0)+0.5); if (S.screen === "clicker") app.clicker.refresh(); }
      passive(){
        if (!S.user) return;
        const p = (S.user.upgrades.passiveIncome||0) * 0.5;
        const a = (S.user.upgrades.autoClicker||0) * 0.3 / 20;
        const inc = (p+a) * this.mult();
        if (inc > 0) this.add(inc, "passive");
      }
      applyOffline(ms){
        if (!S.user) return;
        const sec = Math.floor(ms/1000);
        const p = (S.user.upgrades.passiveIncome||0) * 0.5;
        const a = (S.user.upgrades.autoClicker||0) * 0.3 / 20;
        const earn = Math.min(5000, Math.floor(sec * (p+a) * this.mult()));
        if (earn > 0){ S.user.coins += earn; setTimeout(()=>this.ui.toast(`Оффлайн доход: +${earn}`), 300); }
      }
      daily(){
        const t = new Date().toISOString().slice(0,10);
        if (S.user.dailyRewards.lastClaim === t) return this.ui.toast("Сегодня уже забрано");
        const y = new Date(Date.now() - 86400000).toISOString().slice(0,10);
        S.user.dailyRewards.streak = S.user.dailyRewards.lastClaim === y ? S.user.dailyRewards.streak + 1 : 1;
        S.user.dailyRewards.lastClaim = t;
        const b = 50 * S.user.dailyRewards.streak;
        this.add(b,"daily");
        this.ui.toast(`Ежедневная награда: +${b}`);
      }
      mystery(){
        if (!this.spend(1000)) return;
        const pool = [200,500,1000,2000,5000,-300];
        const r = pool[Math.floor(Math.random()*pool.length)];
        this.add(r,"mystery");
        this.ui.toast(r >= 0 ? `Mystery Box: +${r}` : `Mystery Box: ${r}`);
      }
      auto500k(){
        if (S.user.role !== "user" || S.user.promotedAt500k || S.user.coins < 500000) return;
        S.user.promotedAt500k = true;
        app.moder.grant(S.user.id, "auto_500k");
      }
    }

      render(el){

        if (b) b.style.width = `${Math.max(0,Math.min(100,S.user.energy / S.user.maxEnergy * 100))}%`;

      }
      click(e){
        const n = Date.now();
        if (n < S.blockedTo) return this.ui.toast("Античит: временный блок");
        S.cps = S.cps.filter(t => n - t < 1000); S.cps.push(n);
        if (S.cps.length > 20){ S.blockedTo = n + 2500; S.user.energy = 0; this.ui.saveMe(); this.refresh(); return this.ui.toast("Античит: слишком высокий CPS"); }
        if (S.user.energy < 1) return this.ui.toast("Энергия закончилась");
        S.combo = n - S.lastClick <= 700 ? Math.min(5, S.combo + 1) : 1; S.lastClick = n;
        S.user.energy -= 1;
        let val = app.econ.clickVal();
        if (Math.random() < 0.001){ const j = Math.floor(S.user.coins * 0.3); val += j; this.ui.toast(`Джекпот +${j}`); }
        app.econ.add(val, "click");
        this.float(e, "+" + Math.floor(val)); this.parts(e);
        if (navigator.vibrate) navigator.vibrate(10);
        this.refresh();
      }
      float(e, txt){
        const z = document.getElementById("zone"), r = z.getBoundingClientRect();
        const f = document.createElement("div"); f.className = "float"; f.textContent = txt; f.style.left = (e.clientX-r.left)+"px"; f.style.top = (e.clientY-r.top)+"px";
        z.appendChild(f); setTimeout(()=>f.remove(),800);
      }
      parts(e){
        const z = document.getElementById("zone"), r = z.getBoundingClientRect();
        for (let i=0;i<40;i++){
          const p = document.createElement("i"); p.className = "p"; const a = Math.random() * Math.PI * 2, d = 30 + Math.random() * 100;
          p.style.left = (e.clientX-r.left)+"px"; p.style.top = (e.clientY-r.top)+"px";
          p.style.color = i%3===0 ? "var(--c2)" : i%3===1 ? "var(--c1)" : "var(--c3)";
          p.style.setProperty("--dx", `${Math.cos(a)*d}px`); p.style.setProperty("--dy", `${Math.sin(a)*d}px`);
          z.appendChild(p); setTimeout(()=>p.remove(),760);
        }
      }
    }

      weighted(arr){ const tot = arr.reduce((s,x)=>s+x.w,0); let r = Math.random() * tot; for (const x of arr){ r -= x.w; if (r <= 0) return x; } return arr[arr.length-1]; }

            const mdl = document.querySelector(".modal");
            if (mdl) mdl.innerHTML = `<h2>${this.ui.esc(c.name)}</h2><div class="rollWrap"><div id="roll" class="roll">${preview.map(x => `<div class="rw">${this.ui.esc(x.label)}</div>`).join("")}</div></div><div class="meta">Рулетка запущена...</div>`;
            setTimeout(() => this.stopRoll(win, () => { this.applyReward(win); this.ui.closeModal(); this.ui.toast("Кейс: " + win.label); this.render(document.getElementById("screenHost")); }), 700);
          };
        }, 20);
      }
      stopRoll(win, done){
        const r = document.getElementById("roll"); if (!r) return done();
        const items = [...r.children];
        let idx = items.findIndex((el, i) => i > 24 && el.textContent === win.label); if (idx < 0) idx = 30;
        if (items[idx]) items[idx].textContent = win.label;
        r.classList.add("stop"); r.style.transform = `translateX(${-idx*150 + 190}px)`;
        setTimeout(done, 3900);
      }
      applyReward(r){
        const duplicateComp = reward => {
          const w = Number(reward.w || 100);
          if (w <= 0.2) return 120000;
          if (w <= 1) return 60000;
          if (w <= 3) return 25000;
          if (w <= 7) return 10000;
          return 3000;
        };
        if (r.t === "coins") app.econ.add(r.a, "case");
        if (!Array.isArray(S.user.prefixes)) S.user.prefixes = [];
        if (!Array.isArray(S.user.nickStyles)) S.user.nickStyles = [];
        if (r.t === "prefix"){
          if (S.user.prefixes.indexOf(r.id) === -1){
            S.user.prefixes.push(r.id); S.user.activePrefix = r.id;
          } else {
            const c = duplicateComp(r); app.econ.add(c, "duplicate_prefix"); this.ui.toast(`Дубликат префикса: +${c} монет`);
          }
        }
        if (r.t === "nick"){
          if (S.user.nickStyles.indexOf(r.id) === -1){
            S.user.nickStyles.push(r.id); S.user.activeNickStyle = r.id;
          } else {
            const c = duplicateComp(r); app.econ.add(c, "duplicate_nick"); this.ui.toast(`Дубликат стиля ника: +${c} монет`);
          }
        }
        if (r.t === "up") S.user.upgrades[r.f] = (S.user.upgrades[r.f]||0) + r.a;
        if (r.t === "mod") app.moder.grant(S.user.id, "god_case");
        this.ui.saveMe();
      }
    }

    class Chat {
      constructor(db,ui){ this.db=db; this.ui=ui; this.poll=null; }
      id(a,b){ return [a,b].sort().join("__"); }
      sysId(uid){ return this.id(uid,"system"); }
      chatTitleById(chatId){
        const parts = String(chatId || "").split("__");
        if (parts.length !== 2) return this.ui.esc(chatId);
        const a = this.db.g(`users/${parts[0]}`, null);
        const b = this.db.g(`users/${parts[1]}`, null);
        return `${this.ui.esc(a ? a.login : parts[0])} ↔ ${this.ui.esc(b ? b.login : parts[1])}`;
      }
      path(){
        if (S.chatType === "global") return "global_chat/messages";
        if (S.chatType === "system") return `private_chats/${this.sysId(S.user.id)}/messages`;
        return `private_chats/${S.chatId}/messages`;
      }
      render(el){
        el.innerHTML = `<div class="chatShell">
          <aside class="chatList"><div class="chatHead">Чаты</div><div id="chatItems" class="chatItems"></div></aside>
          <section class="chatMain"><div id="chatTitle" class="chatHead"></div><div id="msgs" class="msgs"></div>
          <form id="chatForm" class="compose"><input id="chatInput" placeholder="Сообщение"><button class="pri">➤</button></form></section>
        </div>`;
        document.getElementById("chatForm").onsubmit = e => { e.preventDefault(); this.send(); };
        this.renderList(); this.renderMsgs();
        clearInterval(this.poll);
        this.poll = setInterval(() => { if (S.screen === "chat") this.renderMsgs(); }, 5000);
      }
      renderList(){
        app.friends.sync();
        const list = [{ id: "global", type: "global", name: "🌐 Общий чат" }, { id: this.sysId(S.user.id), type: "system", name: "🔔 Система" }];
        Object.keys(S.user.friends || {}).forEach(fid => {
          const f = this.db.g(`users/${fid}`, null);
          if (f) list.push({ id: this.id(S.user.id,fid), type: "private", name: f.login });
        });
        if (S.user.role === "admin" || S.user.role === "moderator"){
          this.db.getChatIndex().forEach(chatId => {
            const msgs = this.db.g(`private_chats/${chatId}/messages`, []);
            if (msgs.length && !list.some(c => c.id === chatId)) list.push({ id: chatId, type: "review", name: "👁 " + this.chatTitleById(chatId) });
          });
        }
        const box = document.getElementById("chatItems");
        box.innerHTML = list.map(c => `<button class="chatItem ${S.chatId===c.id|| (c.type==="global"&&S.chatType==="global") ? "active":""}" data-id="${this.ui.esc(c.id)}" data-type="${c.type}"><span>${c.type==="global"?"🌍":c.type==="system"?"🔔":"💬"}</span><div><b>${this.ui.esc(c.name)}</b><div class="meta">${c.type==="private"?"личный чат":c.type==="review"?"просмотр ЛС":" "}</div></div></button>`).join("");
        box.querySelectorAll("[data-id]").forEach(b => b.onclick = () => {
          S.chatId = b.dataset.id; S.chatType = b.dataset.type;
          if (S.chatType === "system"){ S.user.unreadSystem = 0; this.ui.saveMe(); }
          this.render(document.getElementById("screenHost"));
        });
      }
      canSend(){
        const fresh = this.db.g(`users/${S.user.id}`, null); if (fresh) S.user = fresh;
        if (S.user.role === "admin" || S.user.role === "moderator") return true;
        if (S.user.bannedUntil && S.user.bannedUntil > Date.now()) return "Вы забанены";
        if (S.user.mutedUntil && S.user.mutedUntil > Date.now()) return "У вас мут";
        return true;
      }
      send(){
        const ok = this.canSend(); if (ok !== true) return this.ui.toast(ok);
        const inp = document.getElementById("chatInput");
        const txt = inp.value.trim(); if (!txt) return;
        if (S.chatType === "review") return this.ui.toast("Режим просмотра чужого ЛС");
        if (S.chatType === "private"){
          const ids = S.chatId.split("__");
          this.db.rememberChat(S.chatId);
          ids.filter(i => i !== S.user.id).forEach(i => {
            const o = this.db.g(`users/${i}`, null);
            if (o){ o.chats = [...new Set([...(o.chats||[]), S.chatId])]; this.db.saveUser(o); }
          });
          S.user.chats = [...new Set([...(S.user.chats||[]), S.chatId])];
          this.ui.saveMe();
        }
        this.detectBad(txt);
        const arr = this.db.g(this.path(), []);
        arr.push({ id: this.db.id("msg"), senderId: S.user.id, text: this.ui.esc(txt), at: Date.now() });
        this.db.s(this.path(), arr);
        inp.value = ""; this.renderMsgs();
      }
      detectBad(txt){
        const l = txt.toLowerCase();
        if (!DATA.badWords.some(w => l.indexOf(w) !== -1)) return;
        const v = this.db.g("violations", []);
        v.push({ id: this.db.id("v"), offenderId: S.user.id, text: this.ui.esc(txt), chatType: S.chatType, chatId: S.chatId, at: Date.now(), status: "new" });
        this.db.s("violations", v);
        this.db.allUsers().filter(u => u.role === "admin" || u.role === "moderator").forEach(u => this.sendSystem(u.id, `Анти-мат: ${S.user.login}: "${txt.slice(0,120)}"`));
      }
      sendSystem(uid, txt){
        const p = `private_chats/${this.sysId(uid)}/messages`;
        const arr = this.db.g(p, []);
        arr.push({ id: this.db.id("msg"), senderId: "system", text: txt, at: Date.now(), system: true });
        this.db.s(p, arr);
        const u = this.db.g(`users/${uid}`, null);
        if (u){ u.unreadSystem = (u.unreadSystem||0)+1; u.chats = [...new Set([...(u.chats||[]), this.sysId(uid)])]; this.db.saveUser(u); if (S.user && S.user.id === uid){ S.user = u; this.ui.refreshTop(); } }
      }
      openSystem(){
        S.chatType = "system"; S.chatId = this.sysId(S.user.id); S.user.unreadSystem = 0; this.ui.saveMe();
        const msgs = this.db.g(this.path(), []).slice(-14).reverse();
        this.ui.modal("Системные уведомления", msgs.map(m => `<div class="card"><div>${this.ui.esc(m.text)}</div><div class="meta">${new Date(m.at).toLocaleString("ru-RU")}</div></div>`).join("") || `<div class="meta">Пусто</div>`);
      }
      renderMsgs(){
        const box = document.getElementById("msgs"); if (!box) return;
        const ttl = document.getElementById("chatTitle");
        if (ttl) ttl.textContent = S.chatType === "global" ? "Общий чат" : S.chatType === "system" ? "Системные уведомления" : S.chatType === "review" ? "Просмотр ЛС" : "Личный чат";
        const arr = this.db.g(this.path(), []);
        box.innerHTML = arr.map(m => {
          if (m.system || m.senderId === "system") return `<div class="sys">${this.ui.esc(m.text)}</div>`;
          const me = m.senderId === S.user.id;
          return `<div class="mg ${me?"me":""}"><div class="bubble"><span class="sender">${this.ui.nameBy(m.senderId)}</span>${this.ui.esc(m.text)}<span class="tm">${new Date(m.at).toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"})}</span></div></div>`;
        }).join("") || `<div class="meta">Пока нет сообщений</div>`;
        box.scrollTop = box.scrollHeight;
      }
    }

    class Friends {
      constructor(db,ui){ this.db=db; this.ui=ui; }
      sync(){
        if (!S.user) return;
        const fresh = this.db.g(`users/${S.user.id}`, null);
        if (!fresh) return;
        fresh.requests = { ...(fresh.requests||{}) }; fresh.outgoingRequests = { ...(fresh.outgoingRequests||{}) }; fresh.friends = { ...(fresh.friends||{}) };
        this.db.allUsers().forEach(o => {
          if (o.id === fresh.id) return;
          if (o.friends && o.friends[fresh.id]){
            fresh.friends[o.id] = o.friends[fresh.id];
            delete fresh.requests[o.id];
            delete fresh.outgoingRequests[o.id];
            const cid = app.chat.id(fresh.id, o.id);
            fresh.chats = [...new Set([...(fresh.chats||[]), cid])];
            this.db.rememberChat(cid);
          }
        });
        Object.values(this.db.g("friend_requests_index", {})).forEach(r => {
          if (r.targetId === fresh.id && r.status === "pending" && !fresh.friends[r.senderId]) fresh.requests[r.senderId] = { senderId:r.senderId, at:r.at };
          if (r.senderId === fresh.id && r.status === "pending" && !fresh.friends[r.targetId]) fresh.outgoingRequests[r.targetId] = { targetId:r.targetId, at:r.at };
        });
        S.user = fresh; this.db.saveUser(S.user);
      }
      render(el){
        this.sync();
        el.innerHTML = `<div class="grid">
          <div class="card"><h3 class="title">Поиск игроков</h3><input id="qUser" placeholder="Логин"><div id="sr" class="grid"></div></div>
          <div class="card"><h3 class="title">Входящие заявки</h3><div id="inReq"></div></div>
          <div class="card"><h3 class="title">Исходящие заявки</h3><div id="outReq"></div></div>
          <div class="card"><h3 class="title">Друзья</h3><div id="frList"></div></div>
        </div>`;
        document.getElementById("qUser").oninput = e => this.search(e.target.value);
        this.rIn(); this.rOut(); this.rFriends();
      }
      search(q){
        const box = document.getElementById("sr");
        if (!q.trim()){ box.innerHTML = ""; return; }
        const ql = String(q || "").toLowerCase();
        const users = this.db.allUsers().filter(u => u.id !== S.user.id && !S.user.friends[u.id] && !(S.user.outgoingRequests||{})[u.id] && !(u.requests||{})[S.user.id] && String(u.login || "").toLowerCase().indexOf(ql) !== -1);
        box.innerHTML = users.map(u => `<div class="listRow"><div>${this.ui.nameBy(u)}<div class="meta">${this.ui.roleText(u)}</div></div><button class="pri" data-add="${u.id}">➕</button></div>`).join("") || `<div class="meta">Никого не найдено</div>`;
        box.querySelectorAll("[data-add]").forEach(b => b.onclick = () => this.req(b.dataset.add));
      }
      req(tid){
        const t = this.db.g(`users/${tid}`, null); if (!t) return;
        if (t.requests[S.user.id] || (S.user.outgoingRequests||{})[tid]) return this.ui.toast("Заявка уже есть");
        S.user.outgoingRequests = S.user.outgoingRequests || {}; t.requests = t.requests || {};
        t.requests[S.user.id] = { senderId:S.user.id, at:Date.now() }; S.user.outgoingRequests[tid] = { targetId:tid, at:Date.now() };
        this.db.saveUser(t); this.ui.saveMe();
        const idx = this.db.g("friend_requests_index", {}); idx[`${tid}__${S.user.id}`] = { targetId:tid, senderId:S.user.id, at:Date.now(), status:"pending" }; this.db.s("friend_requests_index", idx);
        this.ui.toast("Заявка отправлена");
        this.render(document.getElementById("screenHost"));
      }
      clearReqPair(myId, otherId){
        const idx = this.db.g("friend_requests_index", {});
        delete idx[`${myId}__${otherId}`];
        delete idx[`${otherId}__${myId}`];
        this.db.s("friend_requests_index", idx);
        const me = this.db.g(`users/${myId}`, null), ot = this.db.g(`users/${otherId}`, null);
        if (me){ if (me.requests) delete me.requests[otherId]; if (me.outgoingRequests) delete me.outgoingRequests[otherId]; this.db.saveUser(me); if (S.user.id === myId) S.user = me; }
        if (ot){ if (ot.requests) delete ot.requests[myId]; if (ot.outgoingRequests) delete ot.outgoingRequests[myId]; this.db.saveUser(ot); if (S.user.id === otherId) S.user = ot; }
      }
      accept(sid){
        const s = this.db.g(`users/${sid}`, null); if (!s) return this.decline(sid);
        S.user.friends[sid] = { since: Date.now() }; s.friends[S.user.id] = { since: Date.now() };
        const cid = app.chat.id(S.user.id, sid);
        S.user.chats = [...new Set([...(S.user.chats||[]), cid])]; s.chats = [...new Set([...(s.chats||[]), cid])];
        this.clearReqPair(S.user.id, sid);
        this.db.saveUser(s); this.ui.saveMe();
        this.db.rememberChat(cid);
        if (!this.db.g(`private_chats/${cid}/messages`, null)) this.db.s(`private_chats/${cid}/messages`, [{ id:this.db.id("msg"), senderId:"system", text:"Личный чат создан автоматически.", at:Date.now(), system:true }]);
        this.render(document.getElementById("screenHost"));
      }
      decline(sid){ this.clearReqPair(S.user.id, sid); this.ui.saveMe(); this.rIn(); this.rOut(); }
      cancel(tid){ this.clearReqPair(S.user.id, tid); this.ui.saveMe(); this.rIn(); this.rOut(); }
      rIn(){
        const box = document.getElementById("inReq");
        const ids = [...new Set([...Object.keys(S.user.requests||{}), ...Object.values(this.db.g("friend_requests_index", {})).filter(r=>r.targetId===S.user.id&&r.status==="pending").map(r=>r.senderId)])];
        box.innerHTML = ids.map(id => { const u=this.db.g(`users/${id}`,null); return u?`<div class="listRow"><div>${this.ui.nameBy(u)}</div><div class="row"><button class="pri" data-a="${id}">✅</button><button class="danger" data-d="${id}">❌</button></div></div>`:""; }).join("") || `<div class="meta">Нет заявок</div>`;
        box.querySelectorAll("[data-a]").forEach(b => b.onclick = () => this.accept(b.dataset.a));
        box.querySelectorAll("[data-d]").forEach(b => b.onclick = () => this.decline(b.dataset.d));
      }
      rOut(){
        const box = document.getElementById("outReq");
        const ids = Object.keys(S.user.outgoingRequests||{});
        box.innerHTML = ids.map(id => { const u=this.db.g(`users/${id}`,null); return u?`<div class="listRow"><div>${this.ui.nameBy(u)}<div class="meta">ожидает ответ</div></div><button class="danger" data-c="${id}">Отменить</button></div>`:""; }).join("") || `<div class="meta">Нет исходящих</div>`;
        box.querySelectorAll("[data-c]").forEach(b => b.onclick = () => this.cancel(b.dataset.c));
      }
      rFriends(){
        const box = document.getElementById("frList"), ids = Object.keys(S.user.friends||{});
        box.innerHTML = ids.map(id => {
          const f = this.db.g(`users/${id}`, null); if (!f) return "";
          const on = Date.now() - (f.lastSeen||0) < 300000;
          return `<div class="listRow"><div>${this.ui.nameBy(f)}<div class="meta">${on?"🟢 онлайн":"⚫ офлайн"}</div></div><div class="row"><button class="ghost" data-pm="${id}">💬</button><button class="pri" data-g="${id}">🎁100</button></div></div>`;
        }).join("") || `<div class="meta">Пока нет друзей</div>`;
        box.querySelectorAll("[data-pm]").forEach(b => b.onclick = () => { S.chatType = "private"; S.chatId = app.chat.id(S.user.id, b.dataset.pm); app.ui.renderScreen("chat"); });
        box.querySelectorAll("[data-g]").forEach(b => b.onclick = () => {
          const f = this.db.g(`users/${b.dataset.g}`, null); if (!f || !app.econ.spend(100)) return;
          f.coins += 100; this.db.saveUser(f); app.chat.sendSystem(f.id, `${S.user.login} отправил вам 100 монет.`); this.ui.toast("Подарок отправлен");
        });
      }
    }

    class Moder {
      constructor(db,ui){ this.db=db; this.ui=ui; }
      rights(){
        if (S.user.role === "admin") return { warn:true, mute:true, ban:true };
        const mods = this.db.g("moderators_credentials", {});
        const e = Object.values(mods).find(m => m.userId === S.user.id && m.active !== false);
        return e?.rights || { warn:true, mute:false, ban:false };
      }
      p(rank){ return { user:0,"ml.модер":1,"модер":2,"ст.модер":3,"мл.админ":4,admin:9 }[rank] || 0; }
      canAffect(t){ if (S.user.role === "admin") return true; return this.p(S.user.rank||"ml.модер") > this.p(t.rank||t.role||"user"); }
      grant(uid, source="manual"){
        const u = this.db.g(`users/${uid}`, null); if (!u) return;
        const login = "Moder_" + Math.floor(1000 + Math.random()*9000);
        const password = String(Math.floor(100000 + Math.random()*900000));
        u.role = "moderator"; if (!u.rank || u.rank === "user") u.rank = "ml.модер";
        this.db.saveUser(u);
        const creds = this.db.g("moderators_credentials", {});
        creds[login] = { login, password, userId:uid, rank:u.rank, rights:{ warn:true, mute:false, ban:false }, source, active:true, createdAt:Date.now() };
        this.db.s("moderators_credentials", creds);
        if (!this.db.g(`moderators_stats/${uid}`, null)) this.db.s(`moderators_stats/${uid}`, { warnings:0,mutes:0,bans:0 });
        app.chat.sendSystem(uid, `Вам выдана модерка. Логин: ${login}. Пароль: ${password}. Ранг: ${u.rank}.`);
        this.log("grant_mod", uid, source);
        if (S.user && S.user.id === uid) S.user = u;
      }
      addStat(field){
        const st = this.db.g(`moderators_stats/${S.user.id}`, { warnings:0,mutes:0,bans:0 });
        st[field] = (st[field]||0)+1; this.db.s(`moderators_stats/${S.user.id}`, st);
        if ((S.user.rank||"ml.модер") === "ml.модер" && st.warnings >= 30) this.setRank("модер",{ warn:true, mute:true, ban:false });
        if ((S.user.rank||"ml.модер") === "модер" && st.warnings >= 15 && st.mutes >= 20) this.setRank("ст.модер",{ warn:true, mute:true, ban:true });
      }
      setRank(rank, rights){
        S.user.rank = rank; this.db.saveUser(S.user);
        const creds = this.db.g("moderators_credentials", {});
        Object.values(creds).forEach(c => { if (c.userId === S.user.id){ c.rank = rank; c.rights = rights; } });
        this.db.s("moderators_credentials", creds);
        this.ui.toast("Повышение: " + rank);
      }
      log(action, target, detail){ const l = this.db.g("mod_logs", []); l.push({ id:this.db.id("log"), action, moderatorId:S.user?S.user.id:"system", targetId:target, detail, at:Date.now() }); this.db.s("mod_logs", l); }
      targetReason(){ const id=document.getElementById("modTarget").value, rs=this.ui.esc(document.getElementById("modReason").value.trim()||"Без причины"); return { t:this.db.g(`users/${id}`,null), rs }; }
      warn(){
        const r = this.rights(); if (!r.warn) return this.ui.toast("Нет права warn");
        const { t, rs } = this.targetReason(); if (!t) return;
        if (!this.canAffect(t)) return this.ui.toast("Нельзя наказать равный/высший ранг");
        t.warnings = t.warnings || []; t.warnings.push({ by:S.user.id, reason:rs, at:Date.now() }); this.db.saveUser(t);
        app.chat.sendSystem(t.id, `Предупреждение: ${rs}`);
        this.addStat("warnings"); this.log("warn", t.id, rs); this.ui.toast("Warn выдан"); this.refresh();
      }
      mute(h){
        const r = this.rights(); if (!r.mute) return this.ui.toast("Нет права mute");
        const { t, rs } = this.targetReason(); if (!t) return;
        if (!this.canAffect(t)) return this.ui.toast("Нельзя наказать равный/высший ранг");
        t.mutedUntil = Date.now() + h * 3600000; this.db.saveUser(t);
        app.chat.sendSystem(t.id, `Мут на ${h}ч. Причина: ${rs}`);
        this.addStat("mutes"); this.log("mute_"+h+"h", t.id, rs); this.refresh();
      }
      banToggle(){
        const r = this.rights(); if (!r.ban) return this.ui.toast("Нет права ban");
        const { t, rs } = this.targetReason(); if (!t) return;
        if (!this.canAffect(t)) return this.ui.toast("Нельзя наказать равный/высший ранг");
        const on = t.bannedUntil && t.bannedUntil > Date.now();
        t.bannedUntil = on ? 0 : Date.now() + 3650*86400000; this.db.saveUser(t);
        app.chat.sendSystem(t.id, on ? "Бан снят." : `Бан. Причина: ${rs}`);
        this.addStat("bans"); this.log(on?"unban":"ban", t.id, rs); this.refresh();
      }
      clearMute(){
        const r = this.rights(); if (!r.mute) return this.ui.toast("Нет права clear mute");
        const { t, rs } = this.targetReason(); if (!t) return;
        if (!this.canAffect(t)) return this.ui.toast("Нельзя наказать равный/высший ранг");
        t.mutedUntil = 0; this.db.saveUser(t); app.chat.sendSystem(t.id, `Мут снят. ${rs}`); this.log("clear_mute", t.id, rs); this.refresh();
      }
      refresh(){ if (S.screen === "moderator") app.ui.renderScreen("moderator"); if (S.screen === "admin") app.ui.renderScreen("admin"); }
      render(el){
        const r=this.rights(), users=this.db.allUsers().filter(u=>u.id!==S.user.id), vio=this.db.g("violations",[]).slice(-12).reverse();
        el.innerHTML = `<div class="grid">
          <div class="card"><h3 class="title">Панель модератора</h3><div class="meta">Права: warn ${r.warn?"да":"нет"}, mute ${r.mute?"да":"нет"}, ban ${r.ban?"да":"нет"}.</div></div>
          <div class="card"><h3 class="title">Управление игроками</h3>
            <select id="modTarget">${users.map(u=>`<option value="${u.id}">${this.ui.esc(u.login)}</option>`).join("")}</select>
            <textarea id="modReason" placeholder="Причина"></textarea>
            <div class="grid two"><button id="wBtn" class="pri">Warn</button><button id="m1Btn" class="ghost">Мут 1ч</button><button id="m24Btn" class="ghost">Мут 24ч</button><button id="bBtn" class="danger">Бан/разбан</button><button id="cmBtn" class="ghost">Снять мут</button><button id="cardBtn" class="ghost">Карточка игрока</button></div>
          </div>
          <div class="card"><h3 class="title">Анти-мат</h3>${vio.map(v=>`<div class="listRow"><div><b>${this.ui.esc(v.offenderId)}</b><div class="meta">${this.ui.esc(v.text)}</div></div><span class="tag">${new Date(v.at).toLocaleTimeString("ru-RU")}</span></div>`).join("") || `<div class="meta">Нарушений нет</div>`}</div>
        </div>`;
        document.getElementById("wBtn").onclick=()=>this.warn();
        document.getElementById("m1Btn").onclick=()=>this.mute(1);
        document.getElementById("m24Btn").onclick=()=>this.mute(24);
        document.getElementById("bBtn").onclick=()=>this.banToggle();
        document.getElementById("cmBtn").onclick=()=>this.clearMute();
        document.getElementById("cardBtn").onclick=()=>{ const {t}=this.targetReason(); if(!t) return; app.ui.modal("Карточка", `<div class="card"><div class="listRow"><span>ID</span><b>${app.ui.esc(t.id)}</b></div><div class="listRow"><span>Монеты</span><b>${Math.floor(t.coins)}</b></div><div class="listRow"><span>Предупреждений</span><b>${(t.warnings||[]).length}</b></div><div class="listRow"><span>Мут</span><b>${t.mutedUntil&&t.mutedUntil>Date.now()?new Date(t.mutedUntil).toLocaleString("ru-RU"):"нет"}</b></div><div class="listRow"><span>Бан</span><b>${t.bannedUntil&&t.bannedUntil>Date.now()?"активен":"нет"}</b></div></div>`); };
      }
    }

    class Admin {
      constructor(db,ui){ this.db=db; this.ui=ui; }
      tgt(){ return this.db.g(`users/${document.getElementById("admTarget").value}`, null); }
      saveT(u, action){
        this.db.saveUser(u);
        this.db.s(`users/${u.id}/coins`, u.coins||0); this.db.s(`users/${u.id}/rank`, u.rank||"user");
        if (S.user.id === u.id) S.user = u;
        app.moder.log(action, u.id, "admin_panel");
        this.ui.toast("Игрок обновлен");
        this.render(document.getElementById("screenHost"));
      }
      setRank(rank){
        const u=this.tgt(); if(!u||u.role==="admin") return this.ui.toast("Нельзя");
        u.role = "moderator"; u.rank = rank;
        const rightsBy = { "ml.модер":{warn:true,mute:false,ban:false}, "модер":{warn:true,mute:true,ban:false}, "ст.модер":{warn:true,mute:true,ban:true}, "мл.админ":{warn:true,mute:true,ban:true,adminLite:true} };
        const creds = this.db.g("moderators_credentials", {});
        let found = false;
        Object.values(creds).forEach(c => { if (c.userId === u.id){ c.rank = rank; c.rights = rightsBy[rank]; found = true; } });
        if (!found) app.moder.grant(u.id, "admin_rank_set");
        this.db.s("moderators_credentials", creds);
        app.chat.sendSystem(u.id, `Администрация назначила вам ранг: ${rank}`);
        this.saveT(u, "admin_set_rank_"+rank);
      }
      render(el){
        if (S.user.role !== "admin") return el.innerHTML = `<div class="meta">Нет доступа</div>`;
        const users=this.db.allUsers(), creds=Object.values(this.db.g("moderators_credentials", {})), logs=this.db.g("mod_logs",[]).slice(-20).reverse(), v=this.db.g("violations",[]).slice(-14).reverse();
        const onlyMods = users.filter(u => u.role === "moderator");
        const onlyUsers = users.filter(u => u.role !== "moderator" && u.role !== "admin");
        el.innerHTML = `<div class="grid">
          <div class="card"><h3 class="title">Админ-панель</h3>
            <div class="grid two"><select id="grantU">${users.map(u=>`<option value="${u.id}">${this.ui.esc(u.login)}</option>`).join("")}</select><button id="grantBtn" class="pri">Выдать модератора</button></div>
            <textarea id="bcText" placeholder="Рассылка всем игрокам"></textarea><button id="bcBtn" class="ghost">Отправить рассылку</button>
          </div>
          <div class="card"><h3 class="title">Управление модераторами</h3>
            <select id="modTargetAdmin">${onlyMods.map(u=>`<option value="${u.id}">${this.ui.esc(u.login)} (${this.ui.esc(u.rank||"ml.модер")})</option>`).join("") || `<option value="">Нет модераторов</option>`}</select>
            <div class="grid two"><button id="modToJr" class="ghost">Ранг ml.модер</button><button id="modToMid" class="ghost">Ранг модер</button><button id="modToSr" class="ghost">Ранг ст.модер</button><button id="modToMiniAdm" class="pri">Ранг мл.админ</button><button id="demoteMod" class="danger">Снять модера</button><button id="viewModLink" class="ghost">Показать привязку логина</button></div>
          </div>
          <div class="card"><h3 class="title">Управление обычными игроками</h3>
            <select id="admTarget">${onlyUsers.map(u=>`<option value="${u.id}">${this.ui.esc(u.login)}</option>`).join("") || `<option value="">Нет пользователей</option>`}</select>
            <textarea id="directSysMsg" placeholder="Личное системное сообщение игроку"></textarea>
            <div class="grid two"><input id="coinsAmt" type="number" placeholder="Монеты"><button id="addC" class="pri">Начислить</button><button id="takeC" class="danger">Списать</button><button id="resetE" class="ghost">Энергия 100%</button><button id="clearPB" class="ghost">Снять мут/бан</button><button id="mkUser" class="ghost">Сделать игроком</button><button id="wipeW" class="danger">Очистить warn</button><button id="r1" class="ghost">ml.модер</button><button id="r2" class="ghost">модер</button><button id="r3" class="ghost">ст.модер</button><button id="r4" class="pri">мл.админ</button><button id="givePref" class="ghost">Выдать все префиксы</button><button id="giveNicks" class="ghost">Выдать все стили ника</button><button id="resetAcc" class="danger">Сбросить прогресс</button><button id="sendDirect" class="pri">Отправить системное</button></div>
          </div>
          <div class="card"><h3 class="title">База логинов модеров</h3>${creds.map(c=>`<div class="listRow"><span>${this.ui.esc(c.login)}</span><span class="tag">${this.ui.esc(c.password)}</span></div>`).join("") || `<div class="meta">Пусто</div>`}</div>
          <div class="card"><h3 class="title">Анти-мат</h3>${v.map(x=>`<div class="listRow"><div><b>${this.ui.esc(x.offenderId)}</b><div class="meta">${this.ui.esc(x.text)}</div></div><span class="tag">${this.ui.esc(x.chatType)}</span></div>`).join("") || `<div class="meta">Нет нарушений</div>`}</div>
          <div class="card"><h3 class="title">Логи</h3>${logs.map(l=>`<div class="listRow"><span>${this.ui.esc(l.action)} → ${this.ui.esc(l.targetId)}</span><span class="meta">${new Date(l.at).toLocaleString("ru-RU")}</span></div>`).join("") || `<div class="meta">Нет логов</div>`}</div>
        </div>`;
        document.getElementById("grantBtn").onclick=()=>app.moder.grant(document.getElementById("grantU").value,"admin_manual");
        document.getElementById("bcBtn").onclick=()=>{ const t=this.ui.esc(document.getElementById("bcText").value.trim()); if(!t) return; this.db.allUsers().forEach(u=>app.chat.sendSystem(u.id,`Рассылка администрации: ${t}`)); app.moder.log("broadcast","all",t); this.ui.toast("Рассылка отправлена"); };
        document.getElementById("addC").onclick=()=>{ const u=this.tgt(),a=Math.max(0,Number(document.getElementById("coinsAmt").value||0)); if(!u||!a) return this.ui.toast("Введите сумму"); u.coins=(u.coins||0)+a; app.chat.sendSystem(u.id,`Начислено ${a} монет администрацией.`); this.saveT(u,"admin_add_coins"); };
        document.getElementById("takeC").onclick=()=>{ const u=this.tgt(),a=Math.max(0,Number(document.getElementById("coinsAmt").value||0)); if(!u||!a) return this.ui.toast("Введите сумму"); u.coins=Math.max(0,(u.coins||0)-a); app.chat.sendSystem(u.id,`Списано ${a} монет администрацией.`); this.saveT(u,"admin_take_coins"); };
        document.getElementById("resetE").onclick=()=>{ const u=this.tgt(); if(!u) return; u.energy=u.maxEnergy; this.saveT(u,"admin_reset_energy"); };
        document.getElementById("clearPB").onclick=()=>{ const u=this.tgt(); if(!u) return; u.mutedUntil=0; u.bannedUntil=0; app.chat.sendSystem(u.id,"Администрация сняла мут и бан."); this.saveT(u,"admin_clear_punishments"); };
        document.getElementById("mkUser").onclick=()=>{ const u=this.tgt(); if(!u||u.role==="admin") return; u.role="user"; u.rank="user"; const c=this.db.g("moderators_credentials",{}); Object.keys(c).forEach(k=>{ if(c[k].userId===u.id) delete c[k]; }); this.db.s("moderators_credentials",c); this.saveT(u,"admin_make_user"); };
        document.getElementById("wipeW").onclick=()=>{ const u=this.tgt(); if(!u) return; u.warnings=[]; app.chat.sendSystem(u.id,"Предупреждения очищены администрацией."); this.saveT(u,"admin_wipe_warn"); };
        document.getElementById("r1").onclick=()=>this.setRank("ml.модер");
        document.getElementById("r2").onclick=()=>this.setRank("модер");
        document.getElementById("r3").onclick=()=>this.setRank("ст.модер");
        document.getElementById("r4").onclick=()=>this.setRank("мл.админ");
        document.getElementById("modToJr").onclick=()=>{ const e=document.getElementById("modTargetAdmin"); if(!e||!e.value) return; document.getElementById("admTarget").value=e.value; this.setRank("ml.модер"); };
        document.getElementById("modToMid").onclick=()=>{ const e=document.getElementById("modTargetAdmin"); if(!e||!e.value) return; document.getElementById("admTarget").value=e.value; this.setRank("модер"); };
        document.getElementById("modToSr").onclick=()=>{ const e=document.getElementById("modTargetAdmin"); if(!e||!e.value) return; document.getElementById("admTarget").value=e.value; this.setRank("ст.модер"); };
        document.getElementById("modToMiniAdm").onclick=()=>{ const e=document.getElementById("modTargetAdmin"); if(!e||!e.value) return; document.getElementById("admTarget").value=e.value; this.setRank("мл.админ"); };
        document.getElementById("demoteMod").onclick=()=>{ const e=document.getElementById("modTargetAdmin"); if(!e||!e.value) return; document.getElementById("admTarget").value=e.value; document.getElementById("mkUser").click(); };
        document.getElementById("viewModLink").onclick=()=>{
          const e=document.getElementById("modTargetAdmin"); if(!e||!e.value) return;
          const creds=this.db.g("moderators_credentials", {});
          const hit = Object.values(creds).find(c => c.userId === e.value);
          if (!hit) return this.ui.toast("Привязка не найдена");
          this.ui.modal("Привязка модер-акка", `<div class="card"><div class="listRow"><span>Игрок</span><b>${this.ui.esc(this.db.g(`users/${e.value}`,{}).login || e.value)}</b></div><div class="listRow"><span>Логин модера</span><b>${this.ui.esc(hit.login)}</b></div><div class="listRow"><span>Пароль модера</span><b>${this.ui.esc(hit.password)}</b></div><div class="listRow"><span>Ранг</span><b>${this.ui.esc(hit.rank || "ml.модер")}</b></div></div>`);
        };
        document.getElementById("givePref").onclick=()=>{ const u=this.tgt(); if(!u) return; u.prefixes=[...new Set([...(u.prefixes||[]), ...DATA.prefixes.map(p=>p.id), "Noob","Hacker","God"])]; u.activePrefix=u.prefixes[0]||""; app.chat.sendSystem(u.id,"Админ выдал вам все префиксы."); this.saveT(u,"admin_give_prefixes"); };
        document.getElementById("giveNicks").onclick=()=>{ const u=this.tgt(); if(!u) return; u.nickStyles=[...new Set([...(u.nickStyles||[]), ...DATA.nicks.map(n=>n.id)])]; u.activeNickStyle=u.nickStyles[0]||""; app.chat.sendSystem(u.id,"Админ выдал вам все стили ников."); this.saveT(u,"admin_give_nicks"); };
        document.getElementById("resetAcc").onclick=()=>{ const u=this.tgt(); if(!u||u.role==="admin") return; const base=userFactory(u.login,u.password,u.role); base.id=u.id; base.vk=u.vk; base.vkId=u.vkId; if(u.role==="moderator") base.rank=u.rank||"ml.модер"; this.saveT(base,"admin_reset_account"); };
        document.getElementById("sendDirect").onclick=()=>{ const u=this.tgt(); const txt=this.ui.esc(document.getElementById("directSysMsg").value.trim()); if(!u||!txt) return this.ui.toast("Введите текст"); app.chat.sendSystem(u.id, txt); this.ui.toast("Сообщение отправлено"); };
      }
    }

    class Profile {
      constructor(db,ui){ this.db=db; this.ui=ui; }
      render(el){
        const nx = 500 * S.user.level;
        el.innerHTML = `<div class="grid">
          <div class="card"><h2>${this.ui.nameBy(S.user)}</h2><div class="meta">VK: <a href="${CFG.devVk}" target="_blank" style="color:var(--c1)">id755275260</a></div>
            <div class="listRow"><span>Роль</span><b>${this.ui.roleText(S.user)}</b></div>
            <div class="listRow"><span>Уровень</span><b>${S.user.level}</b></div>
            <div class="listRow"><span>XP</span><b>${Math.floor(S.user.xp)} / ${nx}</b></div>
            <div class="listRow"><span>Сила клика</span><b>${S.user.clickPower}</b></div>
            <button id="logoutBtn" class="danger">Выйти</button>
          </div>
          <div class="card"><h3 class="title">Префикс</h3><div class="tabs" id="pfList"></div></div>
          <div class="card"><h3 class="title">Стиль ника</h3><div class="tabs" id="nkList"></div></div>
        </div>`;
        document.getElementById("logoutBtn").onclick = () => app.auth.logout();
        const p = document.getElementById("pfList");
        const myP = S.user.prefixes || [];
        p.innerHTML = myP.length ? myP.map(x => `<button class="chip ${S.user.activePrefix===x?'active':'ghost'}" data-pf="${this.ui.esc(x)}">${this.ui.esc(x)}</button>`).join("") : `<div class="meta">У вас нет префиксов</div>`;
        p.querySelectorAll("[data-pf]").forEach(b => b.onclick = () => { S.user.activePrefix = b.dataset.pf; this.ui.saveMe(); this.render(el); });
        const n = document.getElementById("nkList");
        const myN = S.user.nickStyles || [];
        n.innerHTML = myN.length ? myN.map(x => `<button class="chip ${S.user.activeNickStyle===x?'active':'ghost'} ${x}-name" data-nk="${this.ui.esc(x)}">${this.ui.esc(x)}</button>`).join("") : `<div class="meta">У вас нет стилей ника</div>`;
        n.querySelectorAll("[data-nk]").forEach(b => b.onclick = () => { S.user.activeNickStyle = b.dataset.nk; this.ui.saveMe(); this.render(el); });
      }
    }

    class Settings {
      constructor(db,ui){ this.db=db; this.ui=ui; }
      render(el){
        S.user.settings = S.user.settings || { language:"ru", notifications:true };
        el.innerHTML = `<div class="grid">
          <div class="card"><h3 class="title">Настройки</h3>
            <div class="listRow"><span>Язык</span><select id="lang" style="max-width:170px"><option value="ru">Русский</option><option value="en">English</option></select></div>
            <div class="listRow"><span>Уведомления</span><button id="notiBtn" class="ghost">${S.user.settings.notifications ? "Вкл":"Выкл"}</button></div>
          </div>
          <div class="card"><h3 class="title">Правила</h3><div class="meta">1) Запрещены оскорбления и мат. 2) Запрещен спам и накрутка. 3) Модератор не может выдавать наказания выше своего ранга. 4) Все действия фиксируются в логах.</div></div>
          <div class="card"><h3 class="title">Разработчик</h3><div class="listRow"><span>VK</span><a href="${CFG.devVk}" target="_blank" style="color:var(--c1)">id755275260</a></div></div>
        </div>`;
        document.getElementById("lang").value = S.user.settings.language || "ru";
        document.getElementById("lang").onchange = e => { S.user.settings.language = e.target.value; this.ui.saveMe(); this.ui.toast("Язык сохранен"); };
        document.getElementById("notiBtn").onclick = () => { S.user.settings.notifications = !S.user.settings.notifications; this.ui.saveMe(); this.render(el); };
      }
    }

    class App {
      constructor(){
        this.db = new DB(CFG.pfx);
        this.ui = new UI(this.db);
        this.auth = new Auth(this.db, this.ui);
        this.econ = new Economy(this.db, this.ui);
        this.clicker = new Clicker(this.db, this.ui);
        this.shop = new Shop(this.db, this.ui);
        this.chat = new Chat(this.db, this.ui);
        this.friends = new Friends(this.db, this.ui);
        this.moder = new Moder(this.db, this.ui);
        this.admin = new Admin(this.db, this.ui);
        this.profile = new Profile(this.db, this.ui);
        this.settings = new Settings(this.db, this.ui);
      }
      start(){
        this.db.seed();
        const old = this.db.g("app_version", null);
        if (old && old !== CFG.v) this.ui.toast("Приложение обновлено!");
        this.db.s("app_version", CFG.v);
        this.auth.init();
        S.timers.push(setInterval(() => this.econ.regen(), 1000));
        S.timers.push(setInterval(() => this.econ.passive(), 1000));
        S.timers.push(setInterval(() => this.ui.saveMe(), 15000));
        window.addEventListener("beforeunload", () => this.ui.saveMe());
        window.addEventListener("storage", e => {
          if (!e.key || !S.user) return;
          if (e.key === this.db.k(`users/${S.user.id}`)){
            const f = this.db.g(`users/${S.user.id}`, null);
            if (f){
              S.user = { ...S.user, ...f };
              this.ui.refreshTop();
              const rerender = ["chat","friends","admin","moderator","profile"].indexOf(S.screen) !== -1;
              if (rerender) this.ui.renderScreen(S.screen);
            }
          }
        });
      }
    }

    function showFatal(err){
      const root = document.getElementById("root");
      if (!root) return;
      root.innerHTML = `<section class="shell auth"><div class="card"><h2>Ошибка запуска</h2><div class="meta">Приложение не смогло инициализироваться. Обновите страницу (Ctrl+F5).</div><div class="meta" style="margin-top:8px;color:#ff9fb5">${String(err || "unknown error")}</div></div></section>`;
    }
    window.addEventListener("error", e => {
      if (!document.getElementById("root")?.innerHTML) showFatal(e.message || "script error");
    });
    const app = new App();
    try { app.start(); } catch (e) { showFatal(e && e.message ? e.message : e); }
  </script>
</body>
