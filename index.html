<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GHOST TG: UNIVERSE FULL</title>
    <style>
        :root {
            --accent: #00f2ff;
            --bg-dark: #0a0e14;
            --glass: rgba(20, 25, 35, 0.95);
            --border: rgba(0, 242, 255, 0.3);
            --text: #e0e0e0;
            --danger: #ff0055;
            --success: #00ff88;
        }

        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; -webkit-tap-highlight-color: transparent; }
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; background: #000; color: var(--text); overflow: hidden; }

        /* --- ОСНОВНАЯ СЕТКА --- */
        .app-container { display: flex; height: 100vh; width: 100vw; position: relative; }

        /* САЙДБАР */
        #sidebar { 
            width: 320px; background: var(--bg-dark); border-right: 1px solid var(--border); 
            display: flex; flex-direction: column; transition: 0.3s ease; z-index: 1000;
        }

        /* ЧАТ */
        #main-chat { flex: 1; display: flex; flex-direction: column; background: rgba(0,0,0,0.4); position: relative; }

        /* ШАПКИ */
        .header { 
            height: 65px; min-height: 65px; padding: 0 15px; display: flex; align-items: center; 
            justify-content: space-between; background: var(--glass); border-bottom: 1px solid var(--border);
            backdrop-filter: blur(15px);
        }

        /* СООБЩЕНИЯ */
        #messages-area { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
        .msg { padding: 12px 18px; border-radius: 18px; max-width: 80%; word-wrap: break-word; position: relative; animation: slideIn 0.2s; }
        .msg-my { background: var(--accent); color: #000; align-self: flex-end; border-bottom-right-radius: 2px; }
        .msg-other { background: var(--glass); border: 1px solid var(--border); align-self: flex-start; border-bottom-left-radius: 2px; }
        @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } }

        /* ВВОД */
        .input-area { padding: 15px; display: flex; gap: 10px; background: var(--glass); border-top: 1px solid var(--border); align-items: center; }
        .ui-input { width: 100%; padding: 12px; background: rgba(0,0,0,0.5); border: 1px solid var(--border); color: white; border-radius: 12px; outline: none; font-size: 16px; }
        .btn-circle { width: 45px; height: 45px; min-width: 45px; border-radius: 50%; border: 1px solid var(--border); background: none; color: var(--accent); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 20px; }
        .rec-active { background: var(--danger) !important; color: white; animation: pulse 1s infinite; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(255,0,85,0.4); } 100% { box-shadow: 0 0 0 10px transparent; } }

        /* МОБИЛЬНОСТЬ */
        @media (max-width: 768px) {
            #sidebar { position: fixed; left: -320px; height: 100%; width: 280px; }
            #sidebar.active { left: 0; }
            .header-menu-btn { display: block !important; }
        }

        /* МОДАЛКИ */
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 5000; display: none; align-items: center; justify-content: center; padding: 20px; backdrop-filter: blur(5px); }
        .modal.active { display: flex; }
        .modal-box { width: 100%; max-width: 400px; background: var(--bg-dark); border: 1px solid var(--border); padding: 25px; border-radius: 20px; text-align: center; }

        /* КЛИКЕР */
        .clicker-btn { width: 160px; height: 160px; border-radius: 50%; background: radial-gradient(circle, var(--accent), #0055ff); border: none; font-size: 24px; font-weight: bold; cursor: pointer; box-shadow: 0 0 40px rgba(0,242,255,0.4); margin: 20px 0; }
        .clicker-btn:active { transform: scale(0.95); }

        .hidden { display: none !important; }
        .avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--accent); color: black; display: flex; align-items: center; justify-content: center; font-weight: bold; background-size: cover; }
    </style>
</head>
<body>

<!-- ЭКРАН ВХОДА -->
<div id="auth-screen" class="modal active">
    <div class="modal-box">
        <h1 style="color: var(--accent); letter-spacing: 2px;">GHOST TG</h1>
        <input type="text" id="auth-login" class="ui-input" style="margin-bottom: 10px;" placeholder="Логин">
        <input type="password" id="auth-pass" class="ui-input" style="margin-bottom: 20px;" placeholder="Пароль">
        <button class="ui-input" style="background: var(--accent); color: black; font-weight: bold;" onclick="appLogin()">ВОЙТИ / СОЗДАТЬ</button>
        <p id="auth-error" style="color: var(--danger); margin-top: 10px; font-size: 13px;"></p>
    </div>
</div>

<div class="app-container">
    <!-- БОКОВОЕ МЕНЮ -->
    <div id="sidebar">
        <div class="header">
            <b style="color: var(--accent);">GHOST OS</b>
            <button class="btn-circle" onclick="toggleSidebar()">✕</button>
        </div>
        <div style="padding: 15px; flex: 1; overflow-y: auto;">
            <input type="text" id="user-search" class="ui-input" style="font-size: 13px;" placeholder="Поиск ника...">
            <button class="ui-input" style="margin: 10px 0; background: var(--border);" onclick="searchUser()">Найти человека</button>
            <div id="search-res" style="font-size: 12px; margin-bottom: 10px;"></div>

            <button class="ui-input" style="margin-bottom: 10px; text-align: left;" onclick="openProfile()">👤 Мой Профиль</button>
            <button class="ui-input" style="margin-bottom: 10px; text-align: left;" onclick="openGame()">🎮 Ghost Clicker</button>
            <button class="ui-input" style="margin-bottom: 10px; text-align: left;" onclick="openRequests()">🔔 Заявки</button>
            
            <hr style="border: 0; border-top: 1px solid var(--border); margin: 15px 0;">
            <div id="contacts-list">
                <div style="padding: 12px; cursor: pointer; background: rgba(0,242,255,0.1);" onclick="switchChat('global'); toggleSidebar()">🌐 Общий Чат</div>
            </div>
        </div>
    </div>

    <!-- ЧАТ -->
    <div id="main-chat">
        <div class="header">
            <button class="btn-circle header-menu-btn" style="display: none;" onclick="toggleSidebar()">☰</button>
            <b id="chat-title">Общий Чат</b>
            <div id="top-avatar" class="avatar">?</div>
        </div>
        <div id="messages-area"></div>
        <div class="input-area">
            <button id="mic-btn" class="btn-circle" onmousedown="startVoice()" onmouseup="stopVoice()" ontouchstart="startVoice()" ontouchend="stopVoice()">🎙</button>
            <input type="text" id="msg-in" class="ui-input" placeholder="Введите текст...">
            <button class="btn-circle" style="background: var(--accent); color: black;" onclick="sendMsg()">➤</button>
        </div>
    </div>
</div>

<!-- МОДАЛКИ -->
<div id="profile-modal" class="modal">
    <div class="modal-box">
        <h2>Профиль</h2>
        <div id="p-avatar-big" class="avatar" style="width: 80px; height: 80px; margin: 0 auto 15px; font-size: 30px;">?</div>
        <h3 id="p-nick">Nick</h3>
        <p id="p-role" style="color: var(--accent);">Роль: Пользователь</p>
        <input type="text" id="p-avatar-url" class="ui-input" placeholder="Ссылка на фото (URL)">
        <button class="ui-input" style="margin-top: 10px; background: var(--accent); color: black;" onclick="saveAvatar()">Сменить аватар</button>
        <button class="ui-input" style="margin-top: 10px;" onclick="closeModals()">Закрыть</button>
    </div>
</div>

<div id="game-modal" class="modal">
    <div class="modal-box">
        <h2>GHOST CLICKER</h2>
        <p>Энергия: <b id="g-energy">100</b>/100</p>
        <button class="clicker-btn" onclick="doClick()">КЛИК!</button>
        <p>Счёт: <b id="g-clicks">0</b> / 500,000</p>
        <button class="ui-input" onclick="closeModals()">Выйти</button>
    </div>
</div>

<div id="req-modal" class="modal">
    <div class="modal-box">
        <h3>Заявки в друзья</h3>
        <div id="req-list" style="max-height: 200px; overflow-y: auto; margin-bottom: 15px;"></div>
        <button class="ui-input" onclick="closeModals()">Закрыть</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.17.1/firebase-app.js";
    import { getDatabase, ref, set, push, onChildAdded, onValue, get, update, remove } from "https://www.gstatic.com/firebasejs/9.17.1/firebase-database.js";

    // --- FIREBASE DATA ---
    const firebaseConfig = {
        apiKey: "ВСТАВЬ_API_KEY_ЗДЕСЬ", 
        databaseURL: "https://haker-a94a6-default-rtdb.europe-west1.firebasedatabase.app/",
        projectId: "haker-a94a6",
        appId: "1:931213076110:web:166f008f51a6659695d852"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    let user = null;
    let activeChat = 'global';
    let mediaRecorder = null;

    // ВХОД
    window.appLogin = async () => {
        const u = document.getElementById('auth-login').value.trim();
        const p = document.getElementById('auth-pass').value.trim();
        if(!u || !p) return;

        try {
            const uRef = ref(db, 'users/' + u);
            const snap = await get(uRef);

            if(snap.exists()) {
                if(snap.val().pass === p) { user = snap.val(); }
                else { alert("Пароль неверный"); return; }
            } else {
                user = { nick: u, pass: p, role: 'user', clicks: 0, energy: 100, avatar: '', lastEnergyTime: Date.now() };
                await set(uRef, user);
            }
            document.getElementById('auth-screen').classList.remove('active');
            startApp();
        } catch(e) { alert("Ошибка Firebase. Проверь Rules!"); }
    };

    function startApp() {
        switchChat('global');
        loadFriends();
        listenRequests();
        document.getElementById('top-avatar').innerText = user.nick[0].toUpperCase();
    }

    // ЧАТ
    window.sendMsg = () => {
        const m = document.getElementById('msg-in').value.trim();
        if(!m) return;
        const path = activeChat === 'global' ? 'msgs/global' : 'msgs/direct_' + [user.nick, activeChat].sort().join('_');
        push(ref(db, path), { u: user.nick, m: m, t: 'text' });
        document.getElementById('msg-in').value = '';
    };

    window.switchChat = (id) => {
        activeChat = id;
        document.getElementById('chat-title').innerText = id === 'global' ? 'Общий Чат' : 'ЛС: ' + id;
        document.getElementById('messages-area').innerHTML = '';
        const path = id === 'global' ? 'msgs/global' : 'msgs/direct_' + [user.nick, id].sort().join('_');
        
        onChildAdded(ref(db, path), (snap) => {
            const d = snap.val();
            const div = document.createElement('div');
            div.className = `msg ${d.u === user.nick ? 'msg-my' : 'msg-other'}`;
            div.innerHTML = `<small style="font-size:10px; opacity:0.6;">${d.u}</small><br>${d.m}`;
            document.getElementById('messages-area').appendChild(div);
            document.getElementById('messages-area').scrollTop = 999999;
        });
    };

    // ПОИСК И ДРУЗЬЯ
    window.searchUser = async () => {
        const q = document.getElementById('user-search').value.trim();
        if(!q || q === user.nick) return;
        const s = await get(ref(db, 'users/' + q));
        const res = document.getElementById('search-res');
        if(s.exists()) {
            res.innerHTML = `${q} <button onclick="sendReq('${q}')" style="background:var(--accent); border:0; padding:2px 5px; border-radius:4px;">+</button>`;
        } else res.innerHTML = "Не найден";
    };

    window.sendReq = (to) => {
        set(ref(db, `requests/${to}/${user.nick}`), true);
        alert("Заявка отправлена!");
    };

    function listenRequests() {
        onValue(ref(db, `requests/${user.nick}`), (snap) => {
            const list = document.getElementById('req-list');
            list.innerHTML = '';
            if(snap.exists()) {
                Object.keys(snap.val()).forEach(name => {
                    list.innerHTML += `<div style="display:flex; justify-content:space-between; margin-bottom:5px;">
                        <span>${name}</span>
                        <button onclick="acceptFriend('${name}')" style="background:var(--success); border:0;">V</button>
                    </div>`;
                });
            } else list.innerHTML = "Заявок нет";
        });
    }

    window.acceptFriend = async (name) => {
        await set(ref(db, `friends/${user.nick}/${name}`), true);
        await set(ref(db, `friends/${name}/${user.nick}`), true);
        await remove(ref(db, `requests/${user.nick}/${name}`));
    };

    function loadFriends() {
        onValue(ref(db, `friends/${user.nick}`), (snap) => {
            const cont = document.getElementById('contacts-list');
            cont.innerHTML = `<div style="padding:12px; cursor:pointer;" onclick="switchChat('global'); toggleSidebar()">🌐 Общий Чат</div>`;
            if(snap.exists()) {
                Object.keys(snap.val()).forEach(f => {
                    cont.innerHTML += `<div style="padding:12px; cursor:pointer; border-top:1px solid #111;" onclick="switchChat('${f}'); toggleSidebar()">👤 ${f}</div>`;
                });
            }
        });
    }

    // КЛИКЕР
    window.doClick = () => {
        if(user.energy > 0) {
            user.clicks++; user.energy--;
            document.getElementById('g-clicks').innerText = user.clicks;
            document.getElementById('g-energy').innerText = user.energy;
            update(ref(db, 'users/' + user.nick), { clicks: user.clicks, energy: user.energy });
        } else alert("Нет энергии!");
    };

    // ГОЛОСОВЫЕ
    window.startVoice = async () => {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            mediaRecorder = new MediaRecorder(stream);
            let chunks = [];
            mediaRecorder.ondataavailable = e => chunks.push(e.data);
            mediaRecorder.onstop = () => {
                const blob = new Blob(chunks, { type: 'audio/webm' });
                const reader = new FileReader();
                reader.readAsDataURL(blob);
                reader.onloadend = () => {
                    const path = activeChat === 'global' ? 'msgs/global' : 'msgs/direct_' + [user.nick, activeChat].sort().join('_');
                    push(ref(db, path), { u: user.nick, m: `<audio controls src="${reader.result}"></audio>`, t: 'audio' });
                };
            };
            mediaRecorder.start();
            document.getElementById('mic-btn').classList.add('rec-active');
        } catch(e) { alert("Микрофон недоступен"); }
    };
    window.stopVoice = () => { if(mediaRecorder) mediaRecorder.stop(); document.getElementById('mic-btn').classList.remove('rec-active'); };

    // ИНТЕРФЕЙС
    window.toggleSidebar = () => document.getElementById('sidebar').classList.toggle('active');
    window.openProfile = () => {
        document.getElementById('p-nick').innerText = user.nick;
        document.getElementById('p-role').innerText = "Роль: " + user.role;
        document.getElementById('profile-modal').classList.add('active');
    };
    window.saveAvatar = () => {
        const url = document.getElementById('p-avatar-url').value;
        if(url) {
            user.avatar = url;
            update(ref(db, 'users/' + user.nick), { avatar: url });
            document.getElementById('p-avatar-big').style.backgroundImage = `url(${url})`;
            document.getElementById('p-avatar-big').innerText = '';
        }
    };
    window.openGame = () => {
        document.getElementById('g-clicks').innerText = user.clicks;
        document.getElementById('g-energy').innerText = user.energy;
        document.getElementById('game-modal').classList.add('active');
    };
    window.openRequests = () => document.getElementById('req-modal').classList.add('active');
    window.closeModals = () => document.querySelectorAll('.modal').forEach(m => m.classList.remove('active'));

</script>
</body>
</html>
