<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="TgXq">
    <meta name="theme-color" content="#030308">
    <title>TgXq - Premium Gaming Platform</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="manifest" href="data:application/json,{%22name%22:%22TgXq%22,%22short_name%22:%22TgXq%22,%22start_url%22:%22/%22,%22display%22:%22fullscreen%22,%22background_color%22:%22%23030308%22,%22theme_color%22:%22%232ed3ff%22}">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }

        :root {
            --bg: #030308;
            --bg-2: #070713;
            --panel: rgba(17, 18, 34, 0.74);
            --panel-2: rgba(28, 29, 50, 0.78);
            --line: rgba(255, 255, 255, 0.12);
            --text: #f7f8ff;
            --muted: #9aa0c4;
            --blue: #2ed3ff;
            --purple: #a855ff;
            --pink: #ff4fd8;
            --green: #4dff9a;
            --yellow: #ffe66d;
            --red: #ff5577;
            --shadow: 0 24px 80px rgba(0, 0, 0, 0.55);
            --radius: 18px;
            --safe-top: env(safe-area-inset-top, 0);
            --safe-bottom: env(safe-area-inset-bottom, 0);
        }

        html, body {
            width: 100%;
            height: 100%;
            font-family: 'Inter', system-ui, -apple-system;
            background: var(--bg);
            color: var(--text);
            overflow: hidden;
        }

        body {
            background: radial-gradient(circle at 18% 12%, rgba(46, 211, 255, 0.16), transparent 28%),
                        radial-gradient(circle at 80% 20%, rgba(168, 85, 255, 0.18), transparent 34%),
                        radial-gradient(circle at 50% 100%, rgba(255, 79, 216, 0.1), transparent 40%),
                        var(--bg);
        }

        input, select, textarea {
            font-family: inherit;
            border: 1px solid var(--line);
            border-radius: 14px;
            background: rgba(2, 3, 10, 0.68);
            color: var(--text);
            padding: 13px 14px;
            outline: none;
            -webkit-appearance: none;
            appearance: none;
        }

        input:focus, select:focus, textarea:focus {
            border-color: rgba(46, 211, 255, .68);
            box-shadow: 0 0 0 4px rgba(46, 211, 255, .12);
        }

        button {
            font-family: inherit;
            border: none;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        /* SCROLLBAR */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: rgba(255,255,255,.04); }
        ::-webkit-scrollbar-thumb { background: rgba(46,211,255,.36); border-radius: 99px; }

        .app-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            background: var(--bg);
            position: relative;
        }

        .header {
            background: rgba(3, 3, 8, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--line);
            padding: max(12px, var(--safe-top)) 16px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 100;
            min-height: 56px;
        }

        .header-title {
            font-size: 20px;
            font-weight: 800;
            background: linear-gradient(90deg, var(--blue), var(--purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header-coins {
            background: var(--panel);
            padding: 8px 16px;
            border-radius: 12px;
            border: 1px solid var(--line);
            font-weight: 600;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header-actions {
            display: flex;
            gap: 8px;
        }

        .btn-icon {
            width: 40px;
            height: 40px;
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: all 0.2s;
            position: relative;
        }

        .btn-icon:active {
            background: var(--panel-2);
            border-color: var(--blue);
        }

        .badge {
            position: absolute;
            top: -6px;
            right: -6px;
            background: var(--red);
            color: white;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 700;
        }

        .content {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
            padding-bottom: 60px;
        }

        .nav-bottom {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(3, 3, 8, 0.98);
            backdrop-filter: blur(10px);
            border-top: 1px solid var(--line);
            display: flex;
            padding-bottom: max(0px, var(--safe-bottom));
            z-index: 99;
        }

        .nav-btn {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            padding: 8px 0;
            color: var(--muted);
            font-size: 11px;
            font-weight: 500;
            border: none;
            background: none;
            cursor: pointer;
            transition: all 0.2s;
        }

        .nav-btn.active {
            color: var(--blue);
        }

        .nav-btn-icon {
            font-size: 22px;
        }

        .screen {
            display: none;
            width: 100%;
            height: 100%;
            flex-direction: column;
        }

        .screen.active {
            display: flex;
        }

        /* MODALS */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(4px);
            z-index: 1000;
            align-items: flex-end;
            justify-content: center;
            animation: slideUp 0.3s ease;
        }

        .modal-overlay.active {
            display: flex;
        }

        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        .modal {
            background: var(--panel-2);
            border: 1px solid var(--line);
            border-radius: 24px 24px 0 0;
            padding: 24px 20px;
            max-width: 100%;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            border-top: 1px solid var(--line);
        }

        @media (min-width: 768px) {
            .modal-overlay {
                align-items: center;
                justify-content: center;
            }

            .modal {
                border-radius: 24px;
                max-width: 500px;
                width: 90%;
                max-height: 90vh;
            }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-size: 18px;
            font-weight: 700;
        }

        .modal-close {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 10px;
            font-size: 20px;
        }

        .modal-close:active {
            background: var(--panel-2);
        }

        .form-group {
            margin-bottom: 16px;
            display: flex;
            flex-direction: column;
        }

        .form-label {
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 8px;
        }

        /* CLICKER SCREEN */
        .clicker-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            padding: 20px;
            flex: 1;
        }

        .sphere {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, rgba(46, 211, 255, 0.8), rgba(255, 79, 216, 0.6) 50%, rgba(3, 3, 8, 0.8));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 64px;
            font-weight: 900;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
            box-shadow: 0 0 50px rgba(46, 211, 255, 0.5), inset -20px -20px 60px rgba(0, 0, 0, 0.5);
            transition: all 0.1s ease;
            position: relative;
            overflow: hidden;
        }

        .sphere:active {
            transform: scale(0.93);
            box-shadow: 0 0 30px rgba(255, 79, 216, 0.8);
        }

        @media (max-width: 480px) {
            .sphere {
                width: 160px;
                height: 160px;
                font-size: 56px;
            }
        }

        .sphere::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.2), transparent);
            border-radius: 50%;
        }

        .clicker-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            width: 100%;
            max-width: 420px;
        }

        .stat-box {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 16px;
            padding: 16px 12px;
            text-align: center;
        }

        .stat-label {
            font-size: 11px;
            color: var(--muted);
            text-transform: uppercase;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .stat-value {
            font-size: 22px;
            font-weight: 700;
            color: var(--blue);
            margin-bottom: 8px;
        }

        .progress-bar {
            width: 100%;
            height: 4px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 2px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--blue), var(--purple));
            width: 0%;
            transition: width 0.3s ease;
        }

        .clicker-buttons {
            display: flex;
            gap: 12px;
            width: 100%;
            max-width: 420px;
        }

        .btn {
            padding: 12px 20px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 14px;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
            flex: 1;
            -webkit-tap-highlight-color: transparent;
        }

        .btn-primary {
            background: linear-gradient(90deg, var(--blue), var(--purple));
            color: #000;
        }

        .btn-primary:active {
            transform: scale(0.95);
            box-shadow: 0 0 20px rgba(46, 211, 255, 0.3);
        }

        .btn-secondary {
            background: var(--panel);
            border: 1px solid var(--line);
            color: var(--text);
        }

        .btn-secondary:active {
            background: var(--panel-2);
            border-color: var(--blue);
        }

        .btn-danger { background: var(--red); color: white; }
        .btn-success { background: var(--green); color: #000; }
        .btn-warning { background: var(--yellow); color: #000; }
        .btn-admin { background: var(--purple); color: white; }

        /* SHOP */
        .shop-tabs {
            display: flex;
            gap: 8px;
            padding: 16px 16px 0;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        .shop-tab {
            padding: 10px 16px;
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            color: var(--muted);
            white-space: nowrap;
            transition: all 0.2s;
        }

        .shop-tab.active {
            background: linear-gradient(90deg, var(--blue), var(--purple));
            border-color: transparent;
            color: #000;
        }

        .shop-content {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 12px;
            padding: 16px;
        }

        @media (min-width: 768px) {
            .shop-content {
                grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            }
        }

        .shop-item {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            text-align: center;
            transition: all 0.2s;
        }

        .shop-item:active {
            border-color: var(--blue);
            background: var(--panel-2);
        }

        .shop-item-icon {
            font-size: 28px;
        }

        .shop-item-name {
            font-weight: 700;
            font-size: 13px;
        }

        .shop-item-desc {
            font-size: 11px;
            color: var(--muted);
        }

        .shop-item-price {
            font-weight: 700;
            color: var(--yellow);
            font-size: 14px;
        }

        /* CHAT */
        .chat-screen {
            flex-direction: row;
        }

        .chat-list {
            width: 100%;
            background: var(--panel-2);
            border-right: 1px solid var(--line);
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            flex-shrink: 0;
        }

        @media (min-width: 768px) {
            .chat-list {
                width: 35%;
            }
        }

        .chat-item {
            padding: 12px 16px;
            border-bottom: 1px solid var(--line);
            cursor: pointer;
            display: flex;
            gap: 12px;
            align-items: center;
            transition: all 0.2s;
        }

        .chat-item:active {
            background: var(--panel);
        }

        .chat-item.active {
            background: rgba(46, 211, 255, 0.1);
            border-left: 3px solid var(--blue);
        }

        .chat-item-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--blue), var(--purple));
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 14px;
            color: #000;
            flex-shrink: 0;
        }

        .chat-item-info {
            flex: 1;
            min-width: 0;
        }

        .chat-item-name {
            font-weight: 600;
            font-size: 13px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .chat-item-preview {
            font-size: 11px;
            color: var(--muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .chat-messages {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: 16px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            background: var(--bg);
        }

        .message {
            display: flex;
            gap: 8px;
            max-width: 80%;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.sent {
            margin-left: auto;
            flex-direction: row-reverse;
        }

        .message-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--blue), var(--purple));
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 12px;
            color: #000;
            flex-shrink: 0;
        }

        .message-bubble {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 10px 14px;
            font-size: 14px;
            word-wrap: break-word;
            line-height: 1.4;
        }

        .message.sent .message-bubble {
            background: linear-gradient(135deg, var(--blue), var(--purple));
            border: none;
            color: #000;
        }

        .chat-input-bar {
            display: flex;
            gap: 8px;
            padding: 12px 16px;
            border-top: 1px solid var(--line);
            background: var(--bg);
        }

        .chat-input {
            flex: 1;
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 10px 14px;
            color: var(--text);
            font-size: 14px;
            resize: none;
            max-height: 100px;
            -webkit-appearance: none;
        }

        /* FRIENDS */
        .friends-section {
            padding: 16px;
            border-bottom: 1px solid var(--line);
        }

        .friends-title {
            font-size: 12px;
            font-weight: 700;
            color: var(--blue);
            text-transform: uppercase;
            margin-bottom: 12px;
        }

        .friends-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .friend-item {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.2s;
        }

        .friend-item:active {
            background: var(--panel-2);
            border-color: var(--blue);
        }

        .friend-info {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
        }

        .friend-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--blue), var(--purple));
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: #000;
            flex-shrink: 0;
        }

        .friend-name {
            font-weight: 600;
            font-size: 14px;
        }

        .friend-actions {
            display: flex;
            gap: 6px;
        }

        .btn-small {
            width: 36px;
            height: 36px;
            padding: 0;
            font-size: 16px;
            border-radius: 10px;
        }

        /* ADMIN/MOD PANELS */
        .panel-tabs {
            display: flex;
            gap: 8px;
            padding: 12px 16px;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            border-bottom: 1px solid var(--line);
        }

        .panel-tab {
            padding: 8px 14px;
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            font-size: 12px;
            color: var(--muted);
            white-space: nowrap;
        }

        .panel-tab.active {
            background: var(--purple);
            border-color: var(--purple);
            color: white;
        }

        .panel-content {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 16px;
        }

        .user-card {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .user-info {
            flex: 1;
        }

        .user-login {
            font-weight: 700;
            font-size: 13px;
            margin-bottom: 4px;
        }

        .user-role {
            font-size: 11px;
            color: var(--muted);
        }

        /* CASES */
        .cases-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 12px;
            padding: 16px;
        }

        @media (min-width: 768px) {
            .cases-grid {
                grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            }
        }

        .case-item {
            background: var(--panel);
            border: 2px solid var(--line);
            border-radius: 14px;
            padding: 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .case-item:active {
            border-color: var(--blue);
            transform: scale(0.98);
        }

        .case-icon {
            font-size: 36px;
            margin-bottom: 8px;
        }

        .case-name {
            font-weight: 700;
            font-size: 12px;
            margin-bottom: 6px;
        }

        .case-price {
            font-weight: 700;
            color: var(--yellow);
            font-size: 13px;
        }

        /* LOGIN */
        .login-screen {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-box {
            background: var(--panel-2);
            border: 1px solid var(--line);
            border-radius: 20px;
            padding: 30px 24px;
            width: 100%;
            max-width: 400px;
        }

        .login-title {
            font-size: 28px;
            font-weight: 900;
            background: linear-gradient(90deg, var(--blue), var(--purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-align: center;
            margin-bottom: 8px;
        }

        .login-subtitle {
            text-align: center;
            color: var(--muted);
            font-size: 13px;
            margin-bottom: 24px;
        }

        .toast {
            position: fixed;
            bottom: 80px;
            left: 16px;
            right: 16px;
            background: var(--panel-2);
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 14px 16px;
            z-index: 2000;
            animation: slideUp 0.3s ease;
            max-width: calc(100% - 32px);
            word-wrap: break-word;
        }

        @media (min-width: 768px) {
            .toast {
                bottom: 20px;
                right: 20px;
                left: auto;
                max-width: 300px;
            }
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 40px 20px;
            color: var(--muted);
        }

        .empty-state-icon {
            font-size: 48px;
            opacity: 0.5;
        }

        .online-indicator {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--green);
            display: inline-block;
            margin-right: 6px;
        }

        .offline-indicator {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--muted);
            display: inline-block;
            margin-right: 6px;
        }

        .particle {
            position: fixed;
            pointer-events: none;
            font-weight: 700;
            animation: particleFloat 1s ease-out forwards;
            z-index: 500;
        }

        @keyframes particleFloat {
            0% { opacity: 1; transform: translateY(0) scale(1); }

    <!-- Firebase SDK -->

    <!-- Main APP Script -->
    <script>
        // ==================== FIREBASE CONFIG ====================
        const firebaseConfig = {

        // ==================== CONSTANTS ====================

        const PROFANITY_WORDS = ['блядь', 'пизда', 'хуй', 'ебал', 'срать', 'гавно'];

        const UPGRADES = {

            energyCapacity: { name: 'Емкость', baseCost: 200, multiplier: 1.2, icon: '🔋' },
            autoClicker: { name: 'Автокликер', baseCost: 500, multiplier: 1.25, icon: '🤖' },
            passiveIncome: { name: 'Доход', baseCost: 1000, multiplier: 1.3, icon: '💸' }
        };

        const PREFIXES = {
            vip: { name: 'VIP', cost: 5000, bonus: 0 },
            pro: { name: 'PRO', cost: 15000, bonus: 0.05 },

        };

        const NICKS = {
            rainbow: { name: 'Rainbow', cost: 50000 },
            gold: { name: 'Gold', cost: 75000 },
            fire: { name: 'Fire', cost: 100000 }
        };

        const CASES = {
            noob: {
                name: 'Noob Case',
                cost: 5000,
                icon: '📦',
                rewards: [
                    { type: 'prefix', id: 'noob', name: 'Noob', chance: 5 },
                    { type: 'coins', amount: 1000, name: '1000 💰', chance: 95 }
                ]
            },
            hacker: {
                name: 'Hacker Case',
                cost: 20000,
                icon: '💻',
                rewards: [
                    { type: 'prefix', id: 'hacker', name: 'Hacker', chance: 5 },
                    { type: 'upgrade', id: 'autoClicker', amount: 1, name: '+1 Автокликер', chance: 10 },
                    { type: 'coins', amount: 5000, name: '5000 💰', chance: 85 }
                ]
            },
            god: {
                name: 'God Case',
                cost: 100000,
                icon: '👑',
                rewards: [
                    { type: 'prefix', id: 'god', name: 'God', chance: 5 },
                    { type: 'moderator', name: 'Модератор', chance: 0.1 },
                    { type: 'upgrade', id: 'passiveIncome', amount: 5, name: '+5 Доход', chance: 10 },
                    { type: 'coins', amount: 20000, name: '20000 💰', chance: 84.9 }
                ]
            }
        };

        // ==================== STATE ====================
        const S = {
            currentUser: null,
            currentChat: null,
            coins: 0,
            energy: 100,
            maxEnergy: 100,
            level: 1,
            xp: 0,
            clickPower: 1,
            combo: 0,
            lastClickTime: 0,
            upgrades: { clickPower: 0, energyCapacity: 0, autoClicker: 0, passiveIncome: 0 },
            friends: [],
            requests: [],
            chats: ['global_chat'],
            prefixes: [],
            nicks: [],
            activeNick: null,
            notifications: [],
            role: 'user',
            modRank: null,
            warnings: 0,
            muted: false,
            mutedUntil: 0,
            banned: false,
            isOnline: navigator.onLine,
            unreadNotifications: 0
        };

        let userRef, messagesRef, friendsRef, notificationsRef;

        // ==================== UTILITIES ====================
        function showToast(message, type = 'info') {
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.style.borderLeft = type === 'error' ? '4px solid #ff5577' : type === 'success' ? '4px solid #4dff9a' : '4px solid #2ed3ff';
            toast.textContent = message;
            document.body.appendChild(toast);
            
            setTimeout(() => toast.remove(), 3000);
        }

        function formatCurrency(amount) {
            return Math.floor(amount).toLocaleString('ru-RU');
        }

        function createParticle(text) {
            const particle = document.createElement('div');
            particle.className = 'particle';
            particle.textContent = text;
            particle.style.left = Math.random() * window.innerWidth + 'px';
            particle.style.top = window.innerHeight * 0.4 + 'px';
            particle.style.color = '#4dff9a';
            document.body.appendChild(particle);
            setTimeout(() => particle.remove(), 1000);
        }

        function switchScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.screen === screenId);
            });
        }

        function openModal(id) {
            document.getElementById(id).classList.add('active');
        }

        function closeModal(id) {
            document.getElementById(id).classList.remove('active');
        }

        // ==================== FIREBASE FUNCTIONS ====================
        async function registerUser(username, password) {
            try {
                const usersRef = db.ref('users');
                const snapshot = await usersRef.child(username).get();
                
                if (snapshot.exists()) {
                    showToast('❌ Пользователь уже существует', 'error');
                    return false;
                }

                const newUser = {
                    username,
                    password: btoa(password),
                    coins: 0,
                    energy: 100,
                    maxEnergy: 100,
                    level: 1,
                    xp: 0,
                    clickPower: 1,
                    upgrades: { clickPower: 0, energyCapacity: 0, autoClicker: 0, passiveIncome: 0 },
                    friends: [],
                    requests: [],
                    chats: ['global_chat'],
                    prefixes: [],
                    nicks: [],
                    activeNick: null,
                    notifications: [],
                    role: 'user',
                    modRank: null,
                    warnings: 0,
                    muted: false,
                    mutedUntil: 0,
                    banned: false,
                    lastSeen: new Date().toISOString(),
                    createdAt: new Date().toISOString()
                };

                await db.ref(`users/${username}`).set(newUser);
                showToast('✅ Аккаунт создан!', 'success');
                return true;
            } catch (e) {
                showToast(`❌ Ошибка: ${e.message}`, 'error');
                return false;
            }
        }

        async function loginUser(username, password) {
            try {
                // Admin bypass
                if (username === ADMIN_LOGIN && password === ADMIN_PASSWORD) {
                    S.currentUser = { username: 'admin', role: 'admin' };
                    localStorage.setItem('tgxq_user', 'admin');
                    switchScreen('adminScreen');
                    renderAdminPanel('users');
                    return true;
                }

                const userRef = db.ref(`users/${username}`);
                const snapshot = await userRef.get();

                if (!snapshot.exists()) {
                    showToast('❌ Пользователь не найден', 'error');
                    return false;
                }

                const user = snapshot.val();
                if (user.password !== btoa(password)) {
                    showToast('❌ Неверный пароль', 'error');
                    return false;
                }

                if (user.banned) {
                    showToast('❌ Вы заблокированы', 'error');
                    return false;
                }

                S.currentUser = user;
                Object.assign(S, user);
                localStorage.setItem('tgxq_user', username);

                // Update last seen
                await userRef.update({ lastSeen: new Date().toISOString() });

                // Setup listeners
                setupFirebaseListeners(username);

                showToast(`✅ Добро пожаловать, ${username}!`, 'success');

                if (user.role === 'moderator') {
                    switchScreen('modScreen');
                    renderModPanel('users');
                } else {
                    switchScreen('clickerScreen');
                }

                return true;
            } catch (e) {
                showToast(`❌ Ошибка: ${e.message}`, 'error');
                return false;
            }
        }

        function setupFirebaseListeners(username) {
            // User updates
            userRef = db.ref(`users/${username}`);
            userRef.on('value', (snapshot) => {
                if (snapshot.exists()) {
                    const userData = snapshot.val();
                    Object.assign(S, userData);
                    updateUI();
                }
            });

            // Messages
            messagesRef = db.ref('messages');
            messagesRef.on('child_added', (snapshot) => {
                loadChatMessages();
            });

            // Friends
            friendsRef = db.ref(`users/${username}/friends`);
            friendsRef.on('value', (snapshot) => {
                if (snapshot.exists()) {
                    S.friends = snapshot.val() || [];
                    loadFriends();
                }
            });

            // Notifications
            notificationsRef = db.ref(`users/${username}/notifications`);
            notificationsRef.on('value', (snapshot) => {
                if (snapshot.exists()) {
                    S.notifications = snapshot.val() || [];
                    updateNotificationBadge();
                }
            });
        }

        function updateUI() {
            updateClickerUI();
            updateHeaderCoins();
            loadShop('upgrades');
            loadCases();
        }

        // ==================== CLICKER ====================
        function updateClickerUI() {
            document.getElementById('levelDisplay').textContent = S.level;
            document.getElementById('energyDisplay').textContent = `${Math.ceil(S.energy)}/${S.maxEnergy}`;
            document.getElementById('energyBar').style.width = (S.energy / S.maxEnergy * 100) + '%';
            document.getElementById('xpBar').style.width = ((S.xp % 500) / 500 * 100) + '%';
            document.getElementById('powerDisplay').textContent = formatCurrency(S.clickPower);
            document.getElementById('comboDisplay').textContent = Math.max(0, S.combo);
        }

        function updateHeaderCoins() {
            document.getElementById('headerCoins').textContent = formatCurrency(S.coins) + ' 💰';
        }

        document.getElementById('clickSphere').addEventListener('click', async function() {
            if (S.energy < 1) {
                showToast('❌ Нет энергии', 'error');
                return;
            }

            const now = Date.now();
            const timeSinceLastClick = now - S.lastClickTime;

            if (timeSinceLastClick < 700) {
                S.combo = Math.min(5, S.combo + 1);
            } else {
                S.combo = 1;
            }

            S.lastClickTime = now;

            const multiplier = 1 + (S.combo - 1) * 0.2;
            const clickEarnings = S.clickPower * multiplier;

            S.coins += clickEarnings;
            S.energy = Math.max(0, S.energy - 1);
            S.xp += Math.floor(clickEarnings);

            // Level up
            if (S.xp >= 500) {
                S.level++;
                S.xp = 0;
                S.clickPower += 2;
                S.maxEnergy += 10;
                S.energy = S.maxEnergy;
                showToast(`⬆️ Уровень ${S.level}!`, 'success');
            }

            // Jackpot
            if (Math.random() < 0.001) {
                const jackpot = S.coins * 0.3;
                S.coins += jackpot;
                showToast(`🎉 ДЖЕКПОТ!`, 'success');
            }

            createParticle('+' + formatCurrency(clickEarnings));
            this.style.transform = 'scale(0.93)';
            setTimeout(() => this.style.transform = 'scale(1)', 100);

            updateClickerUI();
            updateHeaderCoins();
            await saveUserData();
        });

        document.getElementById('dailyRewardBtn').addEventListener('click', async () => {
            const today = new Date().toDateString();
            const lastDaily = await db.ref(`users/${S.currentUser.username}/lastDaily`).get();
            
            if (lastDaily.val() === today) {
                showToast('❌ Приз уже получен', 'warning');
                return;
            }

            const streakRef = db.ref(`users/${S.currentUser.username}/dailyStreak`);
            const streakSnapshot = await streakRef.get();
            const streak = (streakSnapshot.val() || 0) + 1;
            const reward = 50 * streak;

            S.coins += reward;
            await db.ref(`users/${S.currentUser.username}`).update({
                coins: S.coins,
                lastDaily: today,
                dailyStreak: streak
            });

            updateHeaderCoins();
            showToast(`🎁 +${formatCurrency(reward)} 💰 (День ${streak})`, 'success');
        });

        document.getElementById('mysteryBoxBtn').addEventListener('click', async () => {
            if (S.coins < 1000) {
                showToast('❌ Нужно 1000 💰', 'error');
                return;
            }

            S.coins -= 1000;
            const reward = Math.floor(Math.random() * 5000) + 500;
            S.coins += reward;

            await saveUserData();
            updateHeaderCoins();
            showToast(`✨ +${formatCurrency(reward)} 💰`, 'success');
        });

        // Auto regen energy
        setInterval(async () => {
            if (S.currentUser && S.currentUser.role === 'user' && S.energy < S.maxEnergy) {
                S.energy = Math.min(S.maxEnergy, S.energy + 0.5);
                updateClickerUI();
                await saveUserData();
            }
        }, 1000);

        // Auto income
        setInterval(async () => {
            if (S.currentUser && S.currentUser.role === 'user') {
                const passiveRate = (0.5 + (S.upgrades.passiveIncome || 0) * 0.5);
                const autoClickerRate = (S.upgrades.autoClicker || 0) * 0.3;
                S.coins += passiveRate + autoClickerRate;
                updateHeaderCoins();
                await saveUserData();
            }
        }, 1000);

        document.querySelectorAll('.shop-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.shop-tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                loadShop(tab.dataset.tab);
            });
        });

        function loadShop(category) {
            const content = document.getElementById('shopContent');
            content.innerHTML = '';

            if (category === 'upgrades') {
                Object.keys(UPGRADES).forEach(key => {
                    const upgrade = UPGRADES[key];
                    const level = S.upgrades[key] || 0;
                    const cost = Math.floor(upgrade.baseCost * Math.pow(upgrade.multiplier, level));

                    const item = document.createElement('div');
                    item.className = 'shop-item';
                    item.innerHTML = `
                        <div class="shop-item-icon">${upgrade.icon}</div>
                        <div class="shop-item-name">${upgrade.name}</div>
                        <div class="shop-item-desc">Уровень: ${level}</div>
                        <div class="shop-item-price">${formatCurrency(cost)} 💰</div>
                    `;
                    item.addEventListener('click', () => buyUpgrade(key, cost));
                    content.appendChild(item);
                });
            } else if (category === 'prefixes') {
                Object.keys(PREFIXES).forEach(key => {
                    const prefix = PREFIXES[key];
                    const owned = S.prefixes.includes(key);

                    const item = document.createElement('div');

        function loadCases() {
            const content = document.getElementById('casesContent');
            content.innerHTML = '';

            Object.keys(CASES).forEach(key => {

                const item = document.createElement('div');
                item.className = 'case-item';
                item.innerHTML = `

        async function openCase(caseKey) {
            if (S.coins < CASES[caseKey].cost) {
                showToast('❌ Недостаточно монет', 'error');
                return;
            }

            S.coins -= CASES[caseKey].cost;
            await saveUserData();
            updateHeaderCoins();

            const caseItem = CASES[caseKey];
            const rand = Math.random() * 100;
            let cumulative = 0;
            let selectedReward = null;

            for (const reward of caseItem.rewards) {
                cumulative += reward.chance;
                if (rand < cumulative) {
                    selectedReward = reward;
                    break;
                }
            }

            if (!selectedReward) {
                selectedReward = caseItem.rewards[caseItem.rewards.length - 1];
            }

            showToast(`🎉 ${selectedReward.name}!`, 'success');
            await applyReward(selectedReward);
        }

        async function applyReward(reward) {
            switch (reward.type) {
                case 'coins':
                    S.coins += reward.amount;
                    break;
                case 'prefix':
                    if (!S.prefixes.includes(reward.id)) {
                        S.prefixes.push(reward.id);
                    }
                    break;
                case 'nick':
                    if (!S.nicks.includes(reward.id)) {
                        S.nicks.push(reward.id);
                    }
                    S.activeNick = reward.id;
                    break;
                case 'upgrade':
                    S.upgrades[reward.id] = (S.upgrades[reward.id] || 0) + reward.amount;
                    break;
            }

            updateHeaderCoins();
            await saveUserData();
        }

        async function acceptRequest(senderId) {
            try {
                const requests = S.requests.filter(r => r !== senderId);
                const friends = [...S.friends, senderId];

                await db.ref(`users/${S.currentUser.username}`).update({
                    requests,
                    friends,
                    chats: [...S.chats, `${Math.min(S.currentUser.username, senderId)}-${Math.max(S.currentUser.username, senderId)}`]
                });

                const senderFriends = (await db.ref(`users/${senderId}/friends`).get()).val() || [];
                senderFriends.push(S.currentUser.username);
                await db.ref(`users/${senderId}/friends`).set(senderFriends);

                loadFriends();
                showToast('✅ Запрос принят', 'success');
            } catch (e) {
                showToast(`❌ Ошибка: ${e.message}`, 'error');
            }

            if (!S.notifications || !S.notifications.length) {
                list.innerHTML = '<div class="empty-state"><div style="font-size: 12px;">Нет уведомлений</div></div>';
            } else {
                S.notifications.reverse().forEach(notif => {
                    const item = document.createElement('div');
                    item.style.cssText = 'background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin-bottom: 8px; border-left: 3px solid var(--blue);';
                    item.innerHTML = `
                        <div style="font-weight: 600; font-size: 13px; margin-bottom: 4px;">${notif.title}</div>
                        <div style="font-size: 12px; color: var(--muted);">${notif.text}</div>
                    `;
                    list.appendChild(item);
                });
            }

            openModal('notificationsModal');
        });

        function updateNotificationBadge() {
            const badge = document.getElementById('notificationBadge');
            const count = (S.notifications || []).length;
            if (count > 0) {
                badge.textContent = count;
                badge.style.display = 'flex';
            } else {
                badge.style.display = 'none';
            }
        }

        // ==================== AUTH HANDLERS ====================
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value.trim();

            if (!username || !password) {
                showToast('❌ Заполните все поля', 'error');
                return;
            }

            await loginUser(username, password);
        });

        document.getElementById('registerBtn').addEventListener('click', async () => {
            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value.trim();

            if (!username || !password) {
                showToast('❌ Заполните все поля', 'error');
                return;
            }

            if (username.length < 3) {
                showToast('❌ Минимум 3 символа', 'error');
                return;
            }

            if (await registerUser(username, password)) {
                document.getElementById('loginForm').reset();
            }
        });

        function logout() {
            localStorage.removeItem('tgxq_user');
            location.reload();
        }

        // ==================== NAVIGATION ====================
        document.querySelectorAll('.nav-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                switchScreen(btn.dataset.screen);
            });
        });

        // ==================== SAVE USER DATA ====================
        async function saveUserData() {
            if (!S.currentUser || S.currentUser.role === 'admin') return;

            try {
                await db.ref(`users/${S.currentUser.username}`).update({
                    coins: S.coins,
                    energy: S.energy,
                    maxEnergy: S.maxEnergy,
                    level: S.level,
                    xp: S.xp,
                    clickPower: S.clickPower,
                    upgrades: S.upgrades,
                    friends: S.friends,
                    requests: S.requests,
                    chats: S.chats,
                    prefixes: S.prefixes,
                    nicks: S.nicks,
                    activeNick: S.activeNick,
                    notifications: S.notifications,
                    role: S.role,
                    modRank: S.modRank,
                    warnings: S.warnings,
                    muted: S.muted,
                    mutedUntil: S.mutedUntil,
                    banned: S.banned,
                    lastSeen: new Date().toISOString()
                });
            } catch (e) {
                console.error('Save error:', e);
            }
        }

        // ==================== ONLINE/OFFLINE ====================
        window.addEventListener('online', () => {
            S.isOnline = true;
            showToast('✅ Соединение восстановлено', 'success');
        });

        window.addEventListener('offline', () => {
            S.isOnline = false;
            showToast('❌ Нет соединения', 'error');
        });

        // ==================== INITIALIZATION ====================
        window.addEventListener('load', async () => {
            const savedUser = localStorage.getItem('tgxq_user');
            
            if (savedUser && savedUser !== 'admin') {
                try {
                    const snapshot = await db.ref(`users/${savedUser}`).get();
                    if (snapshot.exists()) {
                        const user = snapshot.val();
                        S.currentUser = user;
                        Object.assign(S, user);
                        localStorage.setItem('tgxq_user', savedUser);

                        setupFirebaseListeners(savedUser);
                        
                        if (user.role === 'moderator') {
                            switchScreen('modScreen');
                            renderModPanel('users');
                        } else {
                            switchScreen('clickerScreen');
                            updateUI();
                            loadChats();
                            loadFriends();
                        }
                    }
                } catch (e) {
                    console.error('Auto-login error:', e);
                }
            }

            loadCases();
            loadShop('upgrades');
        });

        // Auto-save every 10 seconds
        setInterval(() => {
            saveUserData();
        }, 10000);

        // Service Worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('data:application/javascript,console.log("SW");', { scope: '/' }).catch(() => {});
        }

        console.log('%c🎮 TgXq v' + APP_VERSION, 'font-size: 20px; font-weight: bold; color: #2ed3ff;');
        console.log('%c✅ Firebase подключен', 'color: #4dff9a;');
    </script>
</body>
</html>
