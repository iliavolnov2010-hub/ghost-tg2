<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GHOST TG: UNIVERSE</title>
    <style>
        :root {
            --accent: #00f2ff;
            --bg-dark: #0a0e14;
            --glass: rgba(20, 25, 35, 0.9);
            --border: rgba(0, 242, 255, 0.2);
            --text: #e0e0e0;
        }

        * { box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body, html { 
            margin: 0; padding: 0; height: 100%; width: 100%; 
            background: #000; color: var(--text); overflow: hidden;
        }

        /* Фоновая картинка с эффектом глубины */
        .bg-layer {
            position: fixed; inset: 0;
            background: radial-gradient(circle at center, #102030 0%, #050a10 100%);
            z-index: -1;
        }

        /* --- АВТОРИЗАЦИЯ (Адаптивная) --- */
        #auth-screen { 
            position: fixed; inset: 0; z-index: 10000; 
            display: flex; align-items: center; justify-content: center; 
            background: var(--bg-dark); padding: 20px;
        }
        .auth-box { 
            width: 100%; max-width: 400px; padding: 30px; 
            background: var(--glass); border: 1px solid var(--border); 
            border-radius: 20px; text-align: center; box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }

        /* --- ОСНОВНАЯ СЕТКА --- */
        .app-container {
            display: flex; height: 100vh; width: 100vw;
        }

        /* Боковая панель */
        #sidebar { 
            width: 320px; background: var(--bg-dark); 
            border-right: 1px solid var(--border); display: flex; flex-direction: column;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Главная зона чата */
        #main-chat { 
            flex: 1; display: flex; flex-direction: column; 
            background: rgba(0,0,0,0.3); position: relative;
        }

        /* --- ШАПКИ (Header) --- */
        .header { 
            height: 60px; min-height: 60px; padding: 0 15px;
            display: flex; align-items: center; justify-content: space-between;
            background: var(--glass); border-bottom: 1px solid var(--border);
            backdrop-filter: blur(10px);
        }

        /* --- СПИСОК КОНТАКТОВ --- */
        #contacts-list { flex: 1; overflow-y: auto; }
        .contact-item {
            padding: 15px; border-bottom: 1px solid rgba(255,255,255,0.05);
            display: flex; align-items: center; gap: 12px; cursor: pointer;
        }
        .contact-item:active { background: rgba(0,242,255,0.1); }

        /* --- ЗОНА СООБЩЕНИЙ --- */
        #messages-area { 
            flex: 1; overflow-y: auto; padding: 15px; 
            display: flex; flex-direction: column; gap: 10px;
            background-image: url('https://www.transparenttextures.com/patterns/carbon-fibre.png');
        }
        .msg { 
            max-width: 85%; padding: 10px 15px; border-radius: 15px; 
            line-height: 1.4; font-size: 15px; position: relative;
        }
        .msg-my { align-self: flex-end; background: var(--accent); color: #000; border-bottom-right-radius: 2px; }
        .msg-other { align-self: flex-start; background: #1e2530; color: #fff; border-bottom-left-radius: 2px; border: 1px solid var(--border); }

        /* --- ПОЛЕ ВВОДА --- */
        .input-area { 
            padding: 10px; display: flex; gap: 8px; background: var(--glass);
            border-top: 1px solid var(--border); align-items: center;
        }
        .ui-input { 
            flex: 1; background: rgba(255,255,255,0.05); border: 1px solid var(--border);
            padding: 12px 15px; border-radius: 25px; color: #fff; outline: none; font-size: 16px;
        }
        .icon-btn { 
            width: 45px; height: 45px; border-radius: 50%; border: none;
            background: transparent; color: var(--accent); font-size: 20px; 
            display: flex; align-items: center; justify-content: center; cursor: pointer;
        }

        /* --- МОБИЛЬНАЯ АДАПТАЦИЯ (ГЛАВНОЕ) --- */
        @media (max-width: 768px) {
            #sidebar {
                position: fixed; left: 0; top: 0; bottom: 0; z-index: 1000;
                transform: translateX(-100%); /* Прячем сайдбар влево */
                width: 280px;
            }
            #sidebar.active { transform: translateX(0); }
            
            .msg { max-width: 90%; }
            .header-menu-btn { display: block !important; }
        }

        /* Утилиты */
        .hidden { display: none !important; }
        .avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--accent); color: #000; display: flex; align-items: center; justify-content: center; font-weight: bold; background-size: cover; }
        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 999; display: none; }
        .overlay.active { display: block; }
    </style>
</head>
<body>

<div class="bg-layer"></div>

<!-- ЭКРАН ВХОДА -->
<div id="auth-screen">
    <div class="auth-box">
        <h1 style="color: var(--accent); margin-bottom: 5px;">GHOST TG</h1>
        <p style="opacity: 0.5; margin-bottom: 25px;">Universe Access</p>
        <input type="text" id="auth-login" class="ui-input" style="width: 100%; margin-bottom: 10px;" placeholder="Логин">
        <input type="password" id="auth-pass" class="ui-input" style="width: 100%; margin-bottom: 20px;" placeholder="Пароль">
        <button class="ui-input" style="background: var(--accent); color: #000; font-weight: bold; border: none;" onclick="appLogin()">ВОЙТИ / СОЗДАТЬ</button>
        <p id="auth-error" style="color: #ff4444; font-size: 12px; margin-top: 15px;"></p>
    </div>
</div>

<div class="app-container">
    <!-- ЗАТЕМНЕНИЕ ДЛЯ МОБИЛОК -->
    <div id="overlay" class="overlay" onclick="toggleMenu()"></div>

    <!-- БОКОВАЯ ПАНЕЛЬ -->
    <div id="sidebar">
        <div class="header">
            <span style="font-weight: bold; color: var(--accent);">GHOST OS</span>
            <button class="icon-btn" onclick="toggleMenu()">✕</button>
        </div>
        <div style="padding: 15px;">
            <button class="ui-input" style="width: 100%; text-align: left; margin-bottom: 10px;" onclick="openProfile()">👤 Профиль</button>
            <button class="ui-input" style="width: 100%; text-align: left; margin-bottom: 10px;" onclick="openGame()">🎮 Кликер</button>
        </div>
        <div id="contacts-list">
            <div class="contact-item" onclick="switchChat('global'); toggleMenu()">
                <div class="avatar">🌐</div>
                <b>Общий Чат</b>
            </div>
            <!-- Сюда будут добавляться друзья -->
        </div>
    </div>

    <!-- ОСНОВНОЙ ЧАТ -->
    <div id="main-chat">
        <div class="header">
            <button class="icon-btn header-menu-btn" style="display: none;" onclick="toggleMenu()">☰</button>
            <b id="chat-title">Общий Чат</b>
            <div class="avatar" id="top-avatar" style="width: 35px; height: 35px;">?</div>
        </div>

        <div id="messages-area">
            <!-- Сообщения появятся тут -->
        </div>

        <div class="input-area">
            <button class="icon-btn" id="mic-btn" onmousedown="startVoice()" onmouseup="stopVoice()" ontouchstart="startVoice()" ontouchend="stopVoice()">🎙</button>
            <input type="text" id="msg-in" class="ui-input" placeholder="Сообщение...">
            <button class="icon-btn" onclick="sendMsg()">➤</button>
        </div>
    </div>
</div>

<!-- МОДАЛКИ (Профиль, Игра) — Сделаны максимально просто для всех экранов -->
<div id="modal-box" class="hidden" style="position: fixed; inset: 0; z-index: 5000; background: var(--bg-dark); display: flex; flex-direction: column; padding: 20px;">
    <div class="header" style="background: none; border: none;">
        <h2 id="modal-title" style="color: var(--accent);">Меню</h2>
        <button class="icon-btn" onclick="closeModal()">✕</button>
    </div>
    <div id="modal-content" style="flex: 1; overflow-y: auto; display: flex; flex-direction: column; align-items: center; justify-content: center;">
        <!-- Контент модалки -->
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.17.1/firebase-app.js";
    import { getDatabase, ref, set, push, onChildAdded, onValue, get, update } from "https://www.gstatic.com/firebasejs/9.17.1/firebase-database.js";

    // ТВОИ ДАННЫЕ FIREBASE
    const firebaseConfig = {
        apiKey: "ТВОЙ_КЛЮЧ_ИЗ_ПАНЕЛИ_FIREBASE", // ОБЯЗАТЕЛЬНО ВСТАВЬ ЕГО
        databaseURL: "https://haker-a94a6-default-rtdb.europe-west1.firebasedatabase.app/",
        projectId: "haker-a94a6",
        appId: "1:931213076110:web:166f008f51a6659695d852"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    let user = null;
    let activeChat = 'global';

    // ВХОД
    window.appLogin = async () => {
        const u = document.getElementById('auth-login').value.trim();
        const p = document.getElementById('auth-pass').value.trim();
        if(!u || !p) return;

        try {
            const snap = await get(ref(db, 'users/' + u));
            if(snap.exists()) {
                if(snap.val().pass === p) { user = snap.val(); }
                else { alert("Неверный пароль"); return; }
            } else {
                user = { nick: u, pass: p, role: 'user', avatar: '', clicks: 0, energy: 100 };
                await set(ref(db, 'users/' + u), user);
            }
            document.getElementById('auth-screen').classList.add('hidden');
            switchChat('global');
        } catch(e) { alert("Ошибка: Проверьте интернет или apiKey"); }
    };

    // ЧАТ
    window.sendMsg = () => {
        const m = document.getElementById('msg-in').value.trim();
        if(!m) return;
        push(ref(db, 'msgs/global'), { u: user.nick, m: m, t: 'text' });
        document.getElementById('msg-in').value = '';
    };

    window.switchChat = (id) => {
        activeChat = id;
        document.getElementById('messages-area').innerHTML = '';
        onChildAdded(ref(db, 'msgs/' + id), (snap) => {
            const d = snap.val();
            const div = document.createElement('div');
            div.className = `msg ${d.u === user.nick ? 'msg-my' : 'msg-other'}`;
            div.innerHTML = `<small style="font-size:10px; opacity:0.6;">${d.u}</small><br>${d.m}`;
            document.getElementById('messages-area').appendChild(div);
            document.getElementById('messages-area').scrollTop = document.getElementById('messages-area').scrollHeight;
        });
    };

    // ИНТЕРФЕЙСНЫЕ ФУНКЦИИ
    window.toggleMenu = () => {
        document.getElementById('sidebar').classList.toggle('active');
        document.getElementById('overlay').classList.toggle('active');
    };

    window.openProfile = () => {
        showModal("Мой Профиль", `
            <div class="avatar" style="width:100px; height:100px; font-size:40px;">${user.nick[0]}</div>
            <h3>${user.nick}</h3>
            <p>Статус: ${user.role}</p>
            <button class="ui-input" onclick="alert('Скоро!')">Изменить аватар</button>
        `);
    };

    window.openGame = () => {
        showModal("Ghost Clicker", `
            <div style="text-align:center;">
                <h1 id="m-clicks" style="font-size:50px; color:var(--accent);">${user.clicks}</h1>
                <button onclick="clicker()" style="width:150px; height:150px; border-radius:50%; background:var(--accent); border:none; font-weight:bold; font-size:20px; box-shadow: 0 0 30px var(--accent);">КЛИК!</button>
            </div>
        `);
    };

    window.clicker = () => {
        user.clicks++;
        document.getElementById('m-clicks').innerText = user.clicks;
        update(ref(db, 'users/' + user.nick), { clicks: user.clicks });
    };

    function showModal(title, content) {
        document.getElementById('modal-title').innerText = title;
        document.getElementById('modal-content').innerHTML = content;
        document.getElementById('modal-box').classList.remove('hidden');
    }

    window.closeModal = () => document.getElementById('modal-box').classList.add('hidden');

</script>
</body>
</html>
