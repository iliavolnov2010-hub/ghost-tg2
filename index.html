        try {

          if (session && session.userId) {

          }
        } catch(e) {
          console.error('Session check error:', e);
        }

        this.bindAuthEvents();
      }
      
      bindAuthEvents() {
        const self = this;
        const tabLogin = document.getElementById("tabLogin");
        const tabReg = document.getElementById("tabReg");
        const goLogin = document.getElementById("goLogin");
        const goReg = document.getElementById("goReg");
        
        if (tabLogin) tabLogin.onclick = function() { self.toggleAuth("login"); };
        if (tabReg) tabReg.onclick = function() { self.toggleAuth("reg"); };
        if (goLogin) goLogin.onclick = function() { self.login(); };
        if (goReg) goReg.onclick = function() { self.register(); };
        console.log('✅ Auth events bound');
      }
      
      toggleAuth(mode) {
        const loginCard = document.getElementById("loginCard");
        const regCard = document.getElementById("regCard");
        const tabLogin = document.getElementById("tabLogin");
        const tabReg = document.getElementById("tabReg");
        
        if (loginCard) loginCard.style.display = mode === "login" ? "block" : "none";
        if (regCard) regCard.style.display = mode === "reg" ? "block" : "none";
        if (tabLogin) tabLogin.className = mode === "login" ? "chip active" : "chip ghost";
        if (tabReg) tabReg.className = mode === "reg" ? "chip active" : "chip ghost";
      }
      
      async login() {
        const loginInput = document.getElementById("authLoginIn");
        const passInput = document.getElementById("authPassIn");
        
        const login = loginInput ? loginInput.value.trim() : "";
        const pass = passInput ? passInput.value : "";
        
        if (!login || !pass) return this.ui.toast("Введите логин и пароль");
        
        console.log('🔐 Login attempt:', login);
        
        if (login === CFG.adminLogin && pass === CFG.adminPassword) {
          let admin = await this.db.get('users/' + login, null);
          if (!admin) {
            admin = createUser(CFG.adminLogin, CFG.adminPassword, "admin");
            admin.coins = 999999999;
            await this.db.set('users/' + login, admin);
          }
          return this.loginUser(admin);
        }
        
        const modCreds = await this.db.get("moderators_credentials", {});
        const modEntry = Object.values(modCreds || {}).find(function(m) { 
          return m.login === login && m.password === pass && m.active !== false; 
        });
        
        if (modEntry) {
          const mu = await this.db.get('users/' + modEntry.userId, null);
          if (!mu) return this.ui.toast("Модераторский профиль не найден");
          mu.role = "moderator"; 
          mu.rank = modEntry.rank || "ml.модер";
          await this.db.set('users/' + mu.login, mu);
          return this.loginUser(mu);
        }
        
        const user = await this.db.byLogin(login);
        if (!user || user.password !== pass) return this.ui.toast("Неверный логин/пароль");
        
        // Проверка бана перед входом
        if (user.bannedUntil && user.bannedUntil > Date.now()) {
          const by = user.bannedBy || "Администрация";
          const until = new Date(user.bannedUntil).toLocaleString("ru-RU");
          return this.ui.toast(`Вы заблокированы модератором ${by} до ${until}`);
        }
        
        // Если бан истек, очищаем его
        if (user.bannedUntil && user.bannedUntil <= Date.now()) {
          user.bannedUntil = 0;
          user.bannedBy = "";
          await this.db.set('users/' + login, user);
        }
        
        this.loginUser(user);
      }
      
      async register() {
        const loginInput = document.getElementById("authLoginUp");
        const passInput = document.getElementById("authPassUp");
        const vkInput = document.getElementById("authVkUp");
        
        const login = loginInput ? loginInput.value.trim() : "";
        const pass = passInput ? passInput.value : "";
        const vk = vkInput ? vkInput.value.trim() : "";
        
        if (!login || !pass) return this.ui.toast("Введите логин и пароль");
        if (await this.db.byLogin(login)) return this.ui.toast("Логин уже занят");
        
        const user = createUser(login, pass, "user");
        user.vk = vk.startsWith("http") ? vk : "";
        user.vkId = (vk.match(/\d+/) || [""])[0];
        await this.db.set('users/' + login, user);
        this.loginUser(user);
      }
      
      async loginUser(user, restored) {
        console.log('👤 Login user:', user.login);
        const now = Date.now();
        S.user = JSON.parse(JSON.stringify(user));
        S.user.lastLogin = now;
        await this.db.set("session", { userId: S.user.login, at: now });
        await this.ui.saveUser();
        this.ui.renderApp();
        if (!restored) this.ui.toast("Вход выполнен");
        this.setupUserSync();
      }
      
      setupUserSync() {
        if (!S.user) return;
        const path = 'users/' + S.user.login;
        
        if (S.fbListeners[path]) {
          if (fbDB) fbDB.ref(path).off('value', S.fbListeners[path]);
          delete S.fbListeners[path];
        }
        
        const self = this;
        const listener = function(snap) {
          const fresh = snap.val();
          if (!fresh || !S.user) return;
          
          const safeFields = ['bannedUntil', 'bannedBy', 'mutedUntil', 'mutedBy', 'warnings', 'role', 'rank', 'prefixes', 'nickStyles', 'friends', 'requests', 'chats'];
          for (let i = 0; i < safeFields.length; i++) {
            const field = safeFields[i];
            if (fresh[field] !== undefined) S.user[field] = fresh[field];
          }
          
          if (fresh.coins !== undefined && Math.abs(fresh.coins - S.user.coins) > 0.01) {
            S.user.coins = fresh.coins;
          }
          if (fresh.energy !== undefined && Math.abs(fresh.energy - S.user.energy) > 0.01) {
            S.user.energy = fresh.energy;
          }
          
          // Просто обновляем топ, БЕЗ полной перерисовки экрана
          self.ui.refreshTop();
          // НЕ вызываем renderScreen - это разрушает чат и друзей!
        };
        
        if (fbDB) {
          fbDB.ref(path).on('value', listener);
          S.fbListeners[path] = listener;
          console.log('✅ User sync setup');
        }
      }
      
      async logout() {
        await this.db.remove("session");
        const keys = Object.keys(S.fbListeners);
        for (let i = 0; i < keys.length; i++) {
          const fn = S.fbListeners[keys[i]];
          if (typeof fn === 'function' && S.user && S.user.login && fbDB) {
            fbDB.ref('users/' + S.user.login).off('value', fn);
          }
        }
        S.fbListeners = {};
        S.user = null;
        location.reload();
      }
    }

    class Economy {
      constructor(db, ui) { this.db = db; this.ui = ui; }
      
      mult() {
        let b = 1;
        const prefixes = S.user.prefixes || [];
        for (let i = 0; i < prefixes.length; i++) {
          const p = DATA.prefixes.find(function(x) { return x.id === prefixes[i]; });
          if (p) b += p.income;
        }
        return b;
      }
      
      clickVal() {
        const cm = 1 + (Math.min(5, S.combo) - 1) * 0.25;
        return Math.max(1, (S.user.clickPower + (S.user.upgrades.clickPower || 0)) * cm * this.mult());
      }
      
      async add(amount, reason) {
        reason = reason || "income";
        S.user.coins = Math.max(0, Number(S.user.coins || 0) + amount);
        S.user.transactions.push({ id: this.db.id("tx"), amount: amount, reason: reason, at: Date.now() });
        if (amount > 0) this.addXp(amount);
        await this.auto500k();
        await this.ui.saveUser();
      }
      
      async spend(a) {
        if (S.user.coins < a) { this.ui.toast("Недостаточно монет"); return false; }
        await this.add(-a, "spend");
        return true;
      }
      
      addXp(x) {
        S.user.xp += Math.max(0, x);
        while (S.user.xp >= 500 * S.user.level) {
          S.user.xp -= 500 * S.user.level;
          S.user.level++;
          S.user.clickPower += 2;
          S.user.maxEnergy += 10;
          S.user.energy = S.user.maxEnergy;
          this.ui.toast("Новый уровень: " + S.user.level);
        }
      }
      
      regen() {
        if (!S.user) return;
        S.user.energy = Math.min(S.user.maxEnergy, (S.user.energy || 0) + 0.5);
        if (S.screen === "clicker") app.clicker.refresh();
      }
      
      async passive() {
        if (!S.user) return;
        const p = (S.user.upgrades.passiveIncome || 0) * 0.5;
        const a = (S.user.upgrades.autoClicker || 0) * 0.3 / 20;
        const inc = (p + a) * this.mult();
        if (inc > 0) await this.add(inc, "passive");
      }
      
      async daily() {
        const today = new Date().toISOString().slice(0, 10);
        if (S.user.dailyRewards.lastClaim === today) return this.ui.toast("Сегодня уже забрано");
        const yesterday = new Date(Date.now() - 86400000).toISOString().slice(0, 10);
        S.user.dailyRewards.streak = S.user.dailyRewards.lastClaim === yesterday ? S.user.dailyRewards.streak + 1 : 1;
        S.user.dailyRewards.lastClaim = today;
        const bonus = 50 * S.user.dailyRewards.streak;
        await this.add(bonus, "daily");
        this.ui.toast('Ежедневная награда: +' + bonus);
      }
      
      async mystery() {
        if (!await this.spend(1000)) return;
        const pool = [200, 500, 1000, 2000, 5000, -300];
        const r = pool[Math.floor(Math.random() * pool.length)];
        await this.add(r, "mystery");
        this.ui.toast(r >= 0 ? 'Mystery Box: +' + r : 'Mystery Box: ' + r);
      }
      
      async auto500k() {
        if (S.user.role !== "user" || S.user.promotedAt500k || S.user.coins < 500000) return;
        S.user.promotedAt500k = true;
        await app.moder.grant(S.user.login, "auto_500k");
      }
    }

        if (mystBtn) mystBtn.onclick = function() { app.econ.mystery(); };
        
        this.refresh();
      }
      
      refresh() {
        const b = document.getElementById("eBar");
        const t = document.getElementById("eTxt");
        const c = document.getElementById("comboTxt");
        
        if (b) b.style.width = Math.max(0, Math.min(100, S.user.energy / S.user.maxEnergy * 100)) + '%';
        if (t) t.textContent = Math.floor(S.user.energy) + ' / ' + S.user.maxEnergy;
        if (c) c.textContent = 'x' + (1 + (Math.min(5, S.combo) - 1) * 0.25).toFixed(1);
      }
      
      async click(e) {
        const n = Date.now();
        if (n < S.blockedTo) return this.ui.toast("Античит: временный блок");
        S.cps = S.cps.filter(function(t) { return n - t < 1000; });
        S.cps.push(n);
        
        if (S.cps.length > 20) {
          S.blockedTo = n + 2500; 
          S.user.energy = 0;
          await this.ui.saveUser(); 
          this.refresh();
          return this.ui.toast("Античит: слишком высокий CPS");
        }
        
        if (S.user.energy < 1) return this.ui.toast("Энергия закончилась");
        S.combo = n - S.lastClick <= 700 ? Math.min(5, S.combo + 1) : 1;
        S.lastClick = n; 
        S.user.energy -= 1;
        
        let val = app.econ.clickVal();
        if (Math.random() < 0.001) {
          const j = Math.floor(S.user.coins * 0.3); 
          val += j; 
          this.ui.toast('Джекпот +' + j);
        }
        
        await app.econ.add(val, "click");
        this.float(e, "+" + Math.floor(val)); 
        this.parts(e);
        if (navigator.vibrate) navigator.vibrate(10);
        this.refresh();
      }
      
      float(e, txt) {
        const z = document.getElementById("zone");
        const r = z.getBoundingClientRect();
        const f = document.createElement("div"); 
        f.className = "float"; 
        f.textContent = txt;
        f.style.left = (e.clientX - r.left) + "px"; 
        f.style.top = (e.clientY - r.top) + "px";
        z.appendChild(f); 
        setTimeout(function() { f.remove(); }, 800);
      }
      
      parts(e) {
        const z = document.getElementById("zone");
        const r = z.getBoundingClientRect();
        for (let i = 0; i < 40; i++) {
          const p = document.createElement("i"); 
          p.className = "p";
          const a = Math.random() * Math.PI * 2;
          const d = 30 + Math.random() * 100;
          p.style.left = (e.clientX - r.left) + "px"; 
          p.style.top = (e.clientY - r.top) + "px";
          p.style.color = i % 3 === 0 ? "var(--c2)" : (i % 3 === 1 ? "var(--c1)" : "var(--c3)");
          p.style.setProperty("--dx", Math.cos(a) * d + "px");
          p.style.setProperty("--dy", Math.sin(a) * d + "px");
          z.appendChild(p); 
          setTimeout(function() { p.remove(); }, 760);
        }
      }
    }

    class Shop {

      }

            };
          })(buttons[i]);

      weighted(arr) { 
        const tot = arr.reduce(function(s,x){ return s + x.w; }, 0); 
        let r = Math.random() * tot; 
        for (let i = 0; i < arr.length; i++) {
          r -= arr[i].w; 
          if (r <= 0) return arr[i];
        }
        return arr[arr.length - 1]; 
      }
      
      cases(el) {
        let html = '';
        for (let i = 0; i < DATA.cases.length; i++) {
          const c = DATA.cases[i];
          html += '<div class="card listRow"><div><b>' + c.name + '</b><div class="meta">Цена ' + c.price + '</div></div><button class="pri" data-c="' + c.id + '">Купить</button></div>';

        el.innerHTML = html;
        
        const buttons = el.querySelectorAll("[data-c]");
        const self = this;
        for (let i = 0; i < buttons.length; i++) {
          (function(btn) {
            btn.onclick = function() { self.caseFlow(btn.dataset.c); };
          })(buttons[i]);
        }
      }
      
      async caseFlow(id) {
        const c = DATA.cases.find(function(x) { return x.id === id; });
        if (!c) return;
        
        let chancesHtml = '';
        for (let i = 0; i < c.rewards.length; i++) {
          const r = c.rewards[i];
          chancesHtml += '<div class="listRow"><span>' + this.ui.esc(r.label) + '</span><b>' + r.w + '%</b></div>';
        }
        
        this.ui.modal(c.name, '<div class="card"><h3>Шансы</h3>' + chancesHtml + '</div><div class="meta">Стоимость: ' + c.price + '</div>', '<button class="pri" id="openCase">Открыть</button>');
        
        const self = this;
        setTimeout(function() {
          const o = document.getElementById("openCase");
          if (!o) return;
          o.onclick = async function() {
            if (!await app.econ.spend(c.price)) return;
            const win = self.weighted(c.rewards);
            const preview = Array.from({ length: 54 }, function(_, i) { return c.rewards[i % c.rewards.length]; });
            let previewHtml = '';
            for (let i = 0; i < preview.length; i++) {
              previewHtml += '<div class="rw">' + self.ui.esc(preview[i].label) + '</div>';
            }
            const mdl = document.querySelector(".modal");
            if (mdl) mdl.innerHTML = '<h2>' + self.ui.esc(c.name) + '</h2><div class="rollWrap"><div id="roll" class="roll">' + previewHtml + '</div></div><div class="meta">Крутим...</div>';
            
            setTimeout(function() {
              self.stopRoll(win, async function() { 
                await self.applyReward(win); 
                self.ui.closeModal(); 
                self.ui.toast('Выпало: ' + win.label); 
                self.render(document.getElementById("screenHost")); 
              });
            }, 700);
          };
        }, 20);
      }
      
      stopRoll(win, done) {
        const r = document.getElementById("roll"); 
        if (!r) return done();
        const items = [...r.children];
        let idx = items.findIndex(function(el, i) { return i > 24 && el.textContent === win.label; });
        if (idx < 0) idx = 30;
        if (items[idx]) items[idx].textContent = win.label;
        r.classList.add("stop"); 
        r.style.transform = 'translateX(' + (-idx * 150 + 190) + 'px)';
        setTimeout(done, 3900);
      }
      
      async applyReward(r) {
        const duplicateComp = function(reward) {
          const w = Number(reward.w || 100);
          if (w <= 0.2) return 120000; 
          if (w <= 1) return 60000; 
          if (w <= 3) return 25000; 
          if (w <= 7) return 10000; 
          return 3000;
        };
        
        if (r.t === "coins") await app.econ.add(r.a, "case");
        if (!Array.isArray(S.user.prefixes)) S.user.prefixes = [];
        if (!Array.isArray(S.user.nickStyles)) S.user.nickStyles = [];
        
        if (r.t === "prefix") {
          if (S.user.prefixes.indexOf(r.id) === -1) { 
            S.user.prefixes.push(r.id); 
            S.user.activePrefix = r.id; 
          } else { 
            const c = duplicateComp(r); 
            await app.econ.add(c, "dup_prefix"); 
            this.ui.toast('Дубликат: +' + c); 
          }
        }
        
        if (r.t === "nick") {
          if (S.user.nickStyles.indexOf(r.id) === -1) { 
            S.user.nickStyles.push(r.id); 
            S.user.activeNickStyle = r.id; 
          } else { 
            const c = duplicateComp(r); 
            await app.econ.add(c, "dup_nick"); 
            this.ui.toast('Дубликат: +' + c); 
          }
        }
        
        if (r.t === "up") S.user.upgrades[r.f] = (S.user.upgrades[r.f] || 0) + r.a;
        if (r.t === "mod") await app.moder.grant(S.user.login, "god_case");
        await this.ui.saveUser();
      }
    }

    // ✅ FIX 2: Chat Logic - Invisible updates, no flickering
    class Chat {
      constructor(db, ui) { 
        this.db = db; 
        this.ui = ui; 
        this.chatListener = null; 
        this.lastSend = 0;
        this.renderedMsgIds = new Set();
        this.initialLoadDone = false;
        this.isRendered = false;
      }
      
      render(el) {
        // Если чат уже рендерится, просто загружаем новые сообщения
        if (this.isRendered) {
          if (!this.initialLoadDone) {
            this.loadInitialMessages();
          }
          return;
        }
        
        // Рендерим только один раз
        el.innerHTML = `
          <div class="chatShell">
            <aside class="chatList"><div class="chatHead">Чаты</div>
              <div id="chatItems" class="chatItems">
                <button class="chatItem active" data-type="global"><span>🌍</span><div><b>Общий чат</b><div class="meta">публичный</div></div></button>
              </div>
            </aside>
            <section class="chatMain">
              <div id="chatTitle" class="chatHead">Общий чат</div>
              <div id="msgs" class="msgs"></div>
              <form id="chatForm" class="compose"><input id="chatInput" placeholder="Сообщение..." maxlength="500"><button class="pri" type="submit" id="sendBtn">➤</button></form>
            </section>
          </div>`;
        
        const form = document.getElementById("chatForm");
        const input = document.getElementById("chatInput");
        const sendBtn = document.getElementById("sendBtn");
        const self = this;
        
        if (form) {
          form.onsubmit = async function(e) {
            e.preventDefault();
            sendBtn.disabled = true;
            sendBtn.textContent = "⏳";
            try { 
              await self.send(); 
              if (input) input.value = ""; 
            } catch(err) { 
              console.error("Send error:", err); 
              self.ui.toast("Ошибка отправки"); 
            } finally { 
              sendBtn.disabled = false; 
              sendBtn.textContent = "➤"; 
            }
          };
        }
        
        this.isRendered = true;
        this.setupChatListener();
        this.loadInitialMessages();
      }
      
      setupChatListener() {
        const path = "public_chat/messages";
        
        // Remove old listener
        if (this.chatListener && fbDB) {
          fbDB.ref(path).off('child_added', this.chatListener);
        }
        
        const self = this;
        
        // This listener only fires for NEW messages
        this.chatListener = function(snap) {
          const msg = snap.val();
          if (msg && !self.renderedMsgIds.has(msg.id)) {
            self.appendMessage(msg); // Just adds to bottom, no flicker
            self.renderedMsgIds.add(msg.id);
            
            // Smooth scroll to bottom only if user is near bottom
            const box = document.getElementById("msgs");
            if (box) {
              // Simple auto-scroll
              box.scrollTop = box.scrollHeight;
            }
          }
        };
        
        if (fbDB) {
          // Limit 1 ensures we only get the newest added after this point
          // Initial load handles history
          fbDB.ref(path).orderByChild("at").limitToLast(1).on('child_added', this.chatListener);
        }
      }
      
      async loadInitialMessages() {
        if (this.initialLoadDone) return;
        
        const box = document.getElementById("msgs");
        if (!box || !fbDB) return;
        
        try {
          // Show loading only inside the message box, input remains active
          box.innerHTML = '<div class="meta">Загрузка истории...</div>';
          
          const snap = await fbDB.ref("public_chat/messages").orderByChild("at").limitToLast(50).once('value');
          const obj = snap.val() || {};
          const arr = Object.values(obj).sort(function(a,b) { return (a.at||0) - (b.at||0); });
          
          // Clear loading message
          box.innerHTML = '';
          this.renderedMsgIds.clear();
          
          if (arr.length === 0) { 
            box.innerHTML = '<div class="meta">Пока нет сообщений — будь первым! 👋</div>'; 
          } else {
            for (let i = 0; i < arr.length; i++) {
              const m = arr[i];
              this.appendMessage(m);
              this.renderedMsgIds.add(m.id);
            }
            box.scrollTop = box.scrollHeight;
          }
          
          this.initialLoadDone = true;
        } catch(err) {
          console.error("Load messages error:", err);
          box.innerHTML = '<div class="meta" style="color:var(--bad)">Ошибка загрузки</div>';
        }
      }
      
      canSend() {
        if (!S.user) return "Не авторизован";
        if (S.user.role === "admin" || S.user.role === "moderator") return true;
        if (S.user.bannedUntil && S.user.bannedUntil > Date.now()) {
          return `Вы заблокированы до ${new Date(S.user.bannedUntil).toLocaleString("ru-RU")}`;
        }
        if (S.user.mutedUntil && S.user.mutedUntil > Date.now()) {
          const by = S.user.mutedBy || "Модератор";
          const until = new Date(S.user.mutedUntil).toLocaleString("ru-RU");
          return `У вас мут от ${by} до ${until}`;
        }
        return true;
      }
      
      async send() {
        const check = this.canSend();
        if (check !== true) { this.ui.toast(check); return; }
        const input = document.getElementById("chatInput");
        const text = (input && input.value) ? input.value.trim() : "";
        if (!text) return;
        const now = Date.now();
        if (this.lastSend && now - this.lastSend < 1000) return this.ui.toast("Подождите 1 сек");
        this.lastSend = now;
        this.detectBad(text);
        
        const message = {
          id: this.db.id("msg"),
          senderId: S.user.login,
          senderName: S.user.login,
          senderRole: S.user.role || "user",
          senderRank: S.user.rank || "",
          senderPrefix: S.user.activePrefix || "",
          senderNickStyle: S.user.activeNickStyle || "",
          text: this.ui.esc(text),
          at: Date.now()
        };
        
        if (fbDB) {
          await fbDB.ref("public_chat/messages").push(message);
        }
      }
      
      appendMessage(m) {
        const box = document.getElementById("msgs");
        if (!box) return;
        
        // Remove "empty" message if exists
        if (box.querySelector('.meta')) {
          box.innerHTML = '';
        }
        
        if (m.system || m.senderId === "system") {
          box.insertAdjacentHTML('beforeend', '<div class="sys">' + this.ui.esc(m.text) + '</div>');
          return;
        }
        
        const me = m.senderId === (S.user && S.user.login);
        
        let senderHtml = '';
        if (m.senderRole === "admin") {
          senderHtml += '<span class="tag" style="background:var(--bad);color:#000;margin-right:4px">ADMIN</span>';
        } else if (m.senderRole === "moderator") {
          senderHtml += '<span class="tag" style="background:var(--warn);color:#000;margin-right:4px">MOD</span>';
        }
        if (m.senderPrefix) {
          senderHtml += '<span class="tag" style="margin-right:4px">' + this.ui.esc(m.senderPrefix) + '</span>';
        }
        const nickClass = m.senderNickStyle ? m.senderNickStyle + '-name' : '';
        senderHtml += '<span class="' + nickClass + '" style="font-weight:900">' + this.ui.esc(m.senderName) + '</span>';
        senderHtml += ':';
        
        const timeStr = new Date(m.at).toLocaleTimeString("ru-RU", {hour:"2-digit",minute:"2-digit"});
        const html = '<div class="mg ' + (me ? "me" : "") + '"><div class="bubble"><span class="sender">' + senderHtml + '</span>' + this.ui.esc(m.text) + '<span class="tm">' + timeStr + '</span></div></div>';
        box.insertAdjacentHTML('beforeend', html);
      }
      
      detectBad(text) {
        const lower = text.toLowerCase();
        const hasBad = DATA.badWords.some(function(w) { return lower.indexOf(w) !== -1; });
        if (!hasBad) return;
        this.db.push("violations", {
          id: this.db.id("v"), 
          offenderId: (S.user && S.user.login) || "unknown", 
          text: this.ui.esc(text), 
          at: Date.now(), 
          status: "new"
        });
      }
      
      async openSystem() {
        if (!S.user) return;
        const uid = S.user.login;
        if (!fbDB) return;
        const snap = await fbDB.ref('private_chats/system__' + uid + '/messages').orderByChild("at").limitToLast(20).once('value');
        const arr = Object.values(snap.val() || {}).sort(function(a,b) { return (b.at||0) - (a.at||0); });
        
        let html = '';
        if (arr.length === 0) {
          html = '<div class="meta">Пусто</div>';
        } else {
          for (let i = 0; i < arr.length; i++) {
            const m = arr[i];
            html += '<div class="card"><div>' + this.ui.esc(m.text) + '</div><div class="meta">' + new Date(m.at).toLocaleString("ru-RU") + '</div></div>';
          }
        }
        
        this.ui.modal("🔔 Системные уведомления", html);
      }
      
      cleanup() {
        if (this.chatListener && fbDB) {
          fbDB.ref("public_chat/messages").off('child_added', this.chatListener);
          this.chatListener = null;
        }
      }
    }

        el.innerHTML = `

            <div class="card"><h3 class="title">Поиск игроков</h3><input id="qUser" placeholder="Логин"><div id="sr" class="grid"></div></div>
            <div class="card"><h3 class="title">Входящие заявки</h3><div id="inReq"></div></div>
            <div class="card"><h3 class="title">Исходящие заявки</h3><div id="outReq"></div></div>
            <div class="card"><h3 class="title">Друзья</h3><div id="frList"></div></div>
          </div>`;
        
        const qUser = document.getElementById("qUser");
        const self = this;
        if (qUser) qUser.oninput = function(e) { self.search(e.target.value); };
        
        this.isRendered = true;
        this.rIn(); 
        this.rOut(); 
        this.rFriends();
      }
      
      async search(q) {
        const box = document.getElementById("sr");
        if (!q.trim()) { box.innerHTML = ""; return; }
        const ql = String(q || "").toLowerCase();
        const users = await this.db.allUsers();
        const filtered = users.filter(function(u) {
          return u.login !== S.user.login && 
            !(S.user.friends && S.user.friends[u.login]) && 
            !(S.user.outgoingRequests && S.user.outgoingRequests[u.login]) && 
            String(u.login || "").toLowerCase().indexOf(ql) !== -1;
        });
        
        let html = '';
        if (filtered.length === 0) {
          html = '<div class="meta">Никого не найдено</div>';
        } else {
          for (let i = 0; i < filtered.length; i++) {
            const u = filtered[i];
            html += '<div class="listRow"><div>' + this.ui.nameDisplay(u) + '<div class="meta">' + this.ui.roleText(u) + '</div></div><button class="pri" data-add="' + this.ui.esc(u.login) + '">➕</button></div>';
          }
        }
        box.innerHTML = html;
        
        const buttons = box.querySelectorAll("[data-add]");
        const self = this;
        for (let i = 0; i < buttons.length; i++) {
          (function(btn) {
            btn.onclick = function() { self.req(btn.dataset.add); };
          })(buttons[i]);
        }
      }
      
      async req(tid) {
        const t = await this.db.get('users/' + tid, null);
        if (!t) return;
        if ((t.requests && t.requests[S.user.login]) || (S.user.outgoingRequests && S.user.outgoingRequests[tid])) {
          return this.ui.toast("Заявка уже есть");
        }
        S.user.outgoingRequests = S.user.outgoingRequests || {};
        t.requests = t.requests || {};
        t.requests[S.user.login] = { senderId: S.user.login, at: Date.now() };
        S.user.outgoingRequests[tid] = { targetId: tid, at: Date.now() };
        await this.db.set('users/' + tid, t);
        await this.ui.saveUser();
        
        const idx = await this.db.get("friend_requests_index", {});
        idx[tid + '__' + S.user.login] = { targetId: tid, senderId: S.user.login, at: Date.now(), status: "pending" };
        await this.db.set("friend_requests_index", idx);
        this.ui.toast("Заявка отправлена");
        this.render(document.getElementById("screenHost"));
      }
      
      async clearReqPair(myLogin, otherLogin) {
        const idx = await this.db.get("friend_requests_index", {});
        delete idx[myLogin + '__' + otherLogin];
        delete idx[otherLogin + '__' + myLogin];
        await this.db.set("friend_requests_index", idx);
        
        const me = await this.db.get('users/' + myLogin, null);
        const ot = await this.db.get('users/' + otherLogin, null);
        
        if (me) {
          if (me.requests) delete me.requests[otherLogin];
          if (me.outgoingRequests) delete me.outgoingRequests[otherLogin];
          await this.db.set('users/' + myLogin, me);
          if (S.user.login === myLogin) S.user = JSON.parse(JSON.stringify(me));
        }
        if (ot) {
          if (ot.requests) delete ot.requests[myLogin];
          if (ot.outgoingRequests) delete ot.outgoingRequests[myLogin];
          await this.db.set('users/' + otherLogin, ot);
          if (S.user.login === otherLogin) S.user = JSON.parse(JSON.stringify(ot));
        }
      }
      
      async accept(sid) {
        const s = await this.db.get('users/' + sid, null);
        if (!s) return this.decline(sid);
        S.user.friends[sid] = { since: Date.now() };
        s.friends[S.user.login] = { since: Date.now() };
        const cid = [S.user.login, sid].sort().join("__");
        S.user.chats = [...new Set([...(S.user.chats || []), cid])];
        s.chats = [...new Set([...(s.chats || []), cid])];
        await this.clearReqPair(S.user.login, sid);
        await this.db.set('users/' + sid, s);
        await this.ui.saveUser();
        
        if (fbDB) {
          const chatRef = fbDB.ref('private_chats/' + cid + '/messages');
          const snap = await chatRef.once('value');
          if (!snap.val()) {
            await chatRef.set([{ 
              id: this.db.id("msg"), 
              senderId: "system", 
              text: "Личный чат создан автоматически.", 
              at: Date.now(), 
              system: true 
            }]);
          }
        }
        this.render(document.getElementById("screenHost"));
      }
      
      async decline(sid) { 
        await this.clearReqPair(S.user.login, sid); 
        await this.ui.saveUser(); 
        this.rIn(); 
        this.rOut(); 
      }
      
      async cancel(tid) { 
        await this.clearReqPair(S.user.login, tid); 
        await this.ui.saveUser(); 
        this.rIn(); 
        this.rOut(); 
      }
      
      rIn() {
        const box = document.getElementById("inReq");
        if (!box) return;
        const ids = Object.keys(S.user.requests || {});
        let html = '';
        if (ids.length === 0) {
          html = '<div class="meta">Нет заявок</div>';
        } else {
          for (let i = 0; i < ids.length; i++) {
            const id = ids[i];
            html += '<div class="listRow"><div>' + this.ui.esc(id) + '</div><div class="row"><button class="pri" data-a="' + this.ui.esc(id) + '">✅</button><button class="danger" data-d="' + this.ui.esc(id) + '">❌</button></div></div>';
          }
        }
        box.innerHTML = html;
        
        const acceptBtns = box.querySelectorAll("[data-a]");
        const self = this;
        for (let i = 0; i < acceptBtns.length; i++) {
          (function(btn) {
            btn.onclick = function() { self.accept(btn.dataset.a); };
          })(acceptBtns[i]);
        }
        
        const declineBtns = box.querySelectorAll("[data-d]");
        for (let i = 0; i < declineBtns.length; i++) {
          (function(btn) {
            btn.onclick = function() { self.decline(btn.dataset.d); };
          })(declineBtns[i]);
        }
      }
      
      rOut() {
        const box = document.getElementById("outReq");
        if (!box) return;
        const ids = Object.keys(S.user.outgoingRequests || {});
        let html = '';
        if (ids.length === 0) {
          html = '<div class="meta">Нет исходящих</div>';
        } else {
          for (let i = 0; i < ids.length; i++) {
            const id = ids[i];
            html += '<div class="listRow"><div>' + this.ui.esc(id) + ' <div class="meta">ожидает ответ</div></div><button class="danger" data-c="' + this.ui.esc(id) + '">Отменить</button></div>';
          }
        }
        box.innerHTML = html;
        
        const cancelBtns = box.querySelectorAll("[data-c]");
        const self = this;
        for (let i = 0; i < cancelBtns.length; i++) {
          (function(btn) {
            btn.onclick = function() { self.cancel(btn.dataset.c); };
          })(cancelBtns[i]);
        }
      }
      
      async rFriends() {
        const box = document.getElementById("frList");
        if (!box) return;
        const ids = Object.keys(S.user.friends || {});
        let html = '';
        if (ids.length === 0) {
          html = '<div class="meta">Пока нет друзей</div>';
        } else {
          for (let i = 0; i < ids.length; i++) {
            const id = ids[i];
            html += '<div class="listRow"><div>' + this.ui.esc(id) + '<div class="meta">🟢 онлайн</div></div><div class="row"><button class="ghost" data-pm="' + this.ui.esc(id) + '">💬</button><button class="pri" data-g="' + this.ui.esc(id) + '">🎁100</button></div></div>';
          }
        }
        box.innerHTML = html;
        
        const pmBtns = box.querySelectorAll("[data-pm]");
        for (let i = 0; i < pmBtns.length; i++) {
          (function(btn) {
            btn.onclick = function() {
              S.chatType = "private"; 
              S.chatId = [S.user.login, btn.dataset.pm].sort().join("__");
              app.ui.renderScreen("chat");
            };
          })(pmBtns[i]);
        }
        
        const giftBtns = box.querySelectorAll("[data-g]");
        const self = this;
        for (let i = 0; i < giftBtns.length; i++) {
          (function(btn) {
            btn.onclick = async function() {
              const f = await self.db.get('users/' + btn.dataset.g, null);
              if (!f || !await app.econ.spend(100)) return;
              f.coins = (f.coins || 0) + 100;
              await self.db.set('users/' + btn.dataset.g, f);
              await app.chat.sendSystem(btn.dataset.g, S.user.login + ' отправил вам 100 монет.');
              self.ui.toast("Подарок отправлен");
            };
          })(giftBtns[i]);
        }
      }
    }

    class Moder {
      constructor(db, ui) { this.db = db; this.ui = ui; }
      
      async rights() {
        if (S.user.role === "admin") return { warn:true, mute:true, ban:true, manage:true };
        const mods = await this.db.get("moderators_credentials", {});
        const e = Object.values(mods || {}).find(function(m) { 
          return m.userId === S.user.login && m.active !== false; 
        });
        return e ? e.rights : { warn:true, mute:false, ban:false, manage:false };
      }
      
      p(rank) {
        const ranks = { user:0, "ml.модер":1, "модер":2, "ст.модер":3, "мл.админ":4, admin:9 };
        return ranks[rank] || 0;
      }
      
      canAffect(target) {
        if (S.user.role === "admin") return true;
        return this.p(S.user.rank || "ml.модер") > this.p(target.rank || target.role || "user");
      }
      
      async grant(login, source) {
        source = source || "manual";
        const u = await this.db.get('users/' + login, null);
        if (!u) return;
        const modLogin = "Moder_" + Math.floor(1000 + Math.random() * 9000);
        const modPass = String(Math.floor(100000 + Math.random() * 900000));
        u.role = "moderator";
        if (!u.rank || u.rank === "user") u.rank = "ml.модер";
        await this.db.set('users/' + login, u);
        
        const creds = await this.db.get("moderators_credentials", {});
        creds[modLogin] = { 
          login: modLogin, 
          password: modPass, 
          userId: login, 
          rank: u.rank, 
          rights: {warn:true, mute:false, ban:false}, 
          source: source, 
          active: true, 
          createdAt: Date.now() 
        };
        await this.db.set("moderators_credentials", creds);
        
        const stats = await this.db.get('moderators_stats/' + login, null);
        if (!stats) {
          await this.db.set('moderators_stats/' + login, { warnings:0, mutes:0, bans:0 });
        }
        
        await this.sendSystem(login, 'Вам выдана модерка. Логин: ' + modLogin + '. Пароль: ' + modPass + '. Ранг: ' + u.rank + '.');
        await this.log("grant_mod", login, source);
        if (S.user && S.user.login === login) S.user = JSON.parse(JSON.stringify(u));
      }
      
      async addStat(field) {
        const st = await this.db.get('moderators_stats/' + S.user.login, { warnings:0, mutes:0, bans:0 });
        st[field] = (st[field] || 0) + 1;
        await this.db.set('moderators_stats/' + S.user.login, st);
        
        const rank = S.user.rank || "ml.модер";
        if (rank === "ml.модер" && st.warnings >= 30) {
          await this.setRank("модер", { warn:true, mute:true, ban:false });
        }
        if (rank === "модер" && st.warnings >= 15 && st.mutes >= 20) {
          await this.setRank("ст.модер", { warn:true, mute:true, ban:true });
        }
      }
      
      async setRank(rank, rights) {
        S.user.rank = rank;
        await this.db.set('users/' + S.user.login, S.user);
        const creds = await this.db.get("moderators_credentials", {});
        const keys = Object.keys(creds);
        for (let i = 0; i < keys.length; i++) {
          const c = creds[keys[i]];
          if (c.userId === S.user.login) {
            c.rank = rank;
            c.rights = rights;
          }
        }
        await this.db.set("moderators_credentials", creds);
        this.ui.toast("Повышение: " + rank);
      }
      
      async log(action, target, detail) {
        let l = safeArray(await this.db.get("mod_logs", []));
        
        l.push({ 
          id: this.db.id("log"), 
          action: action, 
          moderatorId: (S.user && S.user.login) || "system", 
          targetId: target, 
          detail: detail, 
          at: Date.now() 
        });
        await this.db.set("mod_logs", l);
      }
      
      async targetReason() {
        const idEl = document.getElementById("modTarget");
        const reasonEl = document.getElementById("modReason");
        const id = idEl ? idEl.value : "";
        const rs = reasonEl ? this.ui.esc(reasonEl.value.trim() || "Без причины") : "Без причины";
        const t = await this.db.get('users/' + id, null);
        return { t: t, rs: rs };
      }
      
      async warn() {
        const r = await this.rights();
        if (!r.warn) return this.ui.toast("Нет права warn");
        const { t, rs } = await this.targetReason();
        if (!t) return;
        if (!this.canAffect(t)) return this.ui.toast("Нельзя наказать равный/высший ранг");
        t.warnings = t.warnings || [];
        t.warnings.push({ by: S.user.login, reason: rs, at: Date.now() });
        await this.db.set('users/' + t.login, t);
        await this.sendSystem(t.login, 'Предупреждение: ' + rs);
        await this.addStat("warnings");
        await this.log("warn", t.login, rs);
        this.ui.toast("Warn выдан");
        this.refresh();
      }
      
      async mute(h) {
        const r = await this.rights();
        if (!r.mute) return this.ui.toast("Нет права mute");
        const { t, rs } = await this.targetReason();
        if (!t) return;
        if (!this.canAffect(t)) return this.ui.toast("Нельзя наказать равный/высший ранг");
        t.mutedUntil = Date.now() + h * 3600000;
        t.mutedBy = S.user.login;
        await this.db.set('users/' + t.login, t);
        await this.sendSystem(t.login, `Мут на ${h}ч. Причина: ${rs}. Выдал: ${S.user.login}`);
        await this.addStat("mutes");
        await this.log("mute_" + h + "h", t.login, rs);
        this.refresh();
      }
      
      async banToggle() {
        const r = await this.rights();
        if (!r.ban) return this.ui.toast("Нет права ban");
        const { t, rs } = await this.targetReason();
        if (!t) return;
        if (!this.canAffect(t)) return this.ui.toast("Нельзя наказать равный/высший ранг");
        const on = t.bannedUntil && t.bannedUntil > Date.now();
        t.bannedUntil = on ? 0 : Date.now() + 3650 * 86400000;
        t.bannedBy = S.user.login;
        await this.db.set('users/' + t.login, t);
        await this.sendSystem(t.login, on ? "Бан снят." : `Бан до ${new Date(t.bannedUntil).toLocaleString("ru-RU")}. Причина: ${rs}. Выдал: ${S.user.login}`);
        await this.addStat("bans");
        await this.log(on ? "unban" : "ban", t.login, rs);
        this.refresh();
      }
      
      async clearMute() {
        const r = await this.rights();
        if (!r.mute) return this.ui.toast("Нет права clear mute");
        const { t, rs } = await this.targetReason();
        if (!t) return;
        if (!this.canAffect(t)) return this.ui.toast("Нельзя наказать равный/высший ранг");
        t.mutedUntil = 0;
        t.mutedBy = "";
        await this.db.set('users/' + t.login, t);
        await this.sendSystem(t.login, 'Мут снят. ' + rs);
        await this.log("clear_mute", t.login, rs);
        this.refresh();
      }
      
      refresh() {
        if (S.screen === "moderator") app.ui.renderScreen("moderator");
        if (S.screen === "admin") app.ui.renderScreen("admin");
      }
      
      async render(el) {
        const r = await this.rights();
        const allUsers = await this.db.allUsers();
        const users = allUsers.filter(function(u) { return u.login !== S.user.login; });
        const vio = safeArray(await this.db.get("violations", [])).slice(-12).reverse();
        
        let usersHtml = '';
        for (let i = 0; i < users.length; i++) {
          usersHtml += '<option value="' + users[i].login + '">' + this.ui.esc(users[i].login) + '</option>';
        }
        
        let vioHtml = '';
        if (vio.length === 0) {
          vioHtml = '<div class="meta">Нарушений нет</div>';
        } else {
          for (let i = 0; i < vio.length; i++) {
            const v = vio[i];
            vioHtml += '<div class="listRow"><div><b>' + this.ui.esc(v.offenderId) + '</b><div class="meta">' + this.ui.esc(v.text) + '</div></div><span class="tag">' + new Date(v.at).toLocaleTimeString("ru-RU") + '</span></div>';
          }
        }
        
        el.innerHTML = `
          <div class="grid">
            <div class="card"><h3 class="title">Панель модератора</h3>
              <div class="meta">Права: warn ${r.warn ? "да" : "нет"}, mute ${r.mute ? "да" : "нет"}, ban ${r.ban ? "да" : "нет"}.</div>
            </div>
            <div class="card"><h3 class="title">Управление игроками</h3>
              <select id="modTarget">${usersHtml}</select>
              <textarea id="modReason" placeholder="Причина"></textarea>
              <div class="grid two">
                <button id="wBtn" class="pri">Warn</button>
                <button id="m1Btn" class="ghost">Мут 1ч</button>
                <button id="m24Btn" class="ghost">Мут 24ч</button>

      // ✅ FIX 1: Set Rank logic with comprehensive logging
      async setRank(rank, userObj) {
        console.log('🔧 setRank called with rank:', rank);
        console.log('   userObj:', userObj);
        
        // Если пользователь передан напрямую, используем его
        let u = userObj;
        
        // Если нет - получаем из admTarget
        if (!u) {
          u = await this.tgt();
        }
        
        console.log('📍 Target user:', u);
        
        if (!u) { 
          console.error('❌ User not found or tgt() returned null');
          this.ui.toast("Пользователь не выбран");
          return; 
        }
        
        if (u.role === "admin") { 
          console.error('❌ Cannot change admin rank');
          this.ui.toast("Нельзя менять ранг администратора");
          return; 
        }
        
        console.log('✅ User valid, proceeding with rank change');
        console.log('   Old role:', u.role, 'Old rank:', u.rank, 'New rank:', rank);
        
        // Update role and rank in user object
        const oldRole = u.role;
        const oldRank = u.rank || "user";
        u.role = "moderator";
        u.rank = rank;
        
        const rightsBy = { 
          "ml.модер": {warn:true, mute:false, ban:false}, 
          "модер": {warn:true, mute:true, ban:false}, 
          "ст.модер": {warn:true, mute:true, ban:true}, 
          "мл.админ": {warn:true, mute:true, ban:true, adminLite:true} 
        };
        
        // Update credentials
        console.log('🔐 Updating credentials...');
        const creds = await this.db.get("moderators_credentials", {});
        console.log('   Current creds count:', Object.keys(creds).length);
        
        let found = false;
        const keys = Object.keys(creds);
        for (let i = 0; i < keys.length; i++) {
          const c = creds[keys[i]];
          if (c.userId === u.login) {
            console.log('   ✅ Found existing credential:', keys[i]);
            console.log('      Old rank:', c.rank, '-> New rank:', rank);
            c.rank = rank;
            c.rights = rightsBy[rank];
            found = true;
          }
        }
        
        // If not in credentials, grant new ones
        if (!found) {
          console.log('   ⚠️ No existing credential found, creating new one');
          const modLogin = "Moder_" + Math.floor(1000 + Math.random() * 9000);
          const modPass = String(Math.floor(100000 + Math.random() * 900000));
          creds[modLogin] = { 
            login: modLogin, 
            password: modPass, 
            userId: u.login, 
            rank: rank, 
            rights: rightsBy[rank], 
            source: "admin_rank_set", 
            active: true, 
            createdAt: Date.now() 
          };
          console.log('   ✅ New credential created:', modLogin);
        }
        
        console.log('💾 Saving credentials to DB...');
        await this.db.set("moderators_credentials", creds);
        console.log('   ✅ Credentials saved');
        
        // Send system message to the user
        const msgText = oldRole === "user" 
          ? `✅ Вы были назначены модератором с рангом: ${rank}` 
          : `⬆️ Ваш ранг повышен: ${oldRank} → ${rank}`;
        
        console.log('📨 Sending system message:', msgText);
        await this.sendSystem(u.login, msgText);
        console.log('   ✅ Message sent');
        
        // Save user to DB
        console.log('💾 Saving user data to DB...');
        await this.db.set('users/' + u.login, u);
        console.log('   ✅ User saved to DB');
        
        // If this is the current user, update S.user immediately
        if (S.user && S.user.login === u.login) {
          console.log('🔄 Updating current user in memory...');
          S.user = JSON.parse(JSON.stringify(u));
          console.log('   ✅ Current user updated');
          console.log('   New role:', S.user.role, 'New rank:', S.user.rank);
        }
        
        // Log action
        await app.moder.log("admin_set_rank_" + rank, u.login, "admin_panel");
        
        this.ui.toast(`✅ ${u.login} повышен на ${rank}!`);
        console.log('✅ setRank completed successfully');

          if (!e || !e.value) return;
          const creds = await self.db.get("moderators_credentials", {});
          const credsValues = Object.values(creds);
          let hit = null;
          for (let i = 0; i < credsValues.length; i++) {
            if (credsValues[i].userId === e.value) {
              hit = credsValues[i];
              break;
            }
          }
          if (!hit) return self.ui.toast("Привязка не найдена");
          const userData = await self.db.get('users/' + e.value, {});
          self.ui.modal("Привязка модер-акка", `
            <div class="card">
              <div class="listRow"><span>Игрок</span><b>${self.ui.esc(userData.login || e.value)}</b></div>
              <div class="listRow"><span>Логин модера</span><b>${self.ui.esc(hit.login)}</b></div>
              <div class="listRow"><span>Пароль модера</span><b>${self.ui.esc(hit.password)}</b></div>
              <div class="listRow"><span>Ранг</span><b>${self.ui.esc(hit.rank || "ml.модер")}</b></div>
            </div>`);
        };
        
        const givePrefBtn = document.getElementById("givePref");
        if (givePrefBtn) givePrefBtn.onclick = async function() {
          const u = await self.tgt();
          if (!u) return;
          const allPrefixes = DATA.prefixes.map(function(p) { return p.id; });
          allPrefixes.push("Noob", "Hacker", "God");
          u.prefixes = [...new Set([...(u.prefixes || []), ...allPrefixes])];
          u.activePrefix = u.prefixes[0] || "";
          await self.sendSystem(u.login, "Админ выдал вам все префиксы.");
          await self.saveT(u, "admin_give_prefixes");
        };
        
        const giveNicksBtn = document.getElementById("giveNicks");
        if (giveNicksBtn) giveNicksBtn.onclick = async function() {
          const u = await self.tgt();
          if (!u) return;
          const allNicks = DATA.nicks.map(function(n) { return n.id; });
          u.nickStyles = [...new Set([...(u.nickStyles || []), ...allNicks])];
          u.activeNickStyle = u.nickStyles[0] || "";
          await self.sendSystem(u.login, "Админ выдал вам все стили ников.");
          await self.saveT(u, "admin_give_nicks");
        };
        
        const resetAccBtn = document.getElementById("resetAcc");
        if (resetAccBtn) resetAccBtn.onclick = async function() {
          const u = await self.tgt();
          if (!u || u.role === "admin") return;
          const base = createUser(u.login, u.password, u.role);
          base.id = u.id;
          base.vk = u.vk;
          base.vkId = u.vkId;
          if (u.role === "moderator") base.rank = u.rank || "ml.модер";
          await self.saveT(base, "admin_reset_account");
        };
        
        const sendDirectBtn = document.getElementById("sendDirect");
        if (sendDirectBtn) sendDirectBtn.onclick = async function() {
          const u = await self.tgt();
          const txtEl = document.getElementById("directSysMsg");
          const txt = txtEl ? self.ui.esc(txtEl.value.trim()) : "";
          if (!u || !txt) return self.ui.toast("Введите текст");
          await self.sendSystem(u.login, txt);
          self.ui.toast("Сообщение отправлено");
        };
      }
    }

    class App {
      constructor() {
        this.db = new FireDB();
        this.ui = new UI(this.db);
        this.auth = new Auth(this.db, this.ui);
        this.econ = new Economy(this.db, this.ui);
        this.clicker = new Clicker(this.db, this.ui);
        this.shop = new Shop(this.db, this.ui);
        this.chat = new Chat(this.db, this.ui);
        this.friends = new Friends(this.db, this.ui);
        this.profile = new Profile(this.db, this.ui);
        this.settings = new Settings(this.db, this.ui);
        this.moder = new Moder(this.db, this.ui);
        this.admin = new Admin(this.db, this.ui);
        console.log('✅ App classes initialized');
        console.log('Admin instance:', this.admin);
      }
      
      async start() {
        console.log('🚀 App starting...');
        try {
          await this.db.seed();
          console.log('✅ Database seeded');
          this.auth.init();
          console.log('✅ Auth initialized');
          const self = this;
          S.timers.push(setInterval(function() { self.econ.regen(); }, 1000));
          S.timers.push(setInterval(function() { self.econ.passive(); }, 1000));
          S.timers.push(setInterval(function() { self.ui.saveUser(); }, 15000));
          console.log('✅ Timers started');
          
          window.addEventListener("beforeunload", function() {
            self.db.cleanup();
            const keys = Object.keys(S.fbListeners);
            for (let i = 0; i < keys.length; i++) {
              const fn = S.fbListeners[keys[i]];
              if (typeof fn === 'function' && S.user && S.user.login && fbDB) {
                fbDB.ref('users/' + S.user.login).off('value', fn);
              }
            }
            for (let i = 0; i < S.timers.length; i++) {
              clearInterval(S.timers[i]);
            }
          });
          console.log('✅ App started successfully');
        } catch(e) {
          console.error('❌ App start error:', e);
          const root = document.getElementById("root");
          if (root) {
            root.innerHTML = '<div class="shell auth"><div class="card"><h2>Ошибка запуска</h2><div class="error-msg">' + this.ui.esc(e.message) + '</div><div class="meta">Откройте консоль (F12) для подробностей</div></div></div>';
          }
        }
      }
    }

    function showFatal(err) {
      const root = document.getElementById("root");
      if (!root) return;
      root.innerHTML = '<section class="shell auth"><div class="card"><h2>Ошибка</h2><div class="error-msg">' + err + '</div><div class="meta">Обновите страницу (Ctrl+F5)</div></div></section>';
    }
    
    window.addEventListener("error", function(e) {
      console.error('Global error:', e);
      const rootEl = document.getElementById("root");
      if (rootEl && !rootEl.innerHTML) {
        showFatal(e.message || "script error");
      }
    });

    console.log('📄 DOM loaded, initializing app...');
    let app;
    
    function initApp() {
      console.log('🎯 Initializing app...');
      try {
        app = new App();
        app.start();
      } catch (e) {
        console.error('Init error:', e);
        showFatal(e.message || e);
      }
    }
    
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initApp);
    } else {
      initApp();
    }
  </script>
</body>
