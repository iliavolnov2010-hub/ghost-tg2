    html, body { height: 100%; }

    .card {

      padding: 14px;

    }

    }
    .stat-row, .item-row, .request-row, .friend-row, .user-row {

    .stat-row:first-child, .item-row:first-child, .request-row:first-child, .friend-row:first-child, .user-row:first-child { border-top: 0; padding-top: 0; }
    .muted { color: var(--muted); }
    .good { color: var(--green); }

    .sphere {
      width: min(64vw, 290px);

      max-width: 290px;

      box-shadow: 0 0 40px rgba(46,211,255,.32), 0 0 90px rgba(168,85,255,.25), inset -34px -40px 70px rgba(0,0,0,.52), inset 18px 14px 34px rgba(255,255,255,.2);

      z-index: 50;

      background: rgba(7, 10, 22, .94);

      animation: toastIn .24s ease both;
    }
    @keyframes toastIn { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }
    .case-strip-wrap {
      height: 94px;
      overflow: hidden;
      border-radius: 16px;
      border: 1px solid var(--line);
      background: rgba(0,0,0,.24);

      position: relative;

      display: flex;
      gap: 10px;
      padding: 12px;
      width: max-content;
      animation: spinStrip 1.7s linear infinite;
    }
    .case-strip.stopping {
      animation: none;
      transition: transform 3.1s cubic-bezier(.12, .72, .08, 1);
    }
    .case-strip-wrap::after {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      left: 50%;
      width: 3px;
      transform: translateX(-50%);
      background: linear-gradient(180deg, transparent, var(--yellow), transparent);
      box-shadow: 0 0 18px rgba(255,230,109,.8);

    class StorageDB {
      constructor(prefix) {
        this.prefix = prefix;
        this.versionKey = `${prefix}app_version`;
      }
      key(path) { return this.prefix + path.replaceAll("/", "_"); }
      get(path, fallback = null) {
        const raw = localStorage.getItem(this.key(path));
        if (raw === null || raw === undefined) return fallback;
        try { return JSON.parse(raw); } catch { return fallback; }
      }
      set(path, value) {
        localStorage.setItem(this.key(path), JSON.stringify(value));
        return value;
      }
      update(path, patch) {
        const next = { ...(this.get(path, {}) || {}), ...patch };
        return this.set(path, next);
      }
      push(path, value) {
        const arr = this.get(path, []);
        arr.push({ id: this.id("item"), ...value });
        this.set(path, arr);
        return arr[arr.length - 1];
      }
      remove(path) {
        localStorage.removeItem(this.key(path));
      }
      listKeys(prefixPath) {
        const prefix = this.key(prefixPath);
        return Object.keys(localStorage).filter(k => k.startsWith(prefix));
      }
      id(prefix = "id") {
        return `${prefix}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 8)}`;
      }
      checkVersion(ui) {
        const old = localStorage.getItem(this.versionKey);
        if (old && old !== CONFIG.version) ui.toast("Приложение обновлено!");
        localStorage.setItem(this.versionKey, CONFIG.version);

      allUsers() {
        const ids = this.get("users_index", []);
        return ids.map(id => this.get(`users/${id}`, null)).filter(Boolean);
      }
      privateChatIds() {
        const start = this.key("private_chats/");
        const end = "_messages";
        return Object.keys(localStorage)
          .filter(k => k.startsWith(start) && k.endsWith(end))
          .map(k => k.slice(start.length, -end.length))
          .filter(id => id.includes("__") && !id.includes("system"));
      }
      saveUser(user) {
        this.set(`users/${user.id}`, user);
        const ids = this.get("users_index", []);
        if (!ids.includes(user.id)) this.set("users_index", [...ids, user.id]);
      }
      findUserByLogin(login) {
        const normalized = String(login || "").trim().toLowerCase();

        this.refreshHeader();
        if (oldCoins !== S.user.coins && S.currentScreen !== "admin") this.toast("Баланс обновлён");
        if (["profile", "friends", "moderator", "admin"].includes(S.currentScreen)) this.renderScreen(S.currentScreen);
      }
      roleLabel(user) {
        if (user.role === "admin") return "Администратор";
        if (user.role === "moderator") return `Модератор ${user.rank || "ml.модер"}`;
        return "Игрок";
      }
      formatName(userOrId) {
        const user = typeof userOrId === "string" ? this.db.get(`users/${userOrId}`, null) : userOrId;
        if (!user) return "Система";
        const safe = this.sanitize(user.login);
        const dev = user.vkId === CONFIG.developer.vkId || user.vk === CONFIG.developer.vk || user.id === "u_zuhra";
        const cls = dev ? "dev-name" : user.activeNickStyle ? `${user.activeNickStyle}-name` : "";
        const prefix = user.activePrefix ? `<span class="tag ${user.activePrefix.toLowerCase()}">${this.sanitize(user.activePrefix)}</span> ` : "";
        const devTag = dev ? ` <span class="tag dev">DEV</span>` : "";
        return `${prefix}<span class="${cls}">${safe}</span>${devTag}`;
      }
      saveCurrentUser() {
        if (!S.user) return;
        const existing = this.db.get(`users/${S.user.id}`, null);
        if (existing) {
          S.user.friends = { ...(existing.friends || {}), ...(S.user.friends || {}) };
          S.user.chats = [...new Set([...(existing.chats || []), ...(S.user.chats || [])])];
          S.user.requests = { ...(S.user.requests || {}) };
          S.user.outgoingRequests = { ...(S.user.outgoingRequests || {}) };
          Object.values(this.db.get("friend_requests_index", {})).forEach(req => {
            if (req.targetId === S.user.id && req.status === "pending" && !S.user.friends[req.senderId]) S.user.requests[req.senderId] = { senderId: req.senderId, at: req.at };
            if (req.senderId === S.user.id && req.status === "pending" && !S.user.friends[req.targetId]) S.user.outgoingRequests[req.targetId] = { targetId: req.targetId, at: req.at };
          });
          Object.keys(S.user.outgoingRequests || {}).forEach(targetId => {
            const target = this.db.get(`users/${targetId}`, null);
            if (S.user.friends[targetId] || (target && target.friends && target.friends[S.user.id])) delete S.user.outgoingRequests[targetId];
          });
          Object.keys(S.user.requests || {}).forEach(senderId => {
            if (S.user.friends[senderId]) delete S.user.requests[senderId];
          });
        }
        S.user.lastSeen = Date.now();
        this.db.saveUser(S.user);
        this.refreshHeader();
      }
    }

    class AuthSystem {
      constructor(db, ui) { this.db = db; this.ui = ui; this.mode = "login"; }
      init() {
        const session = this.db.get("session", null);
        if (session) {
          const user = this.db.get(`users/${session.userId}`, null);
          if (user) return this.loginUser(user, true);
        }
        this.ui.renderAuth();
        this.bind();
      }
      bind() {
        document.querySelectorAll("[data-auth-tab]").forEach(btn => btn.onclick = () => {
          this.mode = btn.dataset.authTab;
          document.querySelectorAll("[data-auth-tab]").forEach(b => b.classList.toggle("active", b === btn));
          document.getElementById("authVk").classList.toggle("hidden", this.mode !== "register");
          document.querySelector("#authForm .primary").textContent = this.mode === "login" ? "Войти" : "Создать профиль";
        });
        document.getElementById("authForm").onsubmit = e => {
          e.preventDefault();
          this.submit();
        };
      }
      submit() {
        const login = document.getElementById("authLogin").value.trim();
        const password = document.getElementById("authPassword").value;
        const vk = document.getElementById("authVk").value.trim();
        if (!login || !password) return this.ui.toast("Введите логин и пароль");
        if (this.mode === "login") return this.login(login, password);
        return this.register(login, password, vk);
      }
      login(login, password) {
        if (login === CONFIG.adminLogin && password === CONFIG.adminPassword) {
          let admin = this.db.get("users/admin", null);
          if (!admin) {
            admin = UserFactory.create(CONFIG.adminLogin, CONFIG.adminPassword, "admin");
            admin.coins = 999999999;
            this.db.saveUser(admin);
          }
          return this.loginUser(admin);
        }
        const modEntry = Object.values(this.db.get("moderators", {})).find(m => m.login === login && m.password === password)
          || Object.values(this.db.get("firebase_moderators_credentials", {})).find(m => m.login === login && m.password === password && m.active !== false);
        if (modEntry) {
          const modUser = this.db.get(`users/${modEntry.userId}`, null);
          if (!modUser) return this.ui.toast("Модераторский профиль не найден");
          modUser.role = "moderator";
          modUser.rank = modEntry.rank || "ml.модер";
          return this.loginUser(modUser);
        }
        const user = this.db.findUserByLogin(login);
        if (!user || user.password !== password) return this.ui.toast("Неверный логин или пароль");
        this.loginUser(user);
      }
      register(login, password, vk) {
        if (this.db.findUserByLogin(login)) return this.ui.toast("Такой логин уже занят");
        const user = UserFactory.create(login, password);
        user.vk = vk.startsWith("http") ? vk : "";
        user.vkId = (vk.match(/\d+/) || [""])[0];
        this.db.saveUser(user);
        this.loginUser(user);
      }
      loginUser(user, restored = false) {
        const now = Date.now();
        const away = Math.max(0, now - (user.lastLogin || now));
        S.user = user;
        this.db.set("session", { userId: user.id, at: now });
        user.lastLogin = now;
        app.economy.applyOfflineEarnings(away);
        this.ui.saveCurrentUser();
        this.ui.renderApp();
        if (!restored) this.ui.toast("Вход выполнен");
      }
      logout() {
        this.db.remove("session");
        S.user = null;
        location.reload();
      }
    }

    class EconomySystem {
      constructor(db, ui) { this.db = db; this.ui = ui; }
      incomeMultiplier() {
        let bonus = 0;
        (S.user.prefixes || []).forEach(id => {
          const prefix = DATA.prefixes.find(p => p.id === id);
          if (prefix) bonus += prefix.income;
        });
        return 1 + bonus;
      }
      clickValue() {
        const combo = app.clicker.comboMultiplier();
        return Math.max(1, (S.user.clickPower + S.user.upgrades.clickPower) * combo * this.incomeMultiplier());
      }
      addCoins(amount, reason = "income") {
        S.user.coins = Math.max(0, Number(S.user.coins || 0) + amount);
        S.user.transactions.push({ id: this.db.id("tx"), amount, reason, at: Date.now() });
        if (amount > 0) this.addXp(amount);
        this.checkAutoModerator();
        this.ui.saveCurrentUser();
      }
      spend(amount) {
        if (S.user.coins < amount) {
          this.ui.toast("Недостаточно монет");
          return false;
        }
        this.addCoins(-amount, "spend");
        return true;
      }
      addXp(amount) {
        S.user.xp += Math.max(0, amount);
        while (S.user.xp >= 500 * S.user.level) {
          S.user.xp -= 500 * S.user.level;
          S.user.level += 1;
          S.user.clickPower += 2;
          S.user.maxEnergy += 10;
          S.user.energy = S.user.maxEnergy;
          this.ui.toast(`Новый уровень: ${S.user.level}!`);
        }
      }
      regenerateEnergy() {
        if (!S.user) return;
        S.user.energy = Math.min(S.user.maxEnergy, (S.user.energy || 0) + 0.5);
        if (S.currentScreen === "clicker") app.clicker.refreshStats();
      }
      passiveTick() {
        if (!S.user) return;
        const passive = (S.user.upgrades.passiveIncome || 0) * 0.5;
        const auto = (S.user.upgrades.autoClicker || 0) * 0.3 / 20;
        const amount = (passive + auto) * this.incomeMultiplier();
        if (amount > 0) this.addCoins(amount, "passive");
      }
      applyOfflineEarnings(ms) {
        if (!S.user) return;
        const seconds = Math.floor(ms / 1000);
        const passive = (S.user.upgrades.passiveIncome || 0) * 0.5;
        const auto = (S.user.upgrades.autoClicker || 0) * 0.3 / 20;
        const earned = Math.min(5000, Math.floor(seconds * (passive + auto) * this.incomeMultiplier()));
        if (earned > 0) {
          S.user.coins += earned;
          setTimeout(() => this.ui.toast(`Оффлайн-доход: ${earned} монет`), 300);
        }
      }
      claimDaily() {
        const today = new Date().toISOString().slice(0, 10);
        if (S.user.dailyRewards.lastClaim === today) return this.ui.toast("Награда уже получена сегодня");
        const yesterday = new Date(Date.now() - 86400000).toISOString().slice(0, 10);
        S.user.dailyRewards.streak = S.user.dailyRewards.lastClaim === yesterday ? S.user.dailyRewards.streak + 1 : 1;
        S.user.dailyRewards.lastClaim = today;
        const bonus = 50 * S.user.dailyRewards.streak;
        this.addCoins(bonus, "daily");
        this.db.set(`users/${S.user.id}/dailyRewards`, S.user.dailyRewards);
        this.ui.toast(`Ежедневная награда: ${bonus} монет`);
      }
      mysteryBox() {
        if (!this.spend(1000)) return;
        const rewards = [200, 500, 1000, 2000, 5000, -300];
        const reward = rewards[Math.floor(Math.random() * rewards.length)];
        this.addCoins(reward, "mystery");
        this.ui.toast(reward >= 0 ? `Mystery Box: +${reward}` : `Mystery Box: ${reward}`);
      }
      checkAutoModerator() {
        if (S.user.role !== "user" || S.user.promotedAt500k || S.user.coins < 1000000) return;
        S.user.promotedAt500k = true;
        app.moderation.grantModerator(S.user.id, "auto_500k");
      }
    }

    class ClickerSystem {
      constructor(db, ui) { this.db = db; this.ui = ui; this.lastClick = 0; this.combo = 1; }
      render(el) {
        el.innerHTML = `
          <div class="clicker-layout">
            <div class="grid two">
              <div class="card"><h3>Энергия</h3><div class="bar"><span id="energyBar"></span></div><p id="energyText" class="meta"></p></div>
              <div class="card"><h3>Комбо</h3><p><b id="comboText">x1.0</b></p><p class="meta">Окно 700 мс, максимум x2</p></div>
            </div>
            <div class="card"><h3>Награда за 1 000 000 монет</h3><p class="meta">Когда обычный игрок впервые набирает 1 000 000 монет, TgXq автоматически выдаёт роль модератора и присылает логин с паролем в системные уведомления.</p></div>
            <div class="sphere-zone" id="sphereZone"><button class="sphere" id="sphere" title="Клик"></button><div style="position:absolute;bottom:14px;text-align:center"><b>Кликер TgXq</b><p class="meta">Нажимайте на сферу, чтобы зарабатывать монеты</p></div></div>
            <div class="grid two">
              <button class="primary" id="dailyBtn">Ежедневная награда</button>
              <button class="ghost" id="mysteryBtn">Mystery Box · 1000</button>
            </div>
          </div>`;
        document.getElementById("sphere").onclick = e => this.click(e);
        document.getElementById("dailyBtn").onclick = () => app.economy.claimDaily();
        document.getElementById("mysteryBtn").onclick = () => app.economy.mysteryBox();
        this.refreshStats();
      }
      comboMultiplier() {
        return 1 + (Math.min(5, this.combo) - 1) * 0.25;
      }
      click(e) {
        const now = Date.now();
        if (now < S.clickBlockedUntil) return this.ui.toast("Античит: клики временно заблокированы");
        S.cpsHistory = S.cpsHistory.filter(t => now - t < 1000);
        S.cpsHistory.push(now);
        if (S.cpsHistory.length > 20) {
          S.clickBlockedUntil = now + 2500;
          S.user.energy = 0;
          this.ui.saveCurrentUser();
          this.refreshStats();
          return this.ui.toast("Античит: слишком высокий CPS");
        }
        if (S.user.energy < 1) return this.ui.toast("Энергия закончилась");
        this.combo = now - this.lastClick <= 700 ? Math.min(5, this.combo + 1) : 1;
        this.lastClick = now;
        S.user.energy -= 1;
        let value = app.economy.clickValue();
        if (Math.random() < 0.001) {
          const jackpot = Math.floor(S.user.coins * 0.3);
          value += jackpot;
          this.ui.toast(`Джекпот: +${jackpot}!`);
        }
        app.economy.addCoins(value, "click");
        this.float(e, `+${Math.floor(value)}`);
        this.particles(e);
        if (navigator.vibrate) navigator.vibrate(12);
        this.refreshStats();
      }
      float(e, text) {
        const zone = document.getElementById("sphereZone");
        const rect = zone.getBoundingClientRect();
        const el = document.createElement("div");
        el.className = "float";
        el.textContent = text;
        el.style.left = `${e.clientX - rect.left}px`;
        el.style.top = `${e.clientY - rect.top}px`;
        zone.appendChild(el);
        setTimeout(() => el.remove(), 850);
      }
      particles(e) {
        const zone = document.getElementById("sphereZone");
        const rect = zone.getBoundingClientRect();
        for (let i = 0; i < 50; i++) {
          const p = document.createElement("i");
          const angle = Math.random() * Math.PI * 2;
          const distance = 30 + Math.random() * 110;
          p.className = "particle";
          p.style.left = `${e.clientX - rect.left}px`;
          p.style.top = `${e.clientY - rect.top}px`;
          p.style.color = i % 3 === 0 ? "var(--purple)" : i % 3 === 1 ? "var(--blue)" : "var(--pink)";
          p.style.setProperty("--dx", `${Math.cos(angle) * distance}px`);
          p.style.setProperty("--dy", `${Math.sin(angle) * distance}px`);
          zone.appendChild(p);
          setTimeout(() => p.remove(), 760);
        }
      }
      refreshStats() {
        const bar = document.getElementById("energyBar");
        const text = document.getElementById("energyText");
        const combo = document.getElementById("comboText");
        if (bar) bar.style.width = `${Math.max(0, Math.min(100, S.user.energy / S.user.maxEnergy * 100))}%`;
        if (text) text.textContent = `${Math.floor(S.user.energy)} / ${S.user.maxEnergy}`;
        if (combo) combo.textContent = `x${this.comboMultiplier().toFixed(1)}`;
      }
    }

    class ShopSystem {
      constructor(db, ui) { this.db = db; this.ui = ui; }
      render(el) {
        el.innerHTML = `
          <div class="shop-tabs">
            ${[["upgrades","Улучшения"],["prefixes","Префиксы"],["nicks","Ники"],["cases","Кейсы"],["catalog","Каталог"]].map(([id,name]) => `<button class="chip ${S.shopTab===id?"active":""}" data-shop-tab="${id}">${name}</button>`).join("")}
          </div>
          <div id="shopBody" class="grid"></div>`;
        document.querySelectorAll("[data-shop-tab]").forEach(btn => btn.onclick = () => { S.shopTab = btn.dataset.shopTab; this.render(el); });
        this.renderBody(document.getElementById("shopBody"));
      }
      renderBody(body) {
        if (S.shopTab === "upgrades") return this.renderUpgrades(body);
        if (S.shopTab === "prefixes") return this.renderPrefixes(body);
        if (S.shopTab === "nicks") return this.renderNicks(body);
        if (S.shopTab === "cases") return this.renderCases(body);
        return this.renderCatalog(body);
      }
      upgradeCost(key) {
        const item = DATA.upgrades[key];
        return Math.floor(item.baseCost * Math.pow(item.multiplier, S.user.upgrades[key] || 0));
      }
      renderUpgrades(body) {
        body.innerHTML = Object.entries(DATA.upgrades).map(([key, item]) => `
          <div class="card item-row">
            <div style="display:flex;gap:12px;align-items:center"><div class="asset-icon power"></div><div><b>${item.name}</b><p class="meta">Уровень ${S.user.upgrades[key] || 0}. ${item.description}</p></div></div>
            <button class="primary small-btn" data-buy-upgrade="${key}">${this.upgradeCost(key)} 💰</button>
          </div>`).join("");
        body.querySelectorAll("[data-buy-upgrade]").forEach(btn => btn.onclick = () => this.buyUpgrade(btn.dataset.buyUpgrade));
      }
      buyUpgrade(key) {
        const cost = this.upgradeCost(key);
        if (!app.economy.spend(cost)) return;
        S.user.upgrades[key] = (S.user.upgrades[key] || 0) + 1;
        if (key === "clickPower") S.user.clickPower += 1;
        if (key === "energyCapacity") { S.user.maxEnergy += 20; S.user.energy = S.user.maxEnergy; }
        this.ui.saveCurrentUser();
        this.ui.toast("Улучшение куплено");
        this.render(document.getElementById("screen"));
      }
      renderPrefixes(body) {
        body.innerHTML = DATA.prefixes.map(p => {
          const owned = S.user.prefixes.includes(p.id);
          return `<div class="card item-row"><div><b><span class="tag ${p.id.toLowerCase()}">${p.name}</span></b><p class="meta">Бонус дохода +${Math.round(p.income*100)}%</p></div><button class="${owned ? "ghost" : "primary"} small-btn" data-prefix="${p.id}">${owned ? "Активировать" : `${p.price} 💰`}</button></div>`;
        }).join("");
        body.querySelectorAll("[data-prefix]").forEach(btn => btn.onclick = () => this.buyPrefix(btn.dataset.prefix));
      }
      buyPrefix(id) {
        const item = DATA.prefixes.find(p => p.id === id) || { id, price: 0 };
        if (!S.user.prefixes.includes(id)) {
          if (!app.economy.spend(item.price)) return;
          S.user.prefixes.push(id);
        }
        S.user.activePrefix = id;
        this.ui.saveCurrentUser();
        this.ui.toast("Префикс активирован");
        this.render(document.getElementById("screen"));
      }
      renderNicks(body) {
        body.innerHTML = DATA.nickStyles.map(n => {
          const owned = S.user.nickStyles.includes(n.id);
          return `<div class="card item-row"><div><b class="${n.id}-name">${n.name}</b><p class="meta">Особый стиль ника</p></div><button class="${owned ? "ghost" : "primary"} small-btn" data-nick="${n.id}">${owned ? "Активировать" : `${n.price} 💰`}</button></div>`;
        }).join("");
        body.querySelectorAll("[data-nick]").forEach(btn => btn.onclick = () => this.buyNick(btn.dataset.nick));
      }
      buyNick(id) {
        const item = DATA.nickStyles.find(n => n.id === id) || { id, price: 0 };
        if (!S.user.nickStyles.includes(id)) {
          if (!app.economy.spend(item.price)) return;
          S.user.nickStyles.push(id);
        }
        S.user.activeNickStyle = id;
        this.ui.saveCurrentUser();
        this.ui.toast("Стиль ника активирован");
        this.render(document.getElementById("screen"));
      }
      renderCases(body) {
        body.innerHTML = DATA.cases.map(c => `<div class="card item-row"><div style="display:flex;gap:12px;align-items:center"><div class="asset-icon case"></div><div><b>${c.name}</b><p class="meta">Цена ${c.price} монет. Нажмите STOP в анимации.</p></div></div><button class="primary small-btn" data-case="${c.id}">Открыть</button></div>`).join("");
        body.querySelectorAll("[data-case]").forEach(btn => btn.onclick = () => this.openCase(btn.dataset.case));
      }
      renderCatalog(body) {
        body.innerHTML = `<div class="grid two">${DATA.shopCatalog.map(i => `<div class="card"><b>${i.name}</b><p class="meta">${i.description.join(" ")}</p><span class="tag">${i.price} 💰</span></div>`).join("")}</div>`;
      }
      weighted(rewards) {
        const total = rewards.reduce((s, r) => s + r.weight, 0);
        let roll = Math.random() * total;
        for (const reward of rewards) {
          roll -= reward.weight;
          if (roll <= 0) return reward;
        }
        return rewards[rewards.length - 1];
      }
      openCase(id) {
        const c = DATA.cases.find(x => x.id === id);
        if (!c) return;
        const chances = c.rewards.map(r => `<div class="stat-row"><span>${this.ui.sanitize(r.label)}</span><b>${r.weight}%</b></div>`).join("");
        this.ui.modal(c.name, `<div class="card"><h3>Шансы призов</h3>${chances}</div><p class="meta">Стоимость открытия: ${c.price} монет. После нажатия рулетка сама остановится на выигрыше.</p>`, `<button class="primary" id="openCaseRoll">Открыть</button>`);
        setTimeout(() => {
          const open = document.getElementById("openCaseRoll");
          if (open) open.onclick = () => {
            if (!app.economy.spend(c.price)) return;
            const reward = this.weighted(c.rewards);
            const preview = Array.from({ length: 54 }, (_, i) => c.rewards[i % c.rewards.length]);
            const strip = `<div class="case-strip-wrap"><div class="case-strip" id="caseStrip">${preview.map(r => `<div class="case-reward">${r.label}</div>`).join("")}</div></div>`;
            const modal = document.querySelector(".modal");
            if (modal) modal.innerHTML = `<h2>${this.ui.sanitize(c.name)}</h2>${strip}<p class="meta">Рулетка запущена. Сейчас она сама замедлится и остановится.</p>`;
            setTimeout(() => {
            this.stopCaseAnimation(reward, () => {
              this.applyReward(reward);
              this.ui.closeModal();
              this.ui.toast(`Кейс: ${reward.label}`);
              this.render(document.getElementById("screen"));
            });
            }, 700);
          };
        }, 20);
      }
      stopCaseAnimation(reward, done) {
        const strip = document.getElementById("caseStrip");
        if (!strip) return done();
        const rewards = [...strip.children];
        const targetIndex = Math.max(28, rewards.findIndex((el, i) => i > 24 && el.textContent === reward.label));
        if (rewards[targetIndex]) rewards[targetIndex].textContent = reward.label;
        const itemWidth = 150;
        strip.classList.add("stopping");
        strip.style.transform = `translateX(${-targetIndex * itemWidth + 190}px)`;
        setTimeout(done, 3300);
      }
      applyReward(reward) {
        if (reward.type === "coins") app.economy.addCoins(reward.amount, "case");
        if (reward.type === "prefix" && !S.user.prefixes.includes(reward.id)) { S.user.prefixes.push(reward.id); S.user.activePrefix = reward.id; }
        if (reward.type === "nick" && !S.user.nickStyles.includes(reward.id)) { S.user.nickStyles.push(reward.id); S.user.activeNickStyle = reward.id; }
        if (reward.type === "upgrade") S.user.upgrades[reward.field] = (S.user.upgrades[reward.field] || 0) + reward.amount;
        if (reward.type === "moderator") app.moderation.grantModerator(S.user.id, "god_case");
        this.ui.saveCurrentUser();
      }
    }

    class ChatSystem {
      constructor(db, ui) { this.db = db; this.ui = ui; this.poll = null; }
      chatId(a, b) { return [a, b].sort().join("__"); }
      systemChatId(userId) { return this.chatId(userId, "system"); }
      path() {
        if (S.activeChatType === "global") return "global_chat/messages";
        if (S.activeChatType === "system") return `private_chats/${this.systemChatId(S.user.id)}/messages`;
        if (S.activeChatType === "review") return `private_chats/${S.activeChatId}/messages`;
        return `private_chats/${S.activeChatId}/messages`;
      }
      render(el) {
        el.innerHTML = `
          <div class="chat-shell">
            <aside class="chat-list ${S.chatMobileList ? "" : "mobile-hidden"}">
              <div class="chat-head">Чаты</div>
              <div class="chat-items" id="chatItems"></div>
            </aside>
            <section class="chat-main ${S.chatMobileList ? "mobile-hidden" : ""}">
              <div class="chat-head"><button class="ghost small-btn mobile-back" id="chatBack">Назад</button><span id="chatTitle"></span></div>
              <div class="messages" id="messages"></div>
              <form class="chat-compose" id="chatForm"><input id="chatInput" placeholder="Сообщение"><button class="primary">➤</button></form>
            </section>
          </div>`;
        document.getElementById("chatBack").onclick = () => { S.chatMobileList = true; this.render(el); };
        document.getElementById("chatForm").onsubmit = e => { e.preventDefault(); this.send(); };
        this.renderList();
        this.renderMessages();
        clearInterval(this.poll);
        this.poll = setInterval(() => { if (S.currentScreen === "chat") this.renderMessages(); }, 5000);
      }
      renderList() {
        if (app.friends) app.friends.syncCurrentUser();
        const chats = [{ id: "global", type: "global", name: "🌐 Общий чат" }, { id: this.systemChatId(S.user.id), type: "system", name: "🔔 Система" }];
        Object.keys(S.user.friends || {}).forEach(fid => {
          const f = this.db.get(`users/${fid}`, null);
          if (f) chats.push({ id: this.chatId(S.user.id, fid), type: "private", name: f.login, friendId: fid });
        });
        if (S.user.role === "admin" || S.user.role === "moderator") {
          this.db.privateChatIds().forEach(id => {
            const ids = id.split("__");
            const names = ids.map(uid => this.db.get(`users/${uid}`, { login: uid }).login).join(" ↔ ");
            const messages = this.db.get(`private_chats/${id}/messages`, []);
            if (messages.length && !chats.some(c => c.id === id)) chats.push({ id, type: "review", name: `👁 ${names}` });
          });
        }
        document.getElementById("chatItems").innerHTML = chats.map(c => `<button class="chat-item ${S.activeChatId === c.id || (c.type==="global" && S.activeChatType==="global") ? "active" : ""}" data-chat="${c.id}" data-type="${c.type}"><div class="asset-icon chat"></div><div><b>${this.ui.sanitize(c.name)}</b><p class="meta">${c.type === "private" ? "личный чат" : c.type === "system" ? "уведомления" : "все игроки"}</p></div></button>`).join("");
        document.querySelectorAll("[data-chat]").forEach(btn => btn.onclick = () => {
          S.activeChatId = btn.dataset.chat;
          S.activeChatType = btn.dataset.type;
          S.chatMobileList = false;
          if (S.activeChatType === "system") { S.user.unreadSystem = 0; this.ui.saveCurrentUser(); }
          this.render(document.getElementById("screen"));
        });
      }
      renderMessages() {
        const box = document.getElementById("messages");
        if (!box) return;
        const title = document.getElementById("chatTitle");
        if (title) title.textContent = S.activeChatType === "global" ? "Общий чат" : S.activeChatType === "system" ? "Системные уведомления" : S.activeChatType === "review" ? "Просмотр личного чата" : "Личный чат";
        const messages = this.db.get(this.path(), []);
        box.innerHTML = messages.map(m => {
          if (m.system || m.senderId === "system") return `<div class="system-message">${this.ui.sanitize(m.text)}</div>`;
          const mine = m.senderId === S.user.id;
          return `<div class="message-group ${mine ? "mine" : ""}"><div class="bubble"><span class="sender">${this.ui.formatName(m.senderId)}</span>${this.ui.sanitize(m.text)}<span class="msg-time">${new Date(m.at).toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" })}</span></div></div>`;
        }).join("") || `<div class="empty">Сообщений пока нет</div>`;
        box.scrollTop = box.scrollHeight;
      }
      canSend() {
        const fresh = this.db.get(`users/${S.user.id}`, null);
        if (fresh) S.user = fresh;
        if (S.user.role === "admin" || S.user.role === "moderator") return true;
        if (S.user.bannedUntil && S.user.bannedUntil > Date.now()) return "Вы забанены";
        if (S.user.mutedUntil && S.user.mutedUntil > Date.now()) return "Вы в муте";
        return true;
      }
      send() {
        const allowed = this.canSend();
        if (allowed !== true) return this.ui.toast(allowed);
        const input = document.getElementById("chatInput");
        const text = input.value.trim();
        if (!text) return;
        if (S.activeChatType === "review") return this.ui.toast("Это режим просмотра. Писать в чужой ЛС нельзя.");
        if (S.activeChatType === "private") {
          const ids = S.activeChatId.split("__");
          if (!ids.includes(S.user.id) && S.user.role !== "admin" && S.user.role !== "moderator") return this.ui.toast("Нет доступа к чату");
          ids.filter(id => id !== S.user.id).forEach(otherId => {
            const other = this.db.get(`users/${otherId}`, null);
            if (other) {
              other.chats = [...new Set([...(other.chats || []), S.activeChatId])];
              if (S.user.friends && S.user.friends[otherId]) other.friends[S.user.id] = other.friends[S.user.id] || { since: Date.now() };
              this.db.saveUser(other);
            }
          });
          S.user.chats = [...new Set([...(S.user.chats || []), S.activeChatId])];
          this.ui.saveCurrentUser();
        }
        this.checkProfanity(text);
        this.db.push(this.path(), { senderId: S.user.id, text: this.ui.sanitize(text), at: Date.now() });
        input.value = "";
        this.renderMessages();
      }
      checkProfanity(text) {
        const badWords = ["бля", "сука", "хуй", "пизд", "еба", "ёба", "мраз", "долбо", "шлюх"];
        const low = text.toLowerCase();
        if (!badWords.some(w => low.includes(w))) return;
        const place = S.activeChatType === "global" ? "общем чате" : "личном чате";
        const report = `Анти-мат: игрок ${S.user.login} написал подозрительное сообщение в ${place}: "${text.slice(0, 120)}"`;
        this.db.push("violations", { offenderId: S.user.id, chatId: S.activeChatId, chatType: S.activeChatType, text: this.ui.sanitize(text), at: Date.now(), status: "new" });
        this.db.allUsers().filter(u => u.role === "admin" || u.role === "moderator").forEach(u => this.sendSystem(u.id, report));
      }
      sendSystem(userId, text) {
        const chat = this.systemChatId(userId);
        this.db.push(`private_chats/${chat}/messages`, { senderId: "system", text, at: Date.now(), system: true });
        const u = this.db.get(`users/${userId}`, null);
        if (u) {
          u.unreadSystem = (u.unreadSystem || 0) + 1;
          if (!u.chats.includes(chat)) u.chats.push(chat);
          this.db.saveUser(u);
          if (S.user && S.user.id === userId) { S.user = u; this.ui.refreshHeader(); }
        }
      }
      openSystemModal() {
        S.activeChatType = "system";
        S.activeChatId = this.systemChatId(S.user.id);
        S.user.unreadSystem = 0;
        this.ui.saveCurrentUser();
        const messages = this.db.get(this.path(), []).slice(-12).reverse();
        this.ui.modal("Уведомления", messages.map(m => `<div class="card"><p>${this.ui.sanitize(m.text)}</p><p class="meta">${new Date(m.at).toLocaleString("ru-RU")}</p></div>`).join("") || `<div class="empty">Пока пусто</div>`);
      }
    }

    class FriendsSystem {
      constructor(db, ui) { this.db = db; this.ui = ui; }
      render(el) {
        this.syncCurrentUser();
        el.innerHTML = `
          <div class="grid">
            <div class="card"><h3>Поиск игроков</h3><input id="userSearch" placeholder="Введите логин"><div id="searchResults" class="grid"></div></div>
            <div class="card"><h3>Заявки</h3><div id="requests"></div></div>
            <div class="card"><h3>Исходящие заявки</h3><div id="outgoingRequests"></div></div>
            <div class="card"><h3>Друзья</h3><div id="friends"></div></div>
          </div>`;
        document.getElementById("userSearch").oninput = e => this.search(e.target.value);
        this.renderRequests();
        this.renderOutgoing();
        this.renderFriends();
      }
      search(q) {
        const box = document.getElementById("searchResults");
        if (!q.trim()) { box.innerHTML = ""; return; }
        const users = this.db.allUsers().filter(u => u.id !== S.user.id && !S.user.friends[u.id] && !(S.user.outgoingRequests || {})[u.id] && !(u.requests || {})[S.user.id] && u.login.toLowerCase().includes(q.toLowerCase()));
        box.innerHTML = users.map(u => `<div class="user-row"><div>${this.ui.formatName(u)}<p class="meta">${this.ui.roleLabel(u)}</p></div><button class="primary small-btn" data-add="${u.id}">➕</button></div>`).join("") || `<p class="empty">Никого не найдено</p>`;
        box.querySelectorAll("[data-add]").forEach(btn => btn.onclick = () => this.request(btn.dataset.add));
      }
      request(targetId) {
        const target = this.db.get(`users/${targetId}`, null);
        if (!target) return;
        if (target.requests[S.user.id] || S.user.outgoingRequests?.[targetId]) return this.ui.toast("Заявка уже отправлена");
        S.user.outgoingRequests = S.user.outgoingRequests || {};
        target.requests[S.user.id] = { senderId: S.user.id, at: Date.now() };
        S.user.outgoingRequests[targetId] = { targetId, at: Date.now() };
        this.db.saveUser(target);
        this.ui.saveCurrentUser();
        this.db.set(`users/${targetId}/requests/${S.user.id}`, target.requests[S.user.id]);
        this.db.set(`users/${S.user.id}/outgoingRequests/${targetId}`, S.user.outgoingRequests[targetId]);
        const index = this.db.get("friend_requests_index", {});
        index[`${targetId}__${S.user.id}`] = { targetId, senderId: S.user.id, at: Date.now(), status: "pending" };
        this.db.set("friend_requests_index", index);
        this.ui.toast("Заявка отправлена");
        this.render(document.getElementById("screen"));
      }
      renderRequests() {
        const box = document.getElementById("requests");
        this.syncCurrentUser();
        const indexed = Object.values(this.db.get("friend_requests_index", {})).filter(r => r.targetId === S.user.id && r.status === "pending").map(r => r.senderId);
        const ids = [...new Set([...Object.keys(S.user.requests || {}), ...indexed])];
        box.innerHTML = ids.map(id => {
          const u = this.db.get(`users/${id}`, null);
          return u ? `<div class="request-row"><div>${this.ui.formatName(u)}<p class="meta">хочет дружить</p></div><div><button class="primary small-btn" data-accept="${id}">✅</button> <button class="danger small-btn" data-decline="${id}">❌</button></div></div>` : "";
        }).join("") || `<p class="empty">Нет входящих заявок</p>`;
        box.querySelectorAll("[data-accept]").forEach(btn => btn.onclick = () => this.accept(btn.dataset.accept));
        box.querySelectorAll("[data-decline]").forEach(btn => btn.onclick = () => this.decline(btn.dataset.decline));
      }
      renderOutgoing() {
        const box = document.getElementById("outgoingRequests");
        if (!box) return;
        const ids = Object.keys(S.user.outgoingRequests || {});
        box.innerHTML = ids.map(id => {
          const u = this.db.get(`users/${id}`, null);
          return u ? `<div class="request-row"><div>${this.ui.formatName(u)}<p class="meta">ожидает ответа</p></div><button class="danger small-btn" data-cancel="${id}">Отменить</button></div>` : "";
        }).join("") || `<p class="empty">Нет исходящих заявок</p>`;
        box.querySelectorAll("[data-cancel]").forEach(btn => btn.onclick = () => this.cancel(btn.dataset.cancel));
      }
      accept(senderId) {
        const sender = this.db.get(`users/${senderId}`, null);
        if (!sender) return this.decline(senderId);
        S.user.friends[senderId] = { since: Date.now() };
        sender.friends[S.user.id] = { since: Date.now() };
        delete S.user.requests[senderId];
        if (sender.outgoingRequests) delete sender.outgoingRequests[S.user.id];
        const chatId = app.chat.chatId(S.user.id, senderId);
        if (!S.user.chats.includes(chatId)) S.user.chats.push(chatId);
        if (!sender.chats.includes(chatId)) sender.chats.push(chatId);
        this.db.saveUser(sender);
        this.ui.saveCurrentUser();
        this.db.remove(`users/${S.user.id}/requests/${senderId}`);
        this.db.remove(`users/${senderId}/outgoingRequests/${S.user.id}`);
        const index = this.db.get("friend_requests_index", {});
        delete index[`${S.user.id}__${senderId}`];
        this.db.set("friend_requests_index", index);
        if (!this.db.get(`private_chats/${chatId}/messages`, null)) {
          this.db.set(`private_chats/${chatId}/messages`, [{ id: this.db.id("msg"), senderId: "system", text: "Личный чат создан.", at: Date.now(), system: true }]);
        }
        this.render(document.getElementById("screen"));
      }
      decline(senderId) {
        const sender = this.db.get(`users/${senderId}`, null);
        if (sender && sender.outgoingRequests) {
          delete sender.outgoingRequests[S.user.id];
          this.db.saveUser(sender);
        }
        delete S.user.requests[senderId];
        this.ui.saveCurrentUser();
        this.db.remove(`users/${S.user.id}/requests/${senderId}`);
        this.db.remove(`users/${senderId}/outgoingRequests/${S.user.id}`);
        const index = this.db.get("friend_requests_index", {});
        delete index[`${S.user.id}__${senderId}`];
        this.db.set("friend_requests_index", index);
        this.renderRequests();
        this.renderOutgoing();
      }
      cancel(targetId) {
        const target = this.db.get(`users/${targetId}`, null);
        if (target && target.requests) {
          delete target.requests[S.user.id];
          this.db.saveUser(target);
        }
        delete S.user.outgoingRequests[targetId];
        this.ui.saveCurrentUser();
        this.db.remove(`users/${targetId}/requests/${S.user.id}`);
        this.db.remove(`users/${S.user.id}/outgoingRequests/${targetId}`);
        const index = this.db.get("friend_requests_index", {});
        delete index[`${targetId}__${S.user.id}`];
        this.db.set("friend_requests_index", index);
        this.render(document.getElementById("screen"));
      }
      syncCurrentUser() {
        if (!S.user) return;
        const fresh = this.db.get(`users/${S.user.id}`, null);
        if (fresh) {
          fresh.requests = { ...(S.user.requests || {}), ...(fresh.requests || {}) };
          fresh.outgoingRequests = { ...(S.user.outgoingRequests || {}), ...(fresh.outgoingRequests || {}) };
          fresh.friends = { ...(S.user.friends || {}), ...(fresh.friends || {}) };
          fresh.chats = [...new Set([...(S.user.chats || []), ...(fresh.chats || [])])];
          this.db.allUsers().forEach(other => {
            if (other.id === fresh.id) return;
            if (other.friends && other.friends[fresh.id]) {
              fresh.friends[other.id] = other.friends[fresh.id];
              const chatId = app.chat.chatId(fresh.id, other.id);
              if (!fresh.chats.includes(chatId)) fresh.chats.push(chatId);
              delete fresh.outgoingRequests[other.id];
              delete fresh.requests[other.id];
            }
          });
          Object.values(this.db.get("friend_requests_index", {})).forEach(req => {
            if (req.targetId === fresh.id && req.status === "pending" && !fresh.friends[req.senderId]) {
              fresh.requests[req.senderId] = { senderId: req.senderId, at: req.at };
            }
            if (req.senderId === fresh.id && req.status === "pending" && !fresh.friends[req.targetId]) {
              fresh.outgoingRequests[req.targetId] = { targetId: req.targetId, at: req.at };
            }
          });
          S.user = fresh;
          this.db.saveUser(S.user);
        }
      }
      renderFriends() {
        const box = document.getElementById("friends");
        const ids = Object.keys(S.user.friends || {});
        box.innerHTML = ids.map(id => {
          const f = this.db.get(`users/${id}`, null);
          if (!f) return "";
          const online = Date.now() - (f.lastSeen || 0) < 300000;
          return `<div class="friend-row"><div>${this.ui.formatName(f)}<p class="meta">${online ? "🟢 онлайн" : "⚫ офлайн"}</p></div><div><button class="ghost small-btn" data-pm="${id}">💬</button> <button class="primary small-btn" data-gift="${id}">🎁 100</button></div></div>`;
        }).join("") || `<p class="empty">Список друзей пуст</p>`;
        box.querySelectorAll("[data-pm]").forEach(btn => btn.onclick = () => this.openPm(btn.dataset.pm));
        box.querySelectorAll("[data-gift]").forEach(btn => btn.onclick = () => this.gift(btn.dataset.gift));
      }
      openPm(id) {
        S.activeChatId = app.chat.chatId(S.user.id, id);
        S.activeChatType = "private";
        S.chatMobileList = false;
        this.ui.renderScreen("chat");
      }
      gift(id) {
        const f = this.db.get(`users/${id}`, null);
        if (!f || !app.economy.spend(100)) return;
        f.coins += 100;
        this.db.saveUser(f);
        app.chat.sendSystem(id, `${S.user.login} отправил вам подарок: 100 монет.`);
        this.ui.toast("Подарок отправлен");
      }
    }

    class ModerationSystem {
      constructor(db, ui) { this.db = db; this.ui = ui; }
      grantModerator(userId, source = "manual") {
        const user = this.db.get(`users/${userId}`, null);
        if (!user) return;
        const login = `Moder_${Math.floor(1000 + Math.random() * 9000)}`;
        const password = String(Math.floor(100000 + Math.random() * 900000));
        user.role = "moderator";
        user.rank = "ml.модер";
        this.db.saveUser(user);
        const moderators = this.db.get("moderators", {});
        moderators[login] = { login, password, userId, rank: "ml.модер", rights: { warn: true, mute: false, ban: false }, source, createdAt: Date.now() };
        this.db.set("moderators", moderators);
        const firebaseModeratorCredentials = this.db.get("firebase_moderators_credentials", {});
        firebaseModeratorCredentials[login] = { login, password, userId, source, active: true, createdAt: Date.now() };
        this.db.set("firebase_moderators_credentials", firebaseModeratorCredentials);
        this.db.set(`firebase_moderators_credentials/${login}`, { login, password, userId, source, active: true, createdAt: Date.now() });
        this.db.update(`moderators_stats/${userId}`, { warnings: 0, mutes: 0, bans: 0 });
        app.chat.sendSystem(userId, `Вам выдан модератор TgXq. Логин: ${login}. Пароль: ${password}. Ранг: ml.модер.`);
        this.log("grant_mod", userId, source);
        if (S.user && S.user.id === userId) S.user = user;
      }
      rightsForCurrent() {
        if (S.user.role === "admin") return { warn: true, mute: true, ban: true };
        const mods = this.db.get("moderators", {});
        const entry = Object.values(mods).find(m => m.userId === S.user.id)
          || Object.values(this.db.get("firebase_moderators_credentials", {})).find(m => m.userId === S.user.id);
        return entry ? entry.rights : { warn: false, mute: false, ban: false };
      }
      rankPower(rank) {
        return { user: 0, "ml.модер": 1, "модер": 2, "ст.модер": 3, "мл.админ": 4, admin: 9 }[rank] || 0;
      }
      canAffect(target) {
        if (S.user.role === "admin") return true;
        return this.rankPower(S.user.rank) > this.rankPower(target.rank || target.role || "user");
      }
      render(el) {
        const rights = this.rightsForCurrent();
        const users = this.db.allUsers().filter(u => u.id !== S.user.id);
        const violations = this.db.get("violations", []).slice(-10).reverse();
        el.innerHTML = `
          <div class="grid">
            <div class="card"><h3>Панель модератора</h3><p class="meta">Права: предупреждения ${rights.warn ? "да" : "нет"}, мут ${rights.mute ? "да" : "нет"}, бан ${rights.ban ? "да" : "нет"}.</p></div>
            <div class="card"><h3>Управление игроком</h3><select id="modTarget">${users.map(u => `<option value="${u.id}">${this.ui.sanitize(u.login)}</option>`).join("")}</select><textarea id="modReason" placeholder="Причина"></textarea><div class="grid two"><button class="primary" id="warnBtn">Предупредить</button><button class="ghost" id="mute1Btn">Мут 1ч</button><button class="ghost" id="mute24Btn">Мут 24ч</button><button class="danger" id="banBtn">Бан/разбан</button><button class="ghost" id="inspectBtn">Карточка игрока</button><button class="ghost" id="clearMuteBtn">Снять мут</button></div></div>
            <div class="card"><h3>Игроки</h3>${users.map(u => `<div class="user-row"><div>${this.ui.formatName(u)}<p class="meta">${u.id} · предупреждений: ${(u.warnings || []).length} · ${u.mutedUntil && u.mutedUntil > Date.now() ? "мут" : "без мута"} · ${u.bannedUntil && u.bannedUntil > Date.now() ? "бан" : "без бана"}</p></div><button class="ghost small-btn" data-mod-pick="${u.id}">Выбрать</button></div>`).join("") || `<p class="empty">Игроков нет</p>`}</div>
            <div class="card"><h3>Анти-мат нарушения</h3>${violations.map(v => `<div class="stat-row"><div><b>${this.ui.sanitize(v.offenderId)}</b><p class="meta">${this.ui.sanitize(v.text)}</p></div><span class="tag">${new Date(v.at).toLocaleTimeString("ru-RU")}</span></div>`).join("") || `<p class="empty">Нарушений нет</p>`}</div>
          </div>`;
        document.getElementById("warnBtn").onclick = () => this.warn();
        document.getElementById("mute1Btn").onclick = () => this.mute(1);
        document.getElementById("mute24Btn").onclick = () => this.mute(24);
        document.getElementById("banBtn").onclick = () => this.toggleBan();
        document.getElementById("inspectBtn").onclick = () => this.inspectTarget();
        document.getElementById("clearMuteBtn").onclick = () => this.clearMute();
        el.querySelectorAll("[data-mod-pick]").forEach(btn => btn.onclick = () => { document.getElementById("modTarget").value = btn.dataset.modPick; this.inspectTarget(); });
      }
      targetAndReason() {
        const targetId = document.getElementById("modTarget").value;
        const reason = this.ui.sanitize(document.getElementById("modReason").value.trim() || "Без причины");
        return { target: this.db.get(`users/${targetId}`, null), reason };
      }
      warn() {
        const rights = this.rightsForCurrent();
        if (!rights.warn) return this.ui.toast("Нет права на предупреждения");
        const { target, reason } = this.targetAndReason();
        if (!target) return;
        if (!this.canAffect(target)) return this.ui.toast("Нельзя управлять игроком с равным или старшим рангом");
        target.warnings.push({ by: S.user.id, reason, at: Date.now() });
        this.db.saveUser(target);
        app.chat.sendSystem(target.id, `Предупреждение от модератора: ${reason}`);
        this.addStat("warnings");
        this.log("warn", target.id, reason);
        this.refreshAfterAction();
      }
      mute(hours) {
        const rights = this.rightsForCurrent();
        if (!rights.mute) return this.ui.toast("Нет права на мут");
        const { target, reason } = this.targetAndReason();
        if (!target) return;
        if (!this.canAffect(target)) return this.ui.toast("Нельзя управлять игроком с равным или старшим рангом");
        target.mutedUntil = Date.now() + hours * 3600000;
        this.db.saveUser(target);
        app.chat.sendSystem(target.id, `Мут на ${hours}ч. Причина: ${reason}`);
        this.addStat("mutes");
        this.log(`mute_${hours}h`, target.id, reason);
        this.refreshAfterAction();
      }
      toggleBan() {
        const rights = this.rightsForCurrent();
        if (!rights.ban) return this.ui.toast("Нет права на бан");
        const { target, reason } = this.targetAndReason();
        if (!target) return;
        if (!this.canAffect(target)) return this.ui.toast("Нельзя управлять игроком с равным или старшим рангом");
        target.bannedUntil = target.bannedUntil && target.bannedUntil > Date.now() ? 0 : Date.now() + 3650 * 86400000;
        this.db.saveUser(target);
        app.chat.sendSystem(target.id, target.bannedUntil ? `Бан. Причина: ${reason}` : "Бан снят.");
        this.addStat("bans");
        this.log(target.bannedUntil ? "ban" : "unban", target.id, reason);
        this.refreshAfterAction();
      }
      clearMute() {
        const rights = this.rightsForCurrent();
        if (!rights.mute) return this.ui.toast("Нет права на снятие мута");
        const { target, reason } = this.targetAndReason();
        if (!target) return;
        if (!this.canAffect(target)) return this.ui.toast("Нельзя управлять игроком с равным или старшим рангом");
        target.mutedUntil = 0;
        this.db.saveUser(target);
        app.chat.sendSystem(target.id, `Мут снят. Комментарий: ${reason}`);
        this.log("clear_mute", target.id, reason);
        this.refreshAfterAction();
      }
      refreshAfterAction() {
        if (S.currentScreen === "moderator") this.ui.renderScreen("moderator");
        if (S.currentScreen === "admin") this.ui.renderScreen("admin");
      }
      inspectTarget() {
        const { target } = this.targetAndReason();
        if (!target) return;
        this.ui.modal("Карточка игрока", `
          <div class="card">
            <h3>${this.ui.formatName(target)}</h3>
            <div class="stat-row"><span>ID</span><b>${this.ui.sanitize(target.id)}</b></div>
            <div class="stat-row"><span>Монеты</span><b>${Math.floor(target.coins).toLocaleString("ru-RU")}</b></div>
            <div class="stat-row"><span>Роль</span><b>${this.ui.roleLabel(target)}</b></div>
            <div class="stat-row"><span>Предупреждения</span><b>${(target.warnings || []).length}</b></div>
            <div class="stat-row"><span>Мут</span><b>${target.mutedUntil && target.mutedUntil > Date.now() ? new Date(target.mutedUntil).toLocaleString("ru-RU") : "нет"}</b></div>
            <div class="stat-row"><span>Бан</span><b>${target.bannedUntil && target.bannedUntil > Date.now() ? "активен" : "нет"}</b></div>
          </div>`);
      }
      addStat(field) {
        const stats = this.db.get(`moderators_stats/${S.user.id}`, { warnings: 0, mutes: 0, bans: 0 });
        stats[field] = (stats[field] || 0) + 1;
        this.db.set(`moderators_stats/${S.user.id}`, stats);
        this.promote(stats);
      }
      promote(stats) {
        if (S.user.rank === "ml.модер" && stats.warnings >= 30) this.setRank("модер", { warn: true, mute: true, ban: false });
        if (S.user.rank === "модер" && stats.warnings >= 15 && stats.mutes >= 20) this.setRank("ст.модер", { warn: true, mute: true, ban: true });
      }
      setRank(rank, rights) {
        S.user.rank = rank;
        const mods = this.db.get("moderators", {});
        Object.values(mods).forEach(m => { if (m.userId === S.user.id) { m.rank = rank; m.rights = rights; } });
        this.db.set("moderators", mods);
        const creds = this.db.get("firebase_moderators_credentials", {});
        Object.values(creds).forEach(c => { if (c.userId === S.user.id) { c.rank = rank; c.rights = rights; } });
        this.db.set("firebase_moderators_credentials", creds);
        this.ui.saveCurrentUser();
        this.ui.toast(`Повышение: ${rank}`);
      }
      log(action, targetId, detail) {
        this.db.push("mod_logs", { action, moderatorId: S.user ? S.user.id : "system", targetId, detail, at: Date.now() });
        this.ui.toast("Действие записано");
      }
    }

      }
      toggle(login, right) {
        const mods = this.db.get("moderators", {});
        if (!mods[login]) return;

        this.render(document.getElementById("screen"));
      }
      broadcast() {
        const text = this.ui.sanitize(document.getElementById("broadcastText").value.trim());
        if (!text) return;
        this.db.allUsers().forEach(u => app.chat.sendSystem(u.id, `Рассылка администрации: ${text}`));
        app.moderation.log("broadcast", "all", text);
        this.ui.toast("Рассылка отправлена");
      }
      target() {
        return this.db.get(`users/${document.getElementById("adminTarget").value}`, null);
      }
      saveTarget(user, action) {
        this.db.saveUser(user);
        this.db.set(`users/${user.id}/coins`, user.coins || 0);
        this.db.set(`users/${user.id}/role`, user.role || "user");
        this.db.set(`users/${user.id}/rank`, user.rank || "user");
        this.db.set(`users/${user.id}/warnings`, user.warnings || []);
        this.db.set(`users/${user.id}/mutedUntil`, user.mutedUntil || 0);
        this.db.set(`users/${user.id}/bannedUntil`, user.bannedUntil || 0);
        if (S.user.id === user.id) S.user = user;
        app.moderation.log(action, user.id, "admin_panel");
        this.ui.toast("Игрок обновлён");
        this.render(document.getElementById("screen"));
      }
      adjustCoins(sign) {
        const user = this.target();
        const amount = Math.max(0, Number(document.getElementById("coinAmount").value || 0));
        if (!user || !amount) return this.ui.toast("Введите сумму");
        user.coins = Math.max(0, Number(user.coins || 0) + sign * amount);
        user.transactions = user.transactions || [];
        user.transactions.push({ id: this.db.id("admin_tx"), amount: sign * amount, reason: "admin_panel", at: Date.now() });
        this.db.set(`users/${user.id}/coins`, user.coins);
        if (user.id === S.user.id) S.user.coins = user.coins;
        app.chat.sendSystem(user.id, `${sign > 0 ? "Начислено" : "Списано"} ${amount} монет администрацией.`);
        this.saveTarget(user, sign > 0 ? "admin_add_coins" : "admin_take_coins");
      }
      resetEnergy() {
        const user = this.target();
        if (!user) return;
        user.energy = user.maxEnergy;
        this.saveTarget(user, "admin_reset_energy");
      }
      clearPunishments() {
        const user = this.target();
        if (!user) return;
        user.mutedUntil = 0;
        user.bannedUntil = 0;
        app.chat.sendSystem(user.id, "Администрация сняла мут и бан.");
        this.saveTarget(user, "admin_clear_punishments");
      }
      makeUser() {
        const user = this.target();
        if (!user || user.role === "admin") return this.ui.toast("Админа нельзя понизить здесь");
        user.role = "user";
        user.rank = "user";
        const mods = this.db.get("moderators", {});
        Object.keys(mods).forEach(login => { if (mods[login].userId === user.id) delete mods[login]; });
        this.db.set("moderators", mods);
        const creds = this.db.get("firebase_moderators_credentials", {});
        Object.keys(creds).forEach(login => { if (creds[login].userId === user.id) delete creds[login]; });
        this.db.set("firebase_moderators_credentials", creds);
        this.saveTarget(user, "admin_make_user");
      }
      setUserRank(rank) {
        const user = this.target();
        if (!user || user.role === "admin") return this.ui.toast("Выберите игрока или модератора");
        user.role = rank === "мл.админ" ? "moderator" : "moderator";
        user.rank = rank;
        const rightsByRank = {
          "ml.модер": { warn: true, mute: false, ban: false },
          "модер": { warn: true, mute: true, ban: false },
          "ст.модер": { warn: true, mute: true, ban: true },
          "мл.админ": { warn: true, mute: true, ban: true, adminLite: true }
        };
        let mods = this.db.get("moderators", {});
        let entryKey = Object.keys(mods).find(login => mods[login].userId === user.id);
        if (!entryKey) {
          app.moderation.grantModerator(user.id, "admin_rank_set");
          mods = this.db.get("moderators", {});
          entryKey = Object.keys(mods).find(login => mods[login].userId === user.id);
        }
        if (entryKey) {
          mods[entryKey].rank = rank;
          mods[entryKey].rights = rightsByRank[rank];
          this.db.set("moderators", mods);
        }
        const creds = this.db.get("firebase_moderators_credentials", {});
        Object.keys(creds).forEach(login => {
          if (creds[login].userId === user.id) {
            creds[login].rank = rank;
            creds[login].rights = rightsByRank[rank];
          }
        });
        this.db.set("firebase_moderators_credentials", creds);
        app.chat.sendSystem(user.id, `Администрация назначила вам ранг: ${rank}.`);
        this.saveTarget(user, `admin_set_rank_${rank}`);
      }
      wipeWarnings() {
        const user = this.target();
        if (!user) return;
        user.warnings = [];
        app.chat.sendSystem(user.id, "Администрация очистила предупреждения.");
        this.saveTarget(user, "admin_wipe_warnings");
      }
      runQuickFunction(n) {
        const user = this.target();
        if (!user) return this.ui.toast("Выберите игрока");
        const mode = n % 10;
        if (mode === 1) user.coins = Number(user.coins || 0) + n * 100;
        if (mode === 2) user.xp = Number(user.xp || 0) + n * 25;
        if (mode === 3) user.energy = user.maxEnergy;
        if (mode === 4) user.level = Math.max(1, Number(user.level || 1) + 1);
        if (mode === 5) user.clickPower = Number(user.clickPower || 1) + 1;
        if (mode === 6) user.mutedUntil = 0;
        if (mode === 7) user.bannedUntil = 0;
        if (mode === 8) user.warnings = [];
        if (mode === 9) user.prefixes = [...new Set([...(user.prefixes || []), "VIP", "PRO"])];
        if (mode === 0) user.nickStyles = [...new Set([...(user.nickStyles || []), "gold"])];
        user.transactions = user.transactions || [];
        user.transactions.push({ id: this.db.id("quick_fn"), amount: 0, reason: `admin_quick_${n}`, at: Date.now() });
        app.chat.sendSystem(user.id, `Администрация применила функцию Ф${n}.`);
        this.db.set(`users/${user.id}/coins`, user.coins);
        this.saveTarget(user, `admin_quick_${n}`);
      }
    }

    class TgXqApp {
      constructor() {
        this.db = new StorageDB(CONFIG.storagePrefix);
        this.ui = new UIManager(this.db);
        this.auth = new AuthSystem(this.db, this.ui);
        this.economy = new EconomySystem(this.db, this.ui);
        this.clicker = new ClickerSystem(this.db, this.ui);
        this.shop = new ShopSystem(this.db, this.ui);
        this.chat = new ChatSystem(this.db, this.ui);
        this.friends = new FriendsSystem(this.db, this.ui);
        this.moderation = new ModerationSystem(this.db, this.ui);
        this.admin = new AdminSystem(this.db, this.ui);
        this.profile = new ProfileSystem(this.db, this.ui);
        this.settings = new SettingsSystem(this.db, this.ui);
      }
      start() {
        this.db.seed();
        this.db.checkVersion(this.ui);
        this.auth.init();
        S.timers.push(setInterval(() => this.economy.regenerateEnergy(), 1000));
        S.timers.push(setInterval(() => this.economy.passiveTick(), 1000));
        S.timers.push(setInterval(() => this.ui.syncLiveState(), 3000));
        S.timers.push(setInterval(() => this.ui.saveCurrentUser(), 15000));
        window.addEventListener("beforeunload", () => this.ui.saveCurrentUser());
      }
    }

    const app = new TgXqApp();
    app.start();
  </script>
